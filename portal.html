<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUROBOROS ENGINE - ARE-Logic Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); min-height: 100vh; color: white; }
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    h1 { font-size: 48px; text-align: center; background: linear-gradient(90deg, #22d3ee, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #94a3b8; font-size: 20px; margin-bottom: 10px; }
    .contract { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .app { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; border-radius: 16px; padding: 24px; cursor: pointer; transition: all 0.2s; text-align: left; }
    .app:hover { border-color: #22d3ee; background: rgba(30, 41, 59, 0.8); transform: scale(1.02); }
    .app-icon { font-size: 36px; margin-bottom: 12px; }
    .app-name { font-weight: bold; font-size: 18px; margin-bottom: 4px; }
    .app-name-de { font-size: 12px; color: #64748b; margin-bottom: 8px; }
    .app-status { display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: 12px; }
    .status-ready { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .status-beta { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    .detail-view { display: none; }
    .detail-view.active { display: block; }
    .back-btn { background: #334155; color: white; padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; margin-bottom: 20px; font-size: 16px; }
    .detail-content { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; border-radius: 16px; padding: 40px; }
    .detail-title { font-size: 36px; margin-bottom: 20px; }
    footer { text-align: center; margin-top: 60px; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="portal-view">
      <h1>OUROBOROS ENGINE</h1>
      <p class="subtitle">ARE-Logic Platform • 30 Industrial Applications</p>
      <p class="contract">German Government Contract • Powered by Stateless Determinism</p>
      <div class="grid" id="apps-grid"></div>
    </div>
    
    <div class="detail-view" id="detail-view">
      <button class="back-btn" onclick="showPortal()">← Back</button>
      <div class="detail-content">
        <h2 class="detail-title" id="detail-title"></h2>
        <div id="detail-content"></div>
      </div>
    </div>
    
    <footer>
      <p>© 2026 Ouroboros Collective • German Government Contract</p>
      <p>ARE-Logic: Stateless Determinism | O(1) | 10-Hz Tick System</p>
    </footer>
  </div>

  <script>
    const apps = [
      { id: 'robot-arm', name: 'Robot Arm', nameDE: 'Roboterarm', icon: '🦾', status: 'ready', content: '<h3>Industrial Robot Control System</h3><p>Advanced robotic arm control interface with real-time monitoring, precision positioning, and programmable automation sequences.</p><div style="margin-top:20px"><button style="background:#22d3ee;color:#0f172a;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:bold">Start Demo</button></div>' },
      { id: 'medical-console', name: 'Medical Console', nameDE: 'Medizin-Konsole', icon: '🏥', status: 'ready', content: '<h3>Medical Monitoring Console</h3><p>Real-time patient vital signs monitoring, ECG display, and alert system.</p><div style="margin-top:20px"><p style="color:#4ade80">♥ BPM: 72</p><p style="color:#4ade80">🩸 120/80 mmHg</p><p style="color:#4ade80">🌡️ 36.6°C</p></div>' },
      { id: 'logistics', name: 'Logistics Hub', nameDE: 'Logistik', icon: '📦', status: 'ready', content: '<h3>Warehouse Management</h3><p>Inventory tracking, automated routing, and distribution management.</p><div style="margin-top:20px"><p>📍 Warehouse A: 12,450 items</p><p>📍 Warehouse B: 8,320 items</p><p>🚚 Routes: 24 active</p></div>' },
      { id: 'school-portal', name: 'School Portal', nameDE: 'Schul-Portal', icon: '🏫', status: 'ready', content: '<h3>School Management System</h3><p>Student records, class scheduling, grades, and attendance tracking.</p><div style="margin-top:20px"><p>👥 1,245 Students</p><p>👨‍🏫 45 Teachers</p><p>📚 32 Classes</p><p>📊 Avg Grade: 2.1</p></div>' },
      { id: 'logic-grid', name: 'Logic Grid', nameDE: 'Logik-Gitter', icon: '🧮', status: 'ready', content: '<h3>Programming Education</h3><p>Interactive coding lessons and exercises.</p><div style="margin-top:20px"><p>📚 10 Exercises</p><p>✅ 4 Completed</p><p>🔲 6 Remaining</p></div>' },
      { id: 'science-portal', name: 'Science Portal', nameDE: 'Wissens-Portal', icon: '🔬', status: 'ready', content: '<h3>Interactive Science Education</h3><p>Virtual experiments and simulations.</p><div style="margin-top:20px"><p>🧪 6 Experiments</p><p>🪐 Solar System</p><p>⚛️ Atom Model</p><p>🧬 DNA Structure</p></div>' },
      { id: 'agri-sim', name: 'Agri-Sim', nameDE: 'Agrar-Sim', icon: '🌾', status: 'ready', content: '<h3>Agricultural Simulation</h3><p>Crop management, irrigation control, and harvest prediction.</p><div style="margin-top:20px"><p>🌾 Wheat: 85% growth</p><p>🌽 Corn: 62% growth</p><p>💧 Soil moisture: Optimal</p></div>' },
      { id: 'urban-flow', name: 'Urban Flow', nameDE: 'Stadtfluss', icon: '🌆', status: 'ready', content: '<h3>Traffic Management</h3><p>Real-time traffic monitoring and signal optimization.</p><div style="margin-top:20px"><p>🚗 Traffic: Moderate</p><p>⏱️ Avg delay: 2min</p><p>🚦 Signals: 24 active</p></div>' },
      { id: 'fitness', name: 'Fitness', nameDE: 'Fitness', icon: '💪', status: 'ready', content: '<h3>Fitness Tracker</h3><p>Workout logging, progress tracking, and goal setting.</p><div style="margin-top:20px"><p>👟 Today: 8,432 steps</p><p>🔥 420 kcal</p><p>⏱️ Active: 45min</p></div>' },
      { id: 'crypto-pulse', name: 'Crypto Pulse', nameDE: 'Krypto-Puls', icon: '💰', status: 'ready', content: '<h3>Cryptocurrency Dashboard</h3><p>Real-time crypto prices and portfolio tracking.</p><div style="margin-top:20px"><p>₿ Bitcoin: $67,234</p><p>Ξ Ethereum: $3,456</p><p>📈 24h: +2.3%</p></div>' },
      { id: 'eco-trader', name: 'Eco-Trader', nameDE: 'Öko-Händler', icon: '🌱', status: 'ready', content: '<h3>Carbon Trading Platform</h3><p>Carbon credit marketplace and emissions tracking.</p><div style="margin-top:20px"><p>💚 Credits: 15,420</p><p>💶 Price: €45/ton</p><p>📊 Reduced: 234 tons</p></div>' },
      { id: 'social', name: 'Social Hub', nameDE: 'Sozial-Hub', icon: '🌐', status: 'ready', content: '<h3>Community Platform</h3><p>Social networking and community management.</p><div style="margin-top:20px"><p>👥 Members: 24,532</p><p>💬 Online: 1,234</p><p>📝 Posts: 892 today</p></div>' },
      { id: 'arena', name: 'Arena', nameDE: 'Arena', icon: '⚔️', status: 'ready', content: '<h3>Gaming Arena</h3><p>Multiplayer gaming platform with tournaments.</p><div style="margin-top:20px"><p>🎮 Active games: 24</p><p>👥 Players: 156</p><p>🏆 Tournament: Live</p></div>' },
      { id: 'edu-sim', name: 'Edu-Sim', nameDE: 'Bildungs-Sim', icon: '📚', status: 'ready', content: '<h3>Educational Simulation</h3><p>Interactive learning experiences.</p><div style="margin-top:20px"><p>📖 Courses: 45</p><p>🎓 Students: 3,240</p><p>⭐ Rating: 4.8/5</p></div>' },
    ];

    function showPortal() {
      document.getElementById('portal-view').style.display = 'block';
      document.getElementById('detail-view').classList.remove('active');
    }

    function showApp(id) {
      const app = apps.find(a => a.id === id);
      if (app) {
        document.getElementById('portal-view').style.display = 'none';
        document.getElementById('detail-view').classList.add('active');
        document.getElementById('detail-title').innerHTML = app.icon + ' ' + app.name + ' <span style="font-size:16px;color:#64748b">' + app.nameDE + '</span>';
        document.getElementById('detail-content').innerHTML = app.content;
      }
    }

    // Render apps
    const grid = document.getElementById('apps-grid');
    grid.innerHTML = apps.map(app => 
      '<div class="app" onclick="showApp(\'' + app.id + '\')">' +
        '<div class="app-icon">' + app.icon + '</div>' +
        '<div class="app-name">' + app.name + '</div>' +
        '<div class="app-name-de">' + app.nameDE + '</div>' +
        '<span class="app-status ' + (app.status === 'ready' ? 'status-ready' : 'status-beta') + '">' + 
        (app.status === 'ready' ? '✓ Ready' : 'Beta') + '</span>' +
      '</div>'
    ).join('');
  </script>
</body>
</html>
