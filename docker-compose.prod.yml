version: '3.8'

services:
  app:
    image: ${DOCKER_REGISTRY:-local}/areloria:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    env_file:
      - .env.prod
    ports:
      - "80:3000"
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge