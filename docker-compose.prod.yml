version: '3.8'

services:
  app:
    image: ${DOCKER_REGISTRY:-local}/areloria:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      QUEST_STATE_FILE: /app/data/quest-state.json
    env_file:
      - .env.prod
    volumes:
      - quest-data:/app/data
    ports:
      - "80:3000"
    networks:
      - frontend_net

volumes:
  quest-data:

networks:
  frontend_net:
    driver: bridge