[package]
name = "project"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
git2 = "0.18"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-javascript = "0.20"
indicatif = "0.17"
sha2 = "0.10"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
dashmap = "5.5"

[[bin]]
name = "logic_validator"
path = "src/logic_validator.rs"