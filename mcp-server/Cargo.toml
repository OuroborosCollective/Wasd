[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Minimal deterministic MCP JSON-RPC server"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1.38", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "io-std",
  "io-util",
  "sync",
  "time"
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

anyhow = "1.0"
thiserror = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "std",
  "ansi"
] }

async-trait = "0.1"
schemars = { version = "0.8", features = ["derive"] }

bytes = "1.6"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[profile.dev]
debug = true
overflow-checks = true
incremental = true

[profile.release]
strip = true
opt-level = "s"
lto = "fat"
codegen-units = 1
overflow-checks = true
debug = false
incremental = false

[profile.release.package."*"]
opt-level = "s"
