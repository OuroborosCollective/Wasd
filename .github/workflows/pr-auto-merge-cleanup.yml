name: PR Auto Merge & Cleanup

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  statuses: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ----------------------------------------------------------------
  # JOB: Process PR - Auto-merge safe PRs with passing CI
  # Closes harmful PRs or PRs with failing CI
  # ----------------------------------------------------------------
  process-pr:
    runs-on: ubuntu-latest
    outputs:
      is_harmful: ${{ steps.evaluate.outputs.is_harmful }}
      ci_passed: ${{ steps.wait_ci.outputs.ci_passed }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_author: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Evaluate PR safety
        id: evaluate
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          IS_HARMFUL="false"

          echo "Evaluating PR #${{ github.event.pull_request.number }} by $PR_AUTHOR"

          # Block known harmful/suspicious patterns
          case "$PR_TITLE|$PR_BODY" in
            *crypto-miner*|*cryptominer*|*bitcoin-miner*|*coin-hive*)
              echo "BLOCKED: Crypto miner detected"
              IS_HARMFUL="true"
              ;;
            *remote-code-exec*|*rce*|*exec\(.*\)*eval\(*)
              echo "BLOCKED: RCE pattern detected"
              IS_HARMFUL="true"
              ;;
            *obfuscator*|*deobfuscator*|*shellcode*)
              echo "BLOCKED: Obfuscation/shellcode detected"
              IS_HARMFUL="true"
              ;;
            *password.*log*|*secret.*exfil*|*credential.*steal*)
              echo "BLOCKED: Credential theft pattern detected"
              IS_HARMFUL="true"
              ;;
            *backdoor*|*rootkit*|*keylogger*)
              echo "BLOCKED: Backdoor/rootkit detected"
              IS_HARMFUL="true"
              ;;
          esac

          echo "is_harmful=$IS_HARMFUL" >> "$GITHUB_OUTPUT"

      - name: Wait for CI checks
        id: wait_ci
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "Waiting for CI checks on PR #$PR_NUM (SHA: $SHA)..."

          CI_PASSED="false"

          for i in {1..180}; do
            # Get status checks
            CHECKS=$(curl -s -L \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/statuses" \
              | jq -r '.[].state // empty')

            if [ -z "$CHECKS" ]; then
              CHECKS=$(curl -s -L \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/check-runs" \
                | jq -r '.check_runs[] | .conclusion // empty' | grep -v '^$' | head -20)
            fi

            if [ -n "$CHECKS" ]; then
              if echo "$CHECKS" | grep -q "^failure$" || echo "$CHECKS" | grep -q "^error$"; then
                echo "CI FAILED"
                echo "ci_passed=false" >> "$GITHUB_OUTPUT"
                exit 0
              elif echo "$CHECKS" | grep -qv "^failure$" && echo "$CHECKS" | grep -qv "^error$" && echo "$CHECKS" | grep -qv "in_progress" && echo "$CHECKS" | grep -qv "pending" && echo "$CHECKS" | grep -qv "queued"; then
                echo "CI PASSED"
                CI_PASSED="true"
                echo "ci_passed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            echo "CI still running... ($i/180)"
            sleep 10
          done

          echo "CI timeout"
          echo "ci_passed=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Auto-merge safe PR with passing CI
        if: steps.wait_ci.outputs.ci_passed == 'true' && steps.evaluate.outputs.is_harmful == 'false'
        run: |
          echo "✓ Auto-merging PR #${{ github.event.pull_request.number }}"
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close harmful PR
        if: steps.evaluate.outputs.is_harmful == 'true'
        run: |
          echo "✗ Closing harmful PR #${{ github.event.pull_request.number }}"
          gh pr close "${{ github.event.pull_request.html_url }}" --delete-branch --comment "Closed by automated PR cleanup. Harmful/suspicious patterns detected."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close PR with failing CI
        if: steps.wait_ci.outputs.ci_passed == 'false' && steps.evaluate.outputs.is_harmful == 'false'
        run: |
          echo "✗ Closing PR #${{ github.event.pull_request.number }} due to CI failure"
          gh pr close "${{ github.event.pull_request.html_url }}" --delete-branch --comment "Closed by automated PR cleanup. CI checks failed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
