name: Reusable WASM and Agent Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (e.g., staging, production)'
        required: true
        type: string
      artifact-name:
        description: 'Name of the artifact to download'
        required: true
        type: string
      deploy-path:
        description: 'Target path or namespace for the deployment'
        required: false
        default: 'latest'
        type: string
    secrets:
      DEPLOY_TOKEN:
        description: 'Authentication token for the deployment target'
        required: true
      REGISTRY_URL:
        description: 'URL of the WASM/Agent registry'
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ./dist

