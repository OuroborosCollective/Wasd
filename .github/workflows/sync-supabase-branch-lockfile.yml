name: One-shot Supabase Branch Lockfile Sync

on:
  pull_request:
    paths:
      - '.github/workflows/sync-supabase-branch-lockfile.yml'
      - 'package.json'
      - 'server/package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

concurrency:
  group: one-shot-lockfile-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/supabase-db-runtime-truth'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate lockfile only
        id: generate
        shell: bash
        run: |
          set +e
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts > /tmp/pnpm-lockfile-sync.log 2>&1
          status=$?
          cat /tmp/pnpm-lockfile-sync.log
          exit "$status"

      - name: Upload pnpm diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile-sync-log
          path: /tmp/pnpm-lockfile-sync.log
          if-no-files-found: error
          retention-days: 1

      - name: Guard changed files
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${changed[@]}"
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "pnpm-lock.yaml" ]; then
            echo "Unexpected files changed during lockfile-only generation" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit synchronized lockfile
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): synchronize workspace importers"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
