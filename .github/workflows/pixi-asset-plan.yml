name: Pixi Asset Plan

on:
  pull_request:
    paths:
      - scripts/import-pixi-dev-hub-assets.mjs
      - scripts/import-kenney-ui-pack.mjs
      - scripts/validate-pixi-assets.mjs
      - scripts/scan-pixi-asset-inbox.mjs
      - scripts/validate-pixi-import-batches.mjs
      - .asset-inbox/pixi/**
      - public/archive/wasd-pixi-asset-packs.json
      - docs/archive/pixi-first-batch-source-metadata.json
      - docs/archive/pixi-first-batch-download-allowlist.json
      - docs/archive/import-batches/**
      - apps/client-2d/public/2d-assets/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pixi-asset-plan.yml
  push:
    branches:
      - main
    paths:
      - scripts/import-pixi-dev-hub-assets.mjs
      - scripts/import-kenney-ui-pack.mjs
      - scripts/validate-pixi-assets.mjs
      - scripts/scan-pixi-asset-inbox.mjs
      - scripts/validate-pixi-import-batches.mjs
      - .asset-inbox/pixi/**
      - public/archive/wasd-pixi-asset-packs.json
      - docs/archive/pixi-first-batch-source-metadata.json
      - docs/archive/pixi-first-batch-download-allowlist.json
      - docs/archive/import-batches/**
      - apps/client-2d/public/2d-assets/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pixi-asset-plan.yml

permissions:
  contents: read

concurrency:
  group: pixi-asset-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixi-asset-plan:
    name: Pixi asset scan, plan and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan Pixi asset inbox
        run: pnpm assets:pixi:scan-inbox

      - name: Run Pixi asset plan dry-run
        run: pnpm assets:pixi:plan

      - name: Validate Pixi assets
        run: pnpm assets:pixi:validate

      - name: Validate Pixi import batches
        run: pnpm assets:pixi:validate-batches
