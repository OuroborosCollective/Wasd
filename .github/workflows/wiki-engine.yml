name: Autonomous Wiki Engine

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "server/src/**"
      - "client/src/**"
      - "apps/**"
      - "packages/**"
      - "scripts/wiki/**"
      - ".github/workflows/wiki-engine.yml"
      - "AGENTS.md"
      - "README.md"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without pushing to wiki"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      rebuild_all:
        description: "Rebuild all generated wiki pages"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: autonomous-wiki-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  NODE_VERSION: "22"
  WIKI_SOURCE_DIR: "docs/wiki"
  WIKI_BUILD_DIR: ".wiki-build"

jobs:
  build-wiki:
    name: Build Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "📂 Verifying source tree..."

          if [ ! -d "docs" ]; then
            echo "::error::Missing docs directory"
            exit 1
          fi

          if [ ! -d "$WIKI_SOURCE_DIR" ]; then
            echo "::warning::Wiki source directory not found, creating..."
            mkdir -p "$WIKI_SOURCE_DIR"
          fi

          if [ ! -d "scripts/wiki" ]; then
            echo "::error::Missing scripts/wiki directory"
            exit 1
          fi

          echo "✅ Source tree valid"

          # Show what changed
          echo ""
          echo "📝 Recent changes:"
          git diff --stat HEAD~5..HEAD -- docs/ server/src/ apps/ scripts/wiki/ 2>/dev/null || true

      - name: Generate autonomous wiki
        id: build
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REBUILD: ${{ github.event.inputs.rebuild_all || 'true' }}
        run: |
          set -euo pipefail

          echo "🧠 Building Autonomous Wiki..."
          echo "Current directory: $(pwd)"
          echo "WIKI_SOURCE_DIR: $WIKI_SOURCE_DIR"
          echo "WIKI_BUILD_DIR: $WIKI_BUILD_DIR"
          echo ""

          # Debug: Check if script exists
          if [ ! -f "scripts/wiki/build-autonomous-wiki.mjs" ]; then
            echo "::error::Script not found: scripts/wiki/build-autonomous-wiki.mjs"
            ls -la scripts/wiki/
            exit 1
          fi

          # Debug: Check if source exists
          if [ ! -d "$WIKI_SOURCE_DIR" ]; then
            echo "::warning::Wiki source directory not found, creating: $WIKI_SOURCE_DIR"
            mkdir -p "$WIKI_SOURCE_DIR"
          fi

          # Run build script
          node scripts/wiki/build-autonomous-wiki.mjs \
            --source "$WIKI_SOURCE_DIR" \
            --out "$WIKI_BUILD_DIR" \
            --rebuild "$REBUILD"
          BUILD_EXIT_CODE=$?

          echo ""
          echo "✅ Build exit code: $BUILD_EXIT_CODE"

          # Show generated files
          echo ""
          echo "📄 Generated wiki pages:"
          if [ -d "$WIKI_BUILD_DIR" ]; then
            ls -la "$WIKI_BUILD_DIR/"
            echo "Files count: $(find "$WIKI_BUILD_DIR" -name "*.md" | wc -l)"
          else
            echo "::error::WIKI_BUILD_DIR not created: $WIKI_BUILD_DIR"
            exit 1
          fi

          # Exit with build result
          exit $BUILD_EXIT_CODE

      - name: Upload wiki build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-build
          path: ${{ env.WIKI_BUILD_DIR }}
          retention-days: 1
          if-no-files-found: error

  validate-wiki:
    name: Validate Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-wiki

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download wiki build
        uses: actions/download-artifact@v4
        with:
          name: wiki-build
          path: ${{ env.WIKI_BUILD_DIR }}

      - name: Run validation
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          echo "🔍 Validating wiki content..."
          echo ""

          # Run validation (allow warnings but not errors)
          if node scripts/wiki/validate-wiki.mjs --dir "$WIKI_BUILD_DIR" --no-fail; then
            echo ""
            echo "✅ Validation passed"
          else
            EXIT_CODE=$?
            echo ""
            echo "⚠️ Validation completed with issues"
            exit $EXIT_CODE
          fi

  sync-wiki:
    name: Sync to GitHub Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-wiki
    if: ${{ github.event.inputs.dry_run != 'true' }}

    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download wiki build
        uses: actions/download-artifact@v4
        with:
          name: wiki-build
          path: ${{ env.WIKI_BUILD_DIR }}

      - name: Sync to Wiki
        if: env.DRY_RUN == 'false'
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "🚀 Syncing to GitHub Wiki..."
          echo ""

          # Use WIKI_TOKEN if available, otherwise GITHUB_TOKEN
          if [ -n "${WIKI_TOKEN:-}" ]; then
            export GITHUB_TOKEN="$WIKI_TOKEN"
            echo "Using WIKI_TOKEN"
          else
            echo "Using GITHUB_TOKEN"
          fi

          node scripts/wiki/push-wiki.mjs \
            --dir "$WIKI_BUILD_DIR" \
            --dry-run "false"

          echo ""
          echo "✅ Wiki sync complete"

      - name: Dry Run Preview
        if: env.DRY_RUN == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "🔍 DRY RUN MODE"
          echo ""

          node scripts/wiki/push-wiki.mjs \
            --dir "$WIKI_BUILD_DIR" \
            --dry-run "true"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build-wiki, validate-wiki, sync-wiki]
    if: always()

    steps:
      - name: Generate Summary
        shell: bash
        run: |
          echo "## Autonomous Wiki Engine" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Trigger" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rebuild all: ${{ github.event.inputs.rebuild_all || 'true' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Jobs" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Build: ${{ needs.build-wiki.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Validate: ${{ needs.validate-wiki.result }}" >> "$GITHUB_STEP_SUMMARY"
          if ${{ github.event.inputs.dry_run != 'true' }}
          echo "- ✅ Sync: ${{ needs.sync-wiki.result }}" >> "$GITHUB_STEP_SUMMARY"
          else
          echo "- ⏭️ Sync: Skipped (dry-run)" >> "$GITHUB_STEP_SUMMARY"
          fi