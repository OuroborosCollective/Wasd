name: Autonomous Wiki Engine

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "server/src/**"
      - "client/src/**"
      - "apps/**"
      - "packages/**"
      - "scripts/wiki/**"
      - ".github/workflows/wiki-engine.yml"
      - "AGENTS.md"
      - "README.md"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without pushing to wiki"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      rebuild_all:
        description: "Rebuild all generated wiki pages"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: autonomous-wiki-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  NODE_VERSION: "22.23.2"
  WIKI_SOURCE_DIR: "docs/wiki"
  WIKI_BUILD_DIR: ".wiki-build"

jobs:
  wiki-engine:
    name: Autonomous Wiki Engine
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying source tree..."

          if [ ! -d "docs" ]; then
            echo "::error::Missing docs directory"
            exit 1
          fi

          if [ ! -d "$WIKI_SOURCE_DIR" ]; then
            echo "::warning::Wiki source directory not found, creating..."
            mkdir -p "$WIKI_SOURCE_DIR"
          fi

          if [ ! -d "scripts/wiki" ]; then
            echo "::error::Missing scripts/wiki directory"
            exit 1
          fi

          echo "Source tree valid"

          # Show what changed
          echo ""
          echo "Recent changes:"
          git diff --stat HEAD~5..HEAD -- docs/ server/src/ apps/ scripts/wiki/ 2>/dev/null || true

      - name: Generate autonomous wiki
        id: build
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REBUILD: ${{ github.event.inputs.rebuild_all || 'true' }}
        run: |
          set -euo pipefail

          echo "Building Autonomous Wiki..."

          # Debug: Check if script exists
          if [ ! -f "scripts/wiki/build-autonomous-wiki.mjs" ]; then
            echo "::error::Script not found: scripts/wiki/build-autonomous-wiki.mjs"
            ls -la scripts/wiki/
            exit 1
          fi

          # Run build script
          node scripts/wiki/build-autonomous-wiki.mjs \
            --source "$WIKI_SOURCE_DIR" \
            --out "$WIKI_BUILD_DIR" \
            --rebuild "$REBUILD"

          echo ""
          echo "Build complete"

          # Show generated files
          echo ""
          echo "Generated wiki pages:"
          ls -la "$WIKI_BUILD_DIR/"
          echo "Files count: $(find "$WIKI_BUILD_DIR" -name "*.md" | wc -l)"

      - name: Normalize generated wiki pages
        shell: bash
        run: |
          set -euo pipefail

          echo "Normalizing generated wiki special pages..."

          if [ -f "$WIKI_BUILD_DIR/_Sidebar.md" ] && ! grep -qE '^#\s+' "$WIKI_BUILD_DIR/_Sidebar.md"; then
            tmp="$(mktemp)"
            printf '# Areloria Codex Sidebar\n\n' > "$tmp"
            cat "$WIKI_BUILD_DIR/_Sidebar.md" >> "$tmp"
            mv "$tmp" "$WIKI_BUILD_DIR/_Sidebar.md"
          fi

          if [ -f "$WIKI_BUILD_DIR/_Footer.md" ]; then
            cat > "$WIKI_BUILD_DIR/_Footer.md" <<'EOF'
# Areloria Wiki Footer

**Areloria** — Deterministic Browser MMORPG Engine.

This footer is generated by the Autonomous Wiki Engine and keeps the public wiki connected to repository docs, project issues, and the current Codex sync cycle.

- [View on GitHub](https://github.com/OuroborosCollective/Wasd)
- [Report an Issue](https://github.com/OuroborosCollective/Wasd/issues)
- [Project Docs](https://github.com/OuroborosCollective/Wasd/tree/main/docs)

---

*Auto-generated by Areloria Codex Engine.*
EOF
          fi

      - name: Validate wiki content
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating wiki content..."

          # Run validation (allow warnings but not errors)
          if node scripts/wiki/validate-wiki.mjs --dir "$WIKI_BUILD_DIR" --no-fail; then
            echo ""
            echo "Validation passed"
          else
            EXIT_CODE=$?
            echo ""
            echo "Validation completed with issues"
            exit $EXIT_CODE
          fi

      - name: Sync to GitHub Wiki
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Syncing to GitHub Wiki..."

          # Use WIKI_TOKEN if available, otherwise GITHUB_TOKEN
          if [ -n "${WIKI_TOKEN:-}" ]; then
            export GITHUB_TOKEN="$WIKI_TOKEN"
            echo "Using WIKI_TOKEN"
          else
            echo "Using GITHUB_TOKEN"
          fi

          node scripts/wiki/push-wiki.mjs \
            --dir "$WIKI_BUILD_DIR" \
            --dry-run "false"

          echo ""
          echo "Wiki sync complete"

      - name: Dry Run Preview
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "DRY RUN MODE"

          node scripts/wiki/push-wiki.mjs \
            --dir "$WIKI_BUILD_DIR" \
            --dry-run "true"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Autonomous Wiki Engine" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Trigger" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rebuild all: ${{ github.event.inputs.rebuild_all || 'true' }}" >> "$GITHUB_STEP_SUMMARY"
