name: Narrative-Engine

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  trigger-operation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Execute VPSAutonomousOperationService Trigger
        if: env.VPS_ENDPOINT != ''
        env:
          VPS_ENDPOINT: ${{ secrets.VPS_ENDPOINT }}
          VPS_AUTH_TOKEN: ${{ secrets.VPS_AUTH_TOKEN }}
        run: |
          if [ -z "$VPS_ENDPOINT" ]; then
            echo "VPS_ENDPOINT not set, skipping trigger."
          else
            # Hardened curl with retries and timeout handling
            # Exit code 28 (Operation timeout) is caught to prevent CI failure during transient VPS outages
            curl -X POST "$VPS_ENDPOINT" \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $VPS_AUTH_TOKEN" \
            -d "{
              \"event\": \"${{ github.event_name }}\",
              \"repository\": \"${{ github.repository }}\",
              \"commit\": \"${{ github.sha }}\",
              \"ref\": \"${{ github.ref }}\",
              \"service\": \"VPSAutonomousOperationService\",
              \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"
            }" || {
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 28 ]; then
                echo "Warning: Connection to VPS timed out (exit code 28). Ignoring to prevent blocking CI."
                exit 0
              else
                echo "Error: VPS trigger failed with exit code $EXIT_CODE"
                exit $EXIT_CODE
              fi
            }
          fi
