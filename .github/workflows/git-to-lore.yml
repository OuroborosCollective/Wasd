name: Narrative-Engine

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  trigger-operation:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Execute VPSAutonomousOperationService Trigger
        if: env.VPS_ENDPOINT != ''
        env:
          VPS_ENDPOINT: ${{ secrets.VPS_ENDPOINT }}
          VPS_AUTH_TOKEN: ${{ secrets.VPS_AUTH_TOKEN }}
        run: |
          if [ -z "$VPS_ENDPOINT" ]; then
            echo "VPS_ENDPOINT not set, skipping trigger."
          else
            # ⚡ Bolt Optimization: Use retries and timeouts for CI reliability.
            # Catch exit code 28 (timeout) to prevent transient network issues from blocking CI.
            EXIT_CODE=0
            curl -X POST "$VPS_ENDPOINT" \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $VPS_AUTH_TOKEN" \
            -d "{
              \"event\": \"${{ github.event_name }}\",
              \"repository\": \"${{ github.repository }}\",
              \"commit\": \"${{ github.sha }}\",
              \"ref\": \"${{ github.ref }}\",
              \"service\": \"VPSAutonomousOperationService\",
              \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"
            }" || EXIT_CODE=$?

            if [ "$EXIT_CODE" -eq 28 ]; then
              echo "VPS trigger timed out after retries. Bypassing failure to prevent CI interruption."
              exit 0
            elif [ "$EXIT_CODE" -ne 0 ]; then
              echo "VPS trigger failed with exit code $EXIT_CODE."
              exit "$EXIT_CODE"
            fi
          fi
