name: Narrative-Engine

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  trigger-operation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute VPSAutonomousOperationService Trigger
        if: env.VPS_ENDPOINT != ''
        env:
          VPS_ENDPOINT: ${{ secrets.VPS_ENDPOINT }}
          VPS_AUTH_TOKEN: ${{ secrets.VPS_AUTH_TOKEN }}
        run: |
          curl -X POST "$VPS_ENDPOINT" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $VPS_AUTH_TOKEN" \
          -d "{
            \"event\": \"${{ github.event_name }}\",
            \"repository\": \"${{ github.repository }}\",
            \"commit\": \"${{ github.sha }}\",
            \"ref\": \"${{ github.ref }}\",
            \"service\": \"VPSAutonomousOperationService\",
            \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"
          }"