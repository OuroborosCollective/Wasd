name: Narrative-Engine

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  trigger-operation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Execute VPSAutonomousOperationService Trigger
        if: env.VPS_ENDPOINT != ''
        env:
          VPS_ENDPOINT: ${{ secrets.VPS_ENDPOINT }}
          VPS_AUTH_TOKEN: ${{ secrets.VPS_AUTH_TOKEN }}
        run: |
          if [ -z "$VPS_ENDPOINT" ]; then
            echo "VPS_ENDPOINT not set, skipping trigger."
          else
            curl -f -X POST "$VPS_ENDPOINT" \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $VPS_AUTH_TOKEN" \
            -d "{
              \"event\": \"${{ github.event_name }}\",
              \"repository\": \"${{ github.repository }}\",
              \"commit\": \"${{ github.sha }}\",
              \"ref\": \"${{ github.ref }}\",
              \"service\": \"VPSAutonomousOperationService\",
              \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"
            }" || [ $? -eq 28 ]
          fi
