name: Areloria Architecture Lint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm --version

      - name: Run monorepo guard
        id: monorepo_guard
        continue-on-error: true
        run: pnpm guard:monorepo

      - name: Run architecture guard
        run: pnpm guard:architecture

      - name: Stop on monorepo guard failure
        if: steps.monorepo_guard.outcome != 'success'
        run: exit 1

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm build:2d
