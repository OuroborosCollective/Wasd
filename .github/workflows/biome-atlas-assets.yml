name: Biome Atlas Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - asset-packs/2d/biomes/biome_atlas_v2.zip
      - scripts/extract-biome-atlas-v2.mjs
      - .github/workflows/biome-atlas-assets.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: biome-atlas-assets
  cancel-in-progress: true

jobs:
  extract-and-pr:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Extract biome atlas
        run: |
          set -euo pipefail
          test -f asset-packs/2d/biomes/biome_atlas_v2.zip
          unzip -l asset-packs/2d/biomes/biome_atlas_v2.zip | head -80
          unzip -l asset-packs/2d/biomes/biome_atlas_v2.zip | grep -q 'biome_atlas/manifest.json'
          node scripts/extract-biome-atlas-v2.mjs
          test -f apps/client-2d/public/2d-assets/biomes/biome_atlas_v2/manifest.json
          test -f apps/client-2d/public/2d-assets/biomes/biome_atlas_v2/forest-manifest.json
          find apps/client-2d/public/2d-assets/biomes/biome_atlas_v2 -maxdepth 3 -type f | sort | head -160

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/biome-atlas-public-assets
          delete-branch: true
          commit-message: "chore(client-2d): update biome atlas public assets"
          title: "Update biome atlas public assets"
          body: |
            Generated from asset-packs/2d/biomes/biome_atlas_v2.zip.

            Output path:
            apps/client-2d/public/2d-assets/biomes/biome_atlas_v2/
          add-paths: |
            apps/client-2d/public/2d-assets/biomes/biome_atlas_v2
