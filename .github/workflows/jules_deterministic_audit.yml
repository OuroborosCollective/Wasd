name: Jules Deterministic Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit_logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile --loglevel verbose || pnpm install --no-frozen-lockfile
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Build Server
        run: |
          NODE_OPTIONS="--max-old-space-size=6144" pnpm --filter @wasd/server run build

      - name: Lint Server
        run: |
          pnpm --filter @wasd/server run lint
