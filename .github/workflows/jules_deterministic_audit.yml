name: Jules Deterministic Audit

on:
  pull_request:
    branches:
      - main

jobs:
  audit_logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Server
        run: pnpm --filter @wasd/server run build

      - name: Lint Server
        run: pnpm --filter @wasd/server run lint
