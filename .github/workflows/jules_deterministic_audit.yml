name: Jules Deterministic Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit_logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile --loglevel info || pnpm install --no-frozen-lockfile
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"

      # Deterministic gates: shared + server must stay type-clean.
      - name: Build @wasd/types
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/types run build

      - name: Build @wasd/shared (emit declarations)
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/shared exec tsc

      - name: Build @wasd/core-logic (emit declarations)
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/core-logic run build

      - name: Typecheck @wasd/server (tsc --noEmit)
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/server exec tsc --noEmit

      - name: Typecheck @wasd/portal
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/portal exec tsc --noEmit

      - name: Test @wasd/portal (vitest)
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/portal run test
