name: Jules Deterministic Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit_logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
                    run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts --loglevel info || pnpm install --no-frozen-lockfile
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"

      # Deterministic gates: shared + server must stay type-clean.
      - name: Build @wasd/shared
        run: |
          pnpm --filter @wasd/shared build

      - name: Typecheck @wasd/shared
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/shared run typecheck

      - name: Typecheck @wasd/core-logic
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/core-logic run typecheck

      - name: Typecheck @wasd/server (tsc --noEmit)
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/server exec tsc --noEmit

      - name: Typecheck @wasd/portal
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/portal exec tsc --noEmit

      - name: Test @wasd/portal (vitest)
        run: |
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/portal run test

      # ARE Core Reality Alignment Audit (Phase 8-10)
      - name: Run Core Reality Alignment Audit
        run: |
          echo "=== Core Reality Alignment Audit ==="
          node scripts/audit-core-reality-alignment.mjs --json
