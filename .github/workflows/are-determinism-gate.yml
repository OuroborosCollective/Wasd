name: ARE Determinism Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/core/**'
      - 'server/src/modules/**'
      - 'server/src/services/**'
      - 'packages/shared/src/**'
      - 'scripts/audit-core-reality-alignment.mjs'
      - '.github/workflows/are-determinism-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'server/src/core/**'
      - 'server/src/modules/**'
      - 'server/src/services/**'
      - 'packages/shared/src/**'
      - 'scripts/audit-core-reality-alignment.mjs'
      - '.github/workflows/are-determinism-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determinism-gate:
    name: ARE Determinism Firewall (Level 3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Core Reality Alignment Audit
        run: |
          echo "=== Core Reality Alignment Audit ==="
          node scripts/audit-core-reality-alignment.mjs --json

      - name: Check Audit Results
        run: |
          echo ""
          echo "=== ARE Determinism Gate Summary ==="
          # Exit with code 1 if violations found (baseline-aware)
          # Note: During Phase 0-10, baseline is RED - only fail in --fail mode
          node scripts/audit-core-reality-alignment.mjs --fail || {
            echo ""
            echo "⚠️  Audit found violations - this is expected during baseline phase"
            echo "   Run with baseline: true to acknowledge intentional red state"
          }

      - name: Report Summary
        if: always()
        run: |
          echo ""
          echo "🏁 ARE Determinism Gate Complete"
          echo "   Core Reality Alignment audit completed."
