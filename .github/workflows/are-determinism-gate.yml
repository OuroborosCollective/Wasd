name: ARE Determinism Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/core/**'
      - 'server/src/modules/**'
      - 'server/src/services/**'
      - 'packages/shared/src/**'
      - 'scripts/check-are-determinism.mjs'
      - 'scripts/check-determinism-gate.mjs'
      - '.github/workflows/are-determinism-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'server/src/core/**'
      - 'server/src/modules/**'
      - 'server/src/services/**'
      - 'packages/shared/src/**'
      - 'scripts/check-are-determinism.mjs'
      - 'scripts/check-determinism-gate.mjs'
      - '.github/workflows/are-determinism-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determinism-gate:
    name: Scan runtime logic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check ARE deterministic simulation paths
        run: |
          node scripts/check-are-determinism.mjs
          node scripts/check-determinism-gate.mjs
