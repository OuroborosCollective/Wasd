name: ARE Determinism Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/src/core/**'
      - 'server/src/modules/**'
      - 'server/src/services/**'
      - 'packages/shared/src/**'
      - 'scripts/check-are-determinism.mjs'
      - 'scripts/check-determinism-gate.mjs'
      - 'scripts/scan-are-core.mjs'
      - '.github/workflows/are-determinism-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'server/src/core/**'
      - 'server/src/modules/**'
      - 'server/src/services/**'
      - 'packages/shared/src/**'
      - 'scripts/check-are-determinism.mjs'
      - 'scripts/check-determinism-gate.mjs'
      - 'scripts/scan-are-core.mjs'
      - '.github/workflows/are-determinism-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determinism-gate:
    name: ARE Determinism Firewall (Level 3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Legacy Pattern Scans
        run: |
          echo "=== Legacy Pattern Scanner (regex-based) ==="
          node scripts/check-are-determinism.mjs
          node scripts/check-determinism-gate.mjs

      - name: Run ARE Guard Source Scanner (Level 3)
        run: |
          echo ""
          echo "=== ARE Guard Source Scanner (TypeScript Guard Integration) ==="
          node scripts/scan-are-core.mjs --strict

      - name: Report Summary
        if: always()
        run: |
          echo ""
          echo "🏁 ARE Determinism Gate Complete"
          echo "   All scanners passed. The ARE core is clean of nondeterminism."
