name: Main Pipeline

permissions:
  contents: write
  security-events: write
  pull-requests: read
  id-token: write

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'engine/**'
      - 'portal/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/main-pipeline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'engine/**'
      - 'portal/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/main-pipeline.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        python-version: ['3.11']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f engine/requirements.txt ]; then pip install -r engine/requirements.txt; fi

      - name: Run Python Validation
        run: |
          if [ -f engine/scripts/check_changes.py ]; then
            python engine/scripts/check_changes.py
          elif [ -f scripts/check_changes.py ]; then
            python scripts/check_changes.py
          else
            echo "Validation script check_changes.py not found, skipping."
          fi

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

      - name: Lint workspace
        run: pnpm -r run lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Build monorepo
        run: pnpm -r run build

      - name: Configure ESM for Distribution
        run: |
          echo "Converting all 'commonjs' to 'module' in build artifacts..."
          find . -type f -name "package.json" \( -path "*/dist/*" -o -path "*/build/*" \) -exec sed -i 's/"type": "commonjs"/"type": "module"/g' {} +
          
          echo "Ensuring apps/api distribution is explicitly ESM..."
          if [ -d "apps/api/dist" ]; then
            if [ ! -f "apps/api/dist/package.json" ]; then
              echo '{"type": "module"}' > apps/api/dist/package.json
            else
              if ! grep -q '"type":' apps/api/dist/package.json; then
                sed -i 's/^{/{\n  "type": "module",/' apps/api/dist/package.json
              else
                sed -i 's/"type": ".*"/"type": "module"/g' apps/api/dist/package.json
              fi
            fi
          fi

      - name: Verify Backend ESM Configuration
        run: cat apps/api/dist/package.json

      - name: Ensure Build Directories Exist
        run: |
          mkdir -p dist
          find . -name "dist" -type d -not -path "./dist*" -exec cp -r {} ./dist/ \; || true
          find . -name "build" -type d -not -path "./dist*" -exec cp -r {} ./dist/ \; || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/dist/**
            **/build/**
          retention-days: 1
          if-no-files-found: warn

      - name: GitHub Dependency Submission
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Run tests
        run: pnpm -r run test