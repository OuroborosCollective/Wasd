name: Areloria VPS Deploy (Password SSH)

# Manual only — automated deploys: `vps-docker-deploy.yml` (Docker + `VPS_*` secrets).
# Legacy password path: `SSH_HOST`, `SSH_USER`, `SSH_PASSWORD`.
on:
  workflow_dispatch:

concurrency:
  group: areloria-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VPS_PATH: /opt/areloria

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Verify SSH Connection
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH connection OK' && uname -a"

      - name: Deploy to VPS (Git sync + deploy/update.sh)
        run: |
          REPO_CLONE_URL="https://github.com/${{ github.repository }}.git"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -euo pipefail
            APP_DIR="/opt/areloria"
            echo "→ Navigating to project"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -d ".git" ]; then
              echo "→ Cloning repo"
              git clone "https://github.com/${{ github.repository }}.git" .
            fi

            echo "→ Syncing repo to origin/main"
            git fetch origin main
            git reset --hard origin/main

            echo "→ Build, restart PM2, verify (deploy/update.sh)"
            bash deploy/update.sh

          echo "→ Deploy finished"
          EOF

      - name: Health Check
        run: |
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SSH_HOST }} || true)

            if [ "$STATUS" = "200" ]; then
              echo "App is healthy"
              exit 0
            fi

            echo "Waiting for app... ($i/20)"
            sleep 10
          done

          echo "Health check failed"
          exit 1

      - name: Deployment Summary
        run: |
          echo "Deployment finished on VPS:"
          echo "${{ secrets.SSH_HOST }} -> ${VPS_PATH }}"
