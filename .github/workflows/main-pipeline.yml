name: Areloria VPS Deploy (Password SSH)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

  workflow_dispatch:

concurrency:
  group: areloria-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VPS_PATH: /opt/areloria

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Verify SSH Connection
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH connection OK' && uname -a"

      - name: Deploy to VPS (Git Sync + Restart)
        run: |
          REPO_CLONE_URL="https://github.com/${{ github.repository }}.git"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash -s << EOF
          set -euo pipefail

          echo "→ Navigating to project"
          mkdir -p /opt/areloria
          cd /opt/areloria

          if [ ! -d ".git" ]; then
            echo "→ Cloning repo"
            git clone "${REPO_CLONE_URL}" .
          fi

          echo "→ Syncing repo"
          git remote set-url origin "${REPO_CLONE_URL}" || true
          git fetch origin main
          git reset --hard origin/main

          echo "→ Build + PM2 (Wasd server + client)"
          corepack enable || true
          corepack prepare pnpm@9.12.2 --activate
          bash deploy/vps-prod-build.sh

          echo "→ Deploy finished"
          EOF

      - name: Health Check
        run: |
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SSH_HOST }} || true)

            if [ "$STATUS" = "200" ]; then
              echo "App is healthy"
              exit 0
            fi

            echo "Waiting for app... ($i/20)"
            sleep 10
          done

          echo "Health check failed"
          exit 1

      - name: Deployment Summary
        run: |
          echo "Deployment finished on VPS:"
          echo "${{ secrets.SSH_HOST }} -> ${VPS_PATH }}"
