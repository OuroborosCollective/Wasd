name: Areloria VPS Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: areloria-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Monorepo to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VPS_PATH: /opt/areloria

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.12.2 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_IP }} >> ~/.ssh/known_hosts

      - name: Verify VPS Connection
        run: |
          ssh root@${{ secrets.PRODUCTION_IP }} "
            echo 'VPS connection established'
            uname -a
            docker --version || true
            docker compose version || true
          "

      - name: Ensure Monorepo Directory Exists
        run: |
          ssh root@${{ secrets.PRODUCTION_IP }} "
            mkdir -p ${VPS_PATH}
          "

      - name: Clone Repository if Missing
        run: |
          ssh root@${{ secrets.PRODUCTION_IP }} "
            if [ ! -d '${VPS_PATH}/.git' ]; then
              git clone https://github.com/${{ github.repository }} ${VPS_PATH}
            fi
          "

      - name: Update Monorepo
        run: |
          ssh root@${{ secrets.PRODUCTION_IP }} "
            cd ${VPS_PATH}

            echo '--- Sync Repository ---'
            git fetch origin main
            git reset --hard origin/main

            echo '--- Enable Corepack ---'
            corepack enable
            corepack prepare pnpm@9.12.2 --activate

            echo '--- Install Dependencies ---'
            pnpm install --frozen-lockfile

            echo '--- Build Monorepo ---'
            pnpm build || true

            echo '--- Restart Services ---'

            if [ -f docker-compose.yml ] || [ -f compose.yml ] || [ -f docker-compose.yaml ]; then
              docker compose up -d --build
            fi

            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart all || true
            fi

            echo '--- Deployment Complete ---'
          "

      - name: Production Health Check
        run: |
          MAX_RETRIES=20
          COUNT=0

          until curl -fsS http://${{ secrets.PRODUCTION_IP }} >/dev/null || [ $COUNT -eq $MAX_RETRIES ]; do
            echo "Waiting for application startup ($COUNT/$MAX_RETRIES)..."
            sleep 10
            COUNT=$((COUNT + 1))
          done

          if [ $COUNT -eq $MAX_RETRIES ]; then
            echo "Application health check failed."
            exit 1
          fi

          echo "Application is online."

      - name: Deployment Summary
        run: |
          echo "Areloria monorepo deployed successfully to:"
          echo "${VPS_PATH}"
