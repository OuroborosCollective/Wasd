name: Areloria VPS Deploy (Password SSH)

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: areloria-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VPS_PATH: /opt/areloria

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Verify SSH Connection
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH connection OK' && uname -a"

      - name: Deploy to VPS (Git Sync + Restart)
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

            set -e

            echo "→ Navigating to project"
            mkdir -p /opt/areloria
            cd /opt/areloria

            if [ ! -d ".git" ]; then
              echo "→ Cloning repo"
              git clone https://github.com/${{ github.repository }} .
            fi

            echo "→ Syncing repo"
            git fetch origin main
            git reset --hard origin/main

            echo "→ Installing dependencies"
            corepack enable || true
            corepack prepare pnpm@9.12.2 --activate || true
            pnpm install --frozen-lockfile || npm install

            echo "→ Building project"
            pnpm build || true

            echo "→ Restarting services"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart all || true
            fi

            if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
              docker compose up -d --build || true
            fi

            echo "→ Deploy finished"
          EOF

      - name: Health Check
        run: |
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SSH_HOST }} || true)

            if [ "$STATUS" = "200" ]; then
              echo "App is healthy"
              exit 0
            fi

            echo "Waiting for app... ($i/20)"
            sleep 10
          done

          echo "Health check failed"
          exit 1

      - name: Deployment Summary
        run: |
          echo "Deployment finished on VPS:"
          echo "${{ secrets.SSH_HOST }} -> ${VPS_PATH }}"
