name: Lockfile Maintenance

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Lockfile Reconciler
        run: node scripts/maintenance/reconciler-core.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}