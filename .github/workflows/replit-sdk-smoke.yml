name: Replit SDK Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replit-sdk-smoke.yml'
      - 'scripts/replit-start.sh'
      - '.replit'
      - 'packages/core-logic/**'
      - 'packages/sdk-examples/**'
      - 'packages/shared/**'
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - '.github/workflows/replit-sdk-smoke.yml'
      - 'scripts/replit-start.sh'
      - '.replit'
      - 'packages/core-logic/**'
      - 'packages/sdk-examples/**'
      - 'packages/shared/**'
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: replit-sdk-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Install monorepo dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Build Replit runtime targets
        run: |
          pnpm --filter @wasd/core-logic --if-present run build:runtime
          pnpm --filter @wasd/shared --if-present build
          pnpm --filter @wasd/server --if-present build

      - name: Build SDK demo
        run: pnpm --filter @wasd/sdk-replit-demo --if-present build
