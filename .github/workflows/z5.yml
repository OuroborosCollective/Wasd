name: z5

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/z5_patch.py
      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: z5-result
          delete-branch: true
          commit-message: "feat(client-2d): render modular weapons"
          title: "Render modular weapons"
          body: "Wires the modular weapon assembler into CyberZenIsoApp weapon rendering while preserving the old single-sprite fallback."
          add-paths: |
            apps/client-2d/src/CyberZenIsoApp.tsx
