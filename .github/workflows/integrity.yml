name: Integrity Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check integrity
        run: |
          pnpm run lint
          pnpm run build
          pnpm run test --passWithNoTests

      - name: Post failure report
        if: failure() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ## ❌ Integrity Check Failed
            The automated checks (lint, build, or tests) failed. 
            Please review the details in the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).