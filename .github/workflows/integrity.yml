name: Integrity Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Synchronisiert die Version automatisch mit dem "packageManager" Feld in der package.json
          # Falls dort nicht vorhanden, wird die aktuellste Version verwendet.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check integrity
        run: |
          pnpm run lint
          pnpm run build
          pnpm run test --passWithNoTests