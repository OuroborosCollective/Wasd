name: Lockfile Recovery

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get pnpm store directory
        shell: bash
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Verify Lockfile
        id: verify
        run: pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Recovery Mechanism
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          echo "Detected lockfile desync. Starting recovery..."
          pnpm install --no-frozen-lockfile
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add pnpm-lock.yaml
          
          if git diff --cached --quiet; then
            echo "No changes detected in lockfile after re-install."
          else
            git commit -m "fix(ci): automated lockfile recovery [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            echo "Lockfile updated and pushed successfully."
          fi

      - name: Final Validation
        if: steps.verify.outcome == 'failure'
        run: pnpm install --frozen-lockfile