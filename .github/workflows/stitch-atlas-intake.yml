name: Stitch 2.5D Atlas Intake Pipeline

on:
  workflow_dispatch:
    inputs:
      input_zip:
        description: 'Input path: ZIP, folder, or image file. Default auto-detects assets/raw/stitch.'
        required: false
        default: ''
      pack_id:
        description: 'Pack ID for manifest'
        required: false
        default: 'stitch_25d_atlas_pack_001'

  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/stitch_atlas_intake.py'
      - 'scripts/__tests__/stitch_atlas_intake.test.py'
      - '.github/workflows/stitch-atlas-intake.yml'
      - 'assets/raw/stitch/**'
      - 'apps/client-2d/public/2d-assets/stitch/**'
      - 'apps/client-2d/src/game/stitchAssetManifest.ts'
      - 'apps/client-2d/src/ui/windows/StitchAssetPreviewPanel.tsx'
      - 'apps/client-2d/src/ui/windows/stitchAssetPreviewPanel.css'
      - 'apps/client-2d/package.json'
      - 'apps/client-2d/src/**'

  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/stitch_atlas_intake.py'
      - 'scripts/__tests__/stitch_atlas_intake.test.py'
      - '.github/workflows/stitch-atlas-intake.yml'
      - 'assets/raw/stitch/**'
      - 'apps/client-2d/public/2d-assets/stitch/**'
      - 'apps/client-2d/src/game/stitchAssetManifest.ts'
      - 'apps/client-2d/src/ui/windows/StitchAssetPreviewPanel.tsx'
      - 'apps/client-2d/src/ui/windows/stitchAssetPreviewPanel.css'
      - 'apps/client-2d/package.json'
      - 'apps/client-2d/src/**'

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

concurrency:
  group: stitch-atlas-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intake:
    name: Run Stitch Atlas Intake
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for input path
        id: input_check
        env:
          REQUESTED_INPUT_ZIP: ${{ github.event.inputs.input_zip || '' }}
          REQUESTED_PACK_ID: ${{ github.event.inputs.pack_id || 'stitch_25d_atlas_pack_001' }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_INPUT_ZIP" ]; then
            echo "INPUT_ZIP=$REQUESTED_INPUT_ZIP" >> "$GITHUB_OUTPUT"

            if [ -d "$REQUESTED_INPUT_ZIP" ]; then
              echo "MODE=dir" >> "$GITHUB_OUTPUT"
            elif [ -f "$REQUESTED_INPUT_ZIP" ]; then
              case "$REQUESTED_INPUT_ZIP" in
                *.zip|*.ZIP)
                  echo "MODE=zip" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "MODE=file" >> "$GITHUB_OUTPUT"
                  ;;
              esac
            else
              echo "MODE=unknown" >> "$GITHUB_OUTPUT"
            fi

          elif [ -d "assets/raw/stitch" ]; then
            echo "INPUT_ZIP=assets/raw/stitch" >> "$GITHUB_OUTPUT"
            echo "MODE=dir" >> "$GITHUB_OUTPUT"

          elif [ -f "assets/raw/stitch/stitch_2.5d_enemy_sprite_atlas.zip" ]; then
            echo "INPUT_ZIP=assets/raw/stitch/stitch_2.5d_enemy_sprite_atlas.zip" >> "$GITHUB_OUTPUT"
            echo "MODE=zip" >> "$GITHUB_OUTPUT"

          else
            echo "INPUT_ZIP=assets/raw/stitch" >> "$GITHUB_OUTPUT"
            echo "MODE=dir" >> "$GITHUB_OUTPUT"
          fi

          echo "PACK_ID=$REQUESTED_PACK_ID" >> "$GITHUB_OUTPUT"

          echo "Resolved input:"
          echo "  INPUT_ZIP=$(cat "$GITHUB_OUTPUT" | grep '^INPUT_ZIP=' | tail -n1 | cut -d= -f2-)"
          echo "  PACK_ID=$REQUESTED_PACK_ID"

      - name: Install Python and Pillow
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip > /dev/null 2>&1
          python3 -m pip install --quiet Pillow

      - name: Validate input path
        run: |
          set -euo pipefail

          INPUT_PATH="${{ steps.input_check.outputs.INPUT_ZIP }}"

          if [ ! -e "$INPUT_PATH" ]; then
            echo "::error::Input path does not exist: $INPUT_PATH"
            echo "Available assets/raw tree:"
            find assets/raw -maxdepth 6 -type f | sort || true
            exit 1
          fi

          echo "Input path exists: $INPUT_PATH"

      - name: Run Stitch Atlas Intake
        run: |
          set -euo pipefail

          echo "=== Running Stitch Atlas Intake ==="
          echo "Input: ${{ steps.input_check.outputs.INPUT_ZIP }}"
          echo "Mode: ${{ steps.input_check.outputs.MODE }}"
          echo "Pack ID: ${{ steps.input_check.outputs.PACK_ID }}"
          echo

          python3 scripts/stitch_atlas_intake.py \
            --input "${{ steps.input_check.outputs.INPUT_ZIP }}" \
            --pack-id "${{ steps.input_check.outputs.PACK_ID }}"

      - name: Validate generated manifest
        run: |
          set -euo pipefail

          echo "=== Validating manifest ==="

          if [ ! -f "apps/client-2d/public/2d-assets/stitch/manifest.json" ]; then
            echo "::error::manifest.json not generated"
            find apps/client-2d/public/2d-assets/stitch -maxdepth 6 -type f | sort || true
            exit 1
          fi

          EXPECTED_PACK_ID="${{ steps.input_check.outputs.PACK_ID }}" python3 <<'PY'
          import json
          import os
          import re
          import sys

          manifest_path = "apps/client-2d/public/2d-assets/stitch/manifest.json"
          expected_pack_id = os.environ["EXPECTED_PACK_ID"]

          with open(manifest_path, "r", encoding="utf-8") as f:
              m = json.load(f)

          print(f"Schema version: {m.get('schemaVersion')}")
          print(f"Pack ID: {m.get('packId')}")
          print(f"Deterministic: {m.get('deterministic')}")
          print(f"Assets: {len(m.get('assets', []))}")
          print(f"Quarantine: {len(m.get('quarantine', []))}")

          if m.get("packId") != expected_pack_id:
              print(f"ERROR: unexpected packId: {m.get('packId')} != {expected_pack_id}")
              sys.exit(1)

          if m.get("deterministic") is not True:
              print("ERROR: manifest deterministic flag is not true")
              sys.exit(1)

          if not isinstance(m.get("assets"), list):
              print("ERROR: manifest assets must be a list")
              sys.exit(1)

          if len(m["assets"]) == 0:
              print("ERROR: manifest assets list is empty")
              sys.exit(1)

          seen_asset_ids = set()
          seen_source_paths = set()

          for asset in m["assets"]:
              asset_id = asset.get("assetId")
              source_path = asset.get("sourcePath", "")

              if not asset_id:
                  print("ERROR: asset without assetId")
                  sys.exit(1)

              if asset_id in seen_asset_ids:
                  print(f"ERROR: duplicate assetId: {asset_id}")
                  sys.exit(1)

              seen_asset_ids.add(asset_id)

              if not source_path:
                  print(f"ERROR: asset without sourcePath: {asset_id}")
                  sys.exit(1)

              if source_path in seen_source_paths:
                  print(f"WARNING: duplicate sourcePath: {source_path}")

              seen_source_paths.add(source_path)

              if "/tmp/" in source_path:
                  print(f"ERROR: temp path in asset: {asset_id} -> {source_path}")
                  sys.exit(1)

              if source_path.startswith("/"):
                  print(f"ERROR: absolute sourcePath: {asset_id} -> {source_path}")
                  sys.exit(1)

              if ".." in source_path.split("/"):
                  print(f"ERROR: path traversal in sourcePath: {asset_id} -> {source_path}")
                  sys.exit(1)

              if "\\" in source_path:
                  print(f"ERROR: Windows-style path separator in sourcePath: {asset_id} -> {source_path}")
                  sys.exit(1)

              if not re.match(r"^[\w\-\./!:]+$", source_path):
                  print(f"ERROR: invalid sourcePath chars: {asset_id} -> {source_path}")
                  sys.exit(1)

          print("Manifest validation OK")
          print("All sourcePaths are stable, relative, and clean")
          PY

      - name: Verify deterministic manifest replay
        run: |
          set -euo pipefail

          echo "=== Verifying deterministic manifest replay ==="

          MANIFEST="apps/client-2d/public/2d-assets/stitch/manifest.json"

          sha256sum "$MANIFEST" | awk '{print $1}' > /tmp/stitch-manifest-before.sha256

          python3 scripts/stitch_atlas_intake.py \
            --input "${{ steps.input_check.outputs.INPUT_ZIP }}" \
            --pack-id "${{ steps.input_check.outputs.PACK_ID }}"

          sha256sum "$MANIFEST" | awk '{print $1}' > /tmp/stitch-manifest-after.sha256

          echo "Before: $(cat /tmp/stitch-manifest-before.sha256)"
          echo "After:  $(cat /tmp/stitch-manifest-after.sha256)"

          diff -u /tmp/stitch-manifest-before.sha256 /tmp/stitch-manifest-after.sha256

          echo "Deterministic replay OK"

      - name: Upload intake artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stitch-intake-output
          path: |
            apps/client-2d/public/2d-assets/stitch/**
            assets/quarantine/stitch/**
          if-no-files-found: ignore
          retention-days: 7

  validate-python-tests:
    name: Validate Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Python and Pillow
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip > /dev/null 2>&1
          python3 -m pip install --quiet Pillow

      - name: Run Python tests
        run: |
          set -euo pipefail

          echo "=== Running Stitch Atlas Intake Tests ==="
          python3 scripts/__tests__/stitch_atlas_intake.test.py

  build-client-2d:
    name: Build client-2d
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - intake
      - validate-python-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download intake artifacts
        uses: actions/download-artifact@v4
        with:
          name: stitch-intake-output
          path: /tmp/stitch-intake-output

      - name: Restore intake artifacts into client public folder
        run: |
          set -euo pipefail

          mkdir -p apps/client-2d/public/2d-assets/stitch

          if [ -d "/tmp/stitch-intake-output/apps/client-2d/public/2d-assets/stitch" ]; then
            cp -R /tmp/stitch-intake-output/apps/client-2d/public/2d-assets/stitch/. \
              apps/client-2d/public/2d-assets/stitch/
          elif [ -f "/tmp/stitch-intake-output/manifest.json" ]; then
            cp -R /tmp/stitch-intake-output/. \
              apps/client-2d/public/2d-assets/stitch/
          else
            echo "::error::Downloaded artifact does not contain stitch output"
            echo "Artifact tree:"
            find /tmp/stitch-intake-output -maxdepth 8 -type f | sort || true
            exit 1
          fi

          if [ ! -f "apps/client-2d/public/2d-assets/stitch/manifest.json" ]; then
            echo "::error::manifest.json missing after artifact restore"
            find apps/client-2d/public/2d-assets/stitch -maxdepth 8 -type f | sort || true
            exit 1
          fi

          echo "Restored stitch artifacts:"
          find apps/client-2d/public/2d-assets/stitch -maxdepth 5 -type f | sort

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.12.2 --activate

      - name: Print toolchain
        run: |
          set -euo pipefail

          node --version
          corepack --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build client-2d
        run: NODE_OPTIONS=--max-old-space-size=4096 pnpm --filter @wasd/client-2d build

      - name: Verify dist structure
        run: |
          set -euo pipefail

          echo "=== Verifying dist structure ==="

          test -d apps/client-2d/dist || {
            echo "::error::dist not created"
            exit 1
          }

          test -f apps/client-2d/dist/index.html || {
            echo "::error::index.html missing"
            exit 1
          }

          if [ -f "apps/client-2d/dist/2d-assets/stitch/manifest.json" ]; then
            echo "manifest.json in dist"

            python3 <<'PY'
            import json

            with open("apps/client-2d/dist/2d-assets/stitch/manifest.json", "r", encoding="utf-8") as f:
                m = json.load(f)

            print(f"Manifest has {len(m['assets'])} assets")
            PY
          else
            echo "::warning::manifest.json not in dist"
            echo "dist tree:"
            find apps/client-2d/dist -maxdepth 6 -type f | sort || true
          fi

          echo "dist/index.html exists"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-2d-stitch-dist
          path: apps/client-2d/dist
          retention-days: 3

  e2e-preview:
    name: E2E Stitch Asset Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-client-2d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: client-2d-stitch-dist
          path: apps/client-2d/dist

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.12.2 --activate

      - name: Install dependencies for optional E2E
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail

          npx -y playwright install chromium --with-deps

      - name: Run preview server and E2E checks
        run: |
          set -euo pipefail

          python3 -m http.server 3456 --directory apps/client-2d/dist > /tmp/stitch-preview-server.log 2>&1 &
          SERVER_PID="$!"

          cleanup() {
            kill "$SERVER_PID" || true
          }

          trap cleanup EXIT

          sleep 3

          echo "=== Checking preview server ==="

          if ! curl -fsSL "http://127.0.0.1:3456/" > /tmp/stitch-index.html; then
            echo "::error::Preview server did not serve index"
            cat /tmp/stitch-preview-server.log || true
            exit 1
          fi

          echo "Preview server is serving index"

          echo "=== Verifying manifest accessible ==="

          curl -fsSL \
            "http://127.0.0.1:3456/2d-assets/stitch/manifest.json" \
            -o /tmp/stitch-manifest.json

          python3 <<'PY'
          import json
          import sys

          try:
              with open("/tmp/stitch-manifest.json", "r", encoding="utf-8") as f:
                  m = json.load(f)

              print(f"Manifest accessible: {len(m['assets'])} assets")
          except Exception as exc:
              print(f"ERROR: {exc}")
              sys.exit(1)
          PY

          echo "=== Running Stitch E2E Preview tests ==="

          if [ ! -f "e2e/stitch-asset-preview.spec.ts" ]; then
            echo "::warning::E2E test file not found, skipping"
            exit 0
          fi

          npx -y playwright test \
            e2e/stitch-asset-preview.spec.ts \
            --reporter=line \
            --timeout=30000

  summary:
    name: Intake Summary
    runs-on: ubuntu-latest
    needs:
      - intake
      - validate-python-tests
      - build-client-2d
      - e2e-preview
    if: always()

    steps:
      - name: Download intake artifacts
        if: needs.intake.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: stitch-intake-output
          path: /tmp/intake-output

      - name: Print summary
        run: |
          set -euo pipefail

          echo "============================================"
          echo "STITCH ATLAS INTAKE PIPELINE SUMMARY"
          echo "============================================"
          echo
          echo "Intake: ${{ needs.intake.result }}"
          echo "Python Tests: ${{ needs.validate-python-tests.result }}"
          echo "Build client-2d: ${{ needs.build-client-2d.result }}"
          echo "E2E Preview: ${{ needs.e2e-preview.result }}"
          echo

          MANIFEST=""

          if [ -f "/tmp/intake-output/apps/client-2d/public/2d-assets/stitch/manifest.json" ]; then
            MANIFEST="/tmp/intake-output/apps/client-2d/public/2d-assets/stitch/manifest.json"
          elif [ -f "/tmp/intake-output/manifest.json" ]; then
            MANIFEST="/tmp/intake-output/manifest.json"
          fi

          if [ -n "$MANIFEST" ]; then
            echo "Generated manifest:"

            MANIFEST_PATH="$MANIFEST" python3 <<'PY'
            import json
            import os

            manifest_path = os.environ["MANIFEST_PATH"]

            with open(manifest_path, "r", encoding="utf-8") as f:
                m = json.load(f)

            print(f"  Schema: v{m.get('schemaVersion')}")
            print(f"  Pack: {m.get('packId')}")
            print(f"  Deterministic: {m.get('deterministic')}")
            print(f"  Assets: {len(m.get('assets', []))}")
            print(f"  Quarantine: {len(m.get('quarantine', []))}")
            PY
          else
            echo "  (manifest not available)"

            if [ -d "/tmp/intake-output" ]; then
              find /tmp/intake-output -maxdepth 8 -type f | sort || true
            else
              echo "  (intake artifact folder not present)"
            fi
          fi

          echo
          echo "============================================"

          if [ "${{ needs.intake.result }}" != "success" ]; then
            echo "::error::Intake failed"
            exit 1
          fi

          if [ "${{ needs.validate-python-tests.result }}" != "success" ]; then
            echo "::error::Python tests failed"
            exit 1
          fi

          if [ "${{ needs.build-client-2d.result }}" != "success" ]; then
            echo "::error::client-2d build failed"
            exit 1
          fi

          if [ "${{ needs.e2e-preview.result }}" != "success" ]; then
            echo "::error::E2E preview failed"
            exit 1
          fi

          echo "Stitch Atlas Intake Pipeline OK"
