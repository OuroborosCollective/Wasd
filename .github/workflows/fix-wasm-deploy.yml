name: Fix WASM Deploy
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check and fix WASM deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          timeout: 3m
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            echo "=== Current dist contents ==="
            ls -la /opt/areloria/client/dist/assets/ | grep -i havok || echo "NO_HAVOK_FILES"
            echo ""
            echo "=== All WASM files ==="
            find /opt/areloria/client/dist/ -name '*.wasm' 2>/dev/null || echo "NO_WASM"
            echo ""
            echo "=== JS bundle Havok ref ==="
            grep -o 'HavokPhysics[^"]*\.js' /opt/areloria/client/dist/assets/index-*.js 2>/dev/null | head -3 || echo "NO_REF"
            echo ""
            echo "=== Checking if referenced file exists ==="
            REF=$(grep -o 'HavokPhysics_es-[^"]*\.js' /opt/areloria/client/dist/assets/index-*.js 2>/dev/null | head -1)
            echo "Reference: $REF"
            if [ -n "$REF" ]; then
              ls -la "/opt/areloria/client/dist/assets/$REF" 2>/dev/null || echo "REFERENCED_FILE_MISSING"
            fi
            echo ""
            echo "=== Rebuilding client ==="
            cd /opt/areloria
            export VITE_SUPABASE_URL="https://arelogic.space"
            cd client
            NODE_OPTIONS="--max-old-space-size=8192" npx vite build 2>&1 | tail -15
            echo ""
            echo "=== After rebuild - WASM files ==="
            find /opt/areloria/client/dist/ -name '*.wasm' 2>/dev/null || echo "STILL_NO_WASM"
            echo ""
            echo "=== After rebuild - Havok files ==="
            ls -la /opt/areloria/client/dist/assets/ | grep -i havok || echo "NO_HAVOK_AFTER_REBUILD"
            echo ""
            echo "=== Restarting PM2 ==="
            pm2 restart areloria 2>&1 || echo "PM2_RESTART_FAILED"
            sleep 3
            curl -sf --max-time 10 http://127.0.0.1:3000/health | head -c 200 || echo "SERVER_NOT_RESPONDING"
            echo ""
            echo "=== DONE ==="
