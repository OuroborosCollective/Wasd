name: 🧠 OpenHands Autonomous Release Agent

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional: specific issue or PR number to process"
        required: false
        type: string
      issue_type:
        description: "issue or pr"
        required: false
        default: "issue"
        type: choice
        options:
          - issue
          - pr
      max_issues:
        description: "Max scheduled issues to process"
        required: false
        default: "2"
        type: string


permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read


concurrency:
  group: openhands-autonomous-release-agent-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false


env:
  DEFAULT_OPENHANDS_MACRO: "@openhands-agent"
  DEFAULT_TARGET_BRANCH: "main"
  DEFAULT_MAX_ITERATIONS: "80"
  DEFAULT_PR_TYPE: "draft"
  DEFAULT_LLM_MODEL: "anthropic/claude-sonnet-4-20250514"
  DEFAULT_PYTHON_VERSION: "3.12"


jobs:
  collect-targets:
    name: 🎯 Select trusted OpenHands targets
    runs-on: ubuntu-latest
    timeout-minutes: 5


    outputs:
      count: ${{ steps.collect.outputs.count }}
      matrix: ${{ steps.collect.outputs.matrix }}


    steps:
      - name: 🎯 Collect issues / PRs
        id: collect
        uses: actions/github-script@v7
        env:
          OPENHANDS_MACRO: ${{ vars.OPENHANDS_MACRO || '@openhands-agent' }}
          MAX_ISSUES: ${{ inputs.max_issues || '2' }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
          DISPATCH_ISSUE_TYPE: ${{ inputs.issue_type || 'issue' }}
        with:
          script: |
            const allowedTriggerLabels = [
              "autonomous-task",
              "release-task",
              "fix-me",
              "openhands"
            ];


            const stopLabels = [
              "processed",
              "openhands-blocked",
              "openhands-needs-human",
              "wontfix",
              "duplicate"
            ];


            const trustedAssociations = new Set([
              "OWNER",
              "MEMBER",
              "COLLABORATOR"
            ]);


            const macro = process.env.OPENHANDS_MACRO || "@openhands-agent";
            const maxIssues = Math.max(1, Math.min(Number(process.env.MAX_ISSUES || "2") || 2, 5));
            const targets = [];
            const seen = new Set();


            function labelsOf(item) {
              return (item?.labels || []).map((label) => typeof label === "string" ? label : label.name).filter(Boolean);
            }


            function hasAnyLabel(item, labels) {
              const names = labelsOf(item);
              return labels.some((label) => names.includes(label));
            }


            function isStopped(item) {
              return hasAnyLabel(item, stopLabels);
            }


            function hasNoLabels(item) {
              return labelsOf(item).length === 0;
            }


            function addTarget({ issueNumber, issueType = "issue", commentId = "None", reason = "selected" }) {
              if (!issueNumber) return;


              const key = `${issueType}:${issueNumber}:${commentId}`;
              if (seen.has(key)) return;


              seen.add(key);
              targets.push({
                issue_number: String(issueNumber),
                issue_type: issueType,
                comment_id: String(commentId || "None"),
                reason
              });
            }


            async function getIssue(issueNumber) {
              const res = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(issueNumber)
              });
              return res.data;
            }


            async function addScheduledIssues() {
              for (const label of allowedTriggerLabels) {
                if (targets.length >= maxIssues) break;


                const res = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  labels: label,
                  per_page: 30,
                  sort: "updated",
                  direction: "asc"
                });


                for (const issue of res.data) {
                  if (targets.length >= maxIssues) break;
                  if (issue.pull_request) continue;
                  if (isStopped(issue)) continue;
                  if (!hasAnyLabel(issue, allowedTriggerLabels)) continue;


                  addTarget({
                    issueNumber: issue.number,
                    issueType: "issue",
                    commentId: "None",
                    reason: `scheduled:${label}`
                  });
                }
              }


              if (targets.length < maxIssues) {
                const res = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  per_page: 100,
                  sort: "updated",
                  direction: "asc"
                });


                for (const issue of res.data) {
                  if (targets.length >= maxIssues) break;
                  if (issue.pull_request) continue;
                  if (isStopped(issue)) continue;
                  if (hasAnyLabel(issue, allowedTriggerLabels)) continue;
                  if (!hasNoLabels(issue)) continue;


                  addTarget({
                    issueNumber: issue.number,
                    issueType: "issue",
                    commentId: "None",
                    reason: "scheduled: unlabeled"
                  });
                }
              }
            }


            const eventName = context.eventName;
            const payload = context.payload;


            if (eventName === "workflow_dispatch") {
              const issueNumber = process.env.DISPATCH_ISSUE_NUMBER;
              const issueType = process.env.DISPATCH_ISSUE_TYPE || "issue";


              if (issueNumber) {
                addTarget({
                  issueNumber,
                  issueType,
                  commentId: "None",
                  reason: "manual-dispatch"
                });
              } else {
                await addScheduledIssues();
              }
            }


            if (eventName === "schedule") {
              await addScheduledIssues();
            }


            if (eventName === "issues") {
              const issue = payload.issue;
              const action = payload.action;
              const labelName = payload.label?.name;


              if (issue && !issue.pull_request && !isStopped(issue)) {
                const hasTriggerLabel = hasAnyLabel(issue, allowedTriggerLabels);
                const labeledWithTrigger = action === "labeled" && allowedTriggerLabels.includes(labelName);
                const unlabeledWithNoLabels = action === "unlabeled" && hasNoLabels(issue);


                if (hasTriggerLabel || labeledWithTrigger) {
                  addTarget({
                    issueNumber: issue.number,
                    issueType: "issue",
                    commentId: "None",
                    reason: `issue-${action}`
                  });
                } else if (unlabeledWithNoLabels && !hasTriggerLabel) {
                  addTarget({
                    issueNumber: issue.number,
                    issueType: "issue",
                    commentId: "None",
                    reason: `issue-${action}: unlabeled-no-trigger`
                  });
                }
              }
            }


            if (eventName === "issue_comment") {
              const comment = payload.comment;
              const issue = payload.issue;


              if (
                comment &&
                issue &&
                comment.body &&
                comment.body.includes(macro) &&
                trustedAssociations.has(comment.author_association)
              ) {
                addTarget({
                  issueNumber: issue.number,
                  issueType: issue.pull_request ? "pr" : "issue",
                  commentId: comment.id,
                  reason: "trusted-macro-comment"
                });
              }
            }


            if (eventName === "pull_request_review_comment") {
              const comment = payload.comment;
              const pr = payload.pull_request;


              if (
                comment &&
                pr &&
                comment.body &&
                comment.body.includes(macro) &&
                trustedAssociations.has(comment.author_association)
              ) {
                addTarget({
                  issueNumber: pr.number,
                  issueType: "pr",
                  commentId: comment.id,
                  reason: "trusted-pr-review-comment"
                });
              }
            }


            if (eventName === "pull_request_review") {
              const review = payload.review;
              const pr = payload.pull_request;


              if (
                review &&
                pr &&
                review.body &&
                review.body.includes(macro) &&
                trustedAssociations.has(review.author_association)
              ) {
                addTarget({
                  issueNumber: pr.number,
                  issueType: "pr",
                  commentId: review.id,
                  reason: "trusted-pr-review"
                });
              }
            }


            const matrix = { include: targets };


            core.setOutput("count", String(targets.length));
            core.setOutput("matrix", JSON.stringify(matrix));


            core.info(`Selected ${targets.length} OpenHands target(s).`);
            core.info(JSON.stringify(matrix, null, 2));


  openhands-resolve:
    name: 🛠️ OpenHands resolve #${{ matrix.issue_number }}
    needs: collect-targets
    if: needs.collect-targets.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90


    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.collect-targets.outputs.matrix) }}


    concurrency:
      group: openhands-target-${{ github.repository }}-${{ matrix.issue_type }}-${{ matrix.issue_number }}
      cancel-in-progress: false


    env:
      ISSUE_NUMBER: ${{ matrix.issue_number }}
      ISSUE_TYPE: ${{ matrix.issue_type }}
      COMMENT_ID: ${{ matrix.comment_id }}
      TARGET_BRANCH: ${{ vars.TARGET_BRANCH || 'main' }}
      OPENHANDS_MAX_ITER: ${{ vars.OPENHANDS_MAX_ITER || '80' }}
      OPENHANDS_PR_TYPE: ${{ vars.OPENHANDS_PR_TYPE || 'draft' }}
      OPENHANDS_VERSION: ${{ vars.OPENHANDS_VERSION || '' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL || 'anthropic/claude-sonnet-4-20250514' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_VERSION: ${{ vars.LLM_API_VERSION || '' }}
      GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GITHUB_USERNAME: ${{ secrets.PAT_USERNAME || github.actor }}
      GIT_USERNAME: ${{ secrets.PAT_USERNAME || github.actor }}
      SANDBOX_ENV_GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      SANDBOX_BASE_CONTAINER_IMAGE: ${{ vars.OPENHANDS_BASE_CONTAINER_IMAGE || '' }}
      PYTHONUNBUFFERED: "1"


    steps:
      - name: 🧬 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || github.token }}


      - name: 🧪 Preflight
        run: |
          set -euo pipefail


          echo "OpenHands target:"
          echo "- repository: ${GITHUB_REPOSITORY}"
          echo "- issue number: ${ISSUE_NUMBER}"
          echo "- issue type: ${ISSUE_TYPE}"
          echo "- comment id: ${COMMENT_ID}"
          echo "- target branch: ${TARGET_BRANCH}"
          echo "- max iterations: ${OPENHANDS_MAX_ITER}"
          echo "- PR type: ${OPENHANDS_PR_TYPE}"
          echo "- reason: ${{ matrix.reason }}"


          if [ -z "${LLM_API_KEY}" ]; then
            echo "::error::Missing required secret LLM_API_KEY."
            echo "Create repository secret LLM_API_KEY before using OpenHands."
            exit 1
          fi


          if [ "${OPENHANDS_PR_TYPE}" != "draft" ] && [ "${OPENHANDS_PR_TYPE}" != "ready" ]; then
            echo "::error::OPENHANDS_PR_TYPE must be draft or ready."
            exit 1
          fi


          if [ "${ISSUE_TYPE}" != "issue" ] && [ "${ISSUE_TYPE}" != "pr" ]; then
            echo "::error::ISSUE_TYPE must be issue or pr."
            exit 1
          fi


      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION || '3.12' }}


      - name: 📦 Install OpenHands
        run: |
          set -euo pipefail


          python -m pip install --upgrade pip wheel setuptools


          if [ -n "${OPENHANDS_VERSION}" ]; then
            echo "Installing pinned OpenHands version: ${OPENHANDS_VERSION}"
            python -m pip install "openhands-ai==${OPENHANDS_VERSION}"
          else
            echo "Installing latest openhands-ai from PyPI"
            python -m pip install openhands-ai
          fi


          python - <<'PY'
          import importlib.metadata
          try:
              print("openhands-ai version:", importlib.metadata.version("openhands-ai"))
          except Exception as exc:
              print("Could not read openhands-ai version:", exc)
          PY


      - name: 💬 Comment start
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issueType = process.env.ISSUE_TYPE;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;


            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                "🧠 **OpenHands Autonomous Release Agent gestartet.**",
                "",
                `Target: \`${issueType} #${issueNumber}\``,
                `Run: ${runUrl}`,
                "",
                "Arbeitsmodus: echter Code-Agent, Draft-PR, kein Auto-Merge."
              ].join("\n")
            });


      - name: 🧠 Resolve with OpenHands
        id: resolve
        continue-on-error: true
        run: |
          set -o pipefail


          rm -rf /tmp/output
          mkdir -p /tmp/output


          cd /tmp


          python -m openhands.resolver.resolve_issue \
            --selected-repo "${GITHUB_REPOSITORY}" \
            --issue-number "${ISSUE_NUMBER}" \
            --issue-type "${ISSUE_TYPE}" \
            --max-iterations "${OPENHANDS_MAX_ITER}" \
            --comment-id "${COMMENT_ID}" \
            2>&1 | tee /tmp/openhands-resolve.log


      - name: 🧾 Analyze OpenHands result
        id: result
        if: always()
        run: |
          set -euo pipefail


          RESULT_FILE="/tmp/output/output.jsonl"


          if [ -f "${RESULT_FILE}" ] && grep -q '"success":true' "${RESULT_FILE}"; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "OpenHands marked resolution as successful."
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "OpenHands did not mark resolution as successful."
          fi


          if [ -f "${RESULT_FILE}" ]; then
            cp "${RESULT_FILE}" "${GITHUB_WORKSPACE}/openhands-output-${ISSUE_TYPE}-${ISSUE_NUMBER}.jsonl"
          fi


          if [ -f "/tmp/openhands-resolve.log" ]; then
            cp "/tmp/openhands-resolve.log" "${GITHUB_WORKSPACE}/openhands-resolve-${ISSUE_TYPE}-${ISSUE_NUMBER}.log"
          fi


      - name: 📤 Upload OpenHands artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openhands-output-${{ matrix.issue_type }}-${{ matrix.issue_number }}
          path: |
            openhands-output-${{ matrix.issue_type }}-${{ matrix.issue_number }}.jsonl
            openhands-resolve-${{ matrix.issue_type }}-${{ matrix.issue_number }}.log
          if-no-files-found: warn
          retention-days: 30


      - name: 🚀 Create Draft PR on success
        id: send_pr
        if: always() && steps.result.outputs.success == 'true'
        continue-on-error: true
        run: |
          set -o pipefail


          cd /tmp


          python -m openhands.resolver.send_pull_request \
            --issue-number "${ISSUE_NUMBER}" \
            --target-branch "${TARGET_BRANCH}" \
            --username "${GIT_USERNAME}" \
            --pr-type "${OPENHANDS_PR_TYPE}" \
            2>&1 | tee /tmp/openhands-send-pr.log


          cp /tmp/openhands-send-pr.log "${GITHUB_WORKSPACE}/openhands-send-pr-${ISSUE_TYPE}-${ISSUE_NUMBER}.log"


      - name: 🌿 Push branch on failure
        id: send_branch
        if: always() && steps.result.outputs.success != 'true'
        continue-on-error: true
        run: |
          set -o pipefail


          cd /tmp


          python -m openhands.resolver.send_pull_request \
            --issue-number "${ISSUE_NUMBER}" \
            --username "${GIT_USERNAME}" \
            --pr-type branch \
            --send-on-failure \
            2>&1 | tee /tmp/openhands-send-branch.log


          cp /tmp/openhands-send-branch.log "${GITHUB_WORKSPACE}/openhands-send-branch-${ISSUE_TYPE}-${ISSUE_NUMBER}.log"


      - name: 📤 Upload PR / branch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openhands-publish-${{ matrix.issue_type }}-${{ matrix.issue_number }}
          path: |
            openhands-send-pr-${{ matrix.issue_type }}-${{ matrix.issue_number }}.log
            openhands-send-branch-${{ matrix.issue_type }}-${{ matrix.issue_number }}.log
          if-no-files-found: warn
          retention-days: 30


      - name: 🏷️ Ensure result labels exist
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          script: |
            const labels = [
              {
                name: "openhands-attempted",
                color: "5319E7",
                description: "OpenHands attempted this task."
              },
              {
                name: "openhands-pr-created",
                color: "0E8A16",
                description: "OpenHands created or updated a PR."
              },
              {
                name: "openhands-needs-human",
                color: "D93F0B",
                description: "OpenHands needs human review or manual repair."
              },
              {
                name: "processed",
                color: "C5DEF5",
                description: "Automation processed this issue."
              }
            ];


            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } else {
                  throw error;
                }
              }
            }


      - name: ✅ Final comment and labels
        if: always()
        uses: actions/github-script@v7
        env:
          RESOLUTION_SUCCESS: ${{ steps.result.outputs.success || 'false' }}
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          SEND_PR_OUTCOME: ${{ steps.send_pr.outcome || 'skipped' }}
          SEND_BRANCH_OUTCOME: ${{ steps.send_branch.outcome || 'skipped' }}
        with:
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          script: |
            const fs = require("fs");


            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issueType = process.env.ISSUE_TYPE;
            const success = process.env.RESOLUTION_SUCCESS === "true";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;


            function readMaybe(path) {
              try {
                return fs.readFileSync(path, "utf8").slice(-3500);
              } catch {
                return "";
              }
            }


            const prLog = readMaybe("/tmp/openhands-send-pr.log");
            const branchLog = readMaybe("/tmp/openhands-send-branch.log");
            const resolveLog = readMaybe("/tmp/openhands-resolve.log");


            const resultLabel = success ? "openhands-pr-created" : "openhands-needs-human";


            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ["openhands-attempted", resultLabel, "processed"]
            });


            for (const label of ["fix-me", "autonomous-task", "release-task", "openhands"]) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) {
                  core.warning(`Could not remove label ${label}: ${error.message}`);
                }
              }
            }


            const body = [
              success
                ? "✅ **OpenHands hat eine Lösung erzeugt.**"
                : "⚠️ **OpenHands hat einen Versuch durchgeführt, braucht aber menschliche Prüfung.**",
              "",
              `Target: \`${issueType} #${issueNumber}\``,
              `Resolver outcome: \`${process.env.RESOLVE_OUTCOME}\``,
              `PR publish outcome: \`${process.env.SEND_PR_OUTCOME}\``,
              `Failure branch outcome: \`${process.env.SEND_BRANCH_OUTCOME}\``,
              `Run: ${runUrl}`,
              "",
              success
                ? "Bitte Draft-PR prüfen. Kein Auto-Merge wurde durchgeführt."
                : "Es wurde kein sauberer Erfolg bestätigt. Logs/Artifact prüfen und Issue bei Bedarf erneut mit `fix-me` oder `@openhands-agent` starten.",
              "",
              prLog
                ? ["<details><summary>PR log</summary>", "", "```txt", prLog, "```", "</details>"].join("\n")
                : "",
              branchLog
                ? ["<details><summary>Branch log</summary>", "", "```txt", branchLog, "```", "</details>"].join("\n")
                : "",
              !success && resolveLog
                ? ["<details><summary>Resolver tail</summary>", "", "```txt", resolveLog, "```", "</details>"].join("\n")
                : ""
            ].filter(Boolean).join("\n");


            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
