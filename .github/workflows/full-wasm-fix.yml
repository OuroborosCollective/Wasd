name: Full WASM Fix
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Full rebuild and nginx fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          timeout: 3m
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            
            echo "=== Step 1: Rebuild client ==="
            cd /opt/areloria
            git fetch origin main
            git reset --hard origin/main
            export VITE_SUPABASE_URL="https://arelogic.space"
            cd client
            NODE_OPTIONS="--max-old-space-size=8192" npx vite build 2>&1 | tail -5
            
            echo ""
            echo "=== Step 2: Verify WASM file exists ==="
            ls -la /opt/areloria/client/dist/assets/HavokPhysics*.wasm 2>/dev/null || echo "NO_WASM_FILE"
            
            echo ""
            echo "=== Step 3: Fix Nginx config ==="
            # Remove old wasm block if exists, then add fresh one before /assets/
            CONF=/etc/nginx/sites-enabled/arelogic.space
            cp $CONF $CONF.bak.$(date +%s)
            
            # Use python to properly edit the nginx config
            python3 << 'PYEOF'
            import re
            
            with open("/etc/nginx/sites-enabled/arelogic.space", "r") as f:
                config = f.read()
            
            # Remove any existing wasm location block
            config = re.sub(r'\s*# WASM[^\n]*\n\s*location ~\* \.wasm\$ \{[^}]*\}\n', '\n', config)
            
            # Add WASM block right before the /assets/ block
            wasm_block = """    # WASM MIME type (critical for Havok physics)
    location ~* \\.wasm$ {
        root /opt/areloria/client/dist;
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
"""
            config = config.replace("    location /assets/ {", wasm_block + "    location /assets/ {")
            
            with open("/etc/nginx/sites-enabled/arelogic.space", "w") as f:
                f.write(config)
            
            print("Nginx config updated")
            PYEOF
            
            echo ""
            echo "=== Step 4: Test and reload Nginx ==="
            nginx -t
            systemctl reload nginx
            
            echo ""
            echo "=== Step 5: Verify WASM serves correctly ==="
            sleep 2
            curl -sI http://127.0.0.1/assets/HavokPhysics-hlBZeaGL.wasm 2>/dev/null | head -10
            
            echo ""
            echo "=== Step 6: Restart PM2 ==="
            cd /opt/areloria
            pm2 restart areloria 2>&1 || true
            sleep 3
            curl -sf --max-time 10 http://127.0.0.1:3000/health | head -c 200
            
            echo ""
            echo "=== Step 7: Final verification ==="
            echo "WASM file:"
            ls -la /opt/areloria/client/dist/assets/HavokPhysics*.wasm 2>/dev/null || echo "NO_WASM"
            echo "Nginx WASM block:"
            grep -A6 'wasm' /etc/nginx/sites-enabled/arelogic.space | head -8
            echo ""
            echo "=== DONE ==="
