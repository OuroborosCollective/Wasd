name: Dispatch VPS Docker Deploy for visible app changes

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: deploy-change-dispatch-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Dispatch VPS Docker Deploy manually
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Automatic dispatch is disabled during alpha stabilization."
          echo "Manual dispatch requested by workflow_dispatch."
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/vps-docker-deploy.yml/dispatches" \
            -d '{"ref":"main","inputs":{"reason":"manual dispatch","arelorian_port":"3001","docker_network":"areloria_arelorian-network"}}'
          echo "Manual dispatch requested."
