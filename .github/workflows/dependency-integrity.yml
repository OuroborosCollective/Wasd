name: Dependency Integrity Check

on:
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Integrity Check
        id: check
        run: |
          if ! sh scripts/pnpm-wrapper.sh > integrity_report.log 2>&1; then
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Post Failure Comment
        if: steps.check.outputs.status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'No detailed report available.';
            if (fs.existsSync('integrity_report.log')) {
              report = fs.readFileSync('integrity_report.log', 'utf8');
            }
            const body = `### ❌ Dependency Integrity Check Failed\n\n\`\`\`\n${report}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Finalize Workflow Status
        if: steps.check.outputs.status == 'failed'
        run: exit 1