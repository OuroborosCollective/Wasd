name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Shared Library Dependencies
        id: cache-shared-deps
        uses: actions/cache@v4
        with:
          path: shared/node_modules
          key: ${{ runner.os }}-shared-deps-${{ hashFiles('shared/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-shared-deps-

      - name: Cache Shared Library Build Artifacts
        id: cache-shared-build
        uses: actions/cache@v4
        with:
          path: shared/dist
          key: ${{ runner.os }}-shared-build-${{ hashFiles('shared/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-shared-build-

      - name: Install Global Dependencies
        run: npm install

      - name: Install Shared Library Dependencies
        if: steps.cache-shared-deps.outputs.cache-hit != 'true'
        run: cd shared && npm install

      - name: Build Shared Library
        if: steps.cache-shared-build.outputs.cache-hit != 'true'
        run: npm run build --prefix shared

      - name: Run AREStateCompiler Unit Tests with Latency Injection
        env:
          NODE_ENV: test
          SIMULATE_RACE_CONDITIONS: "true"
          INJECTED_LATENCY_MS: "150"
          COMPILER_TARGET: "AREStateCompiler"
        run: |
          echo "Executing AREStateCompiler tests with artificial latency: ${INJECTED_LATENCY_MS}ms"
          npm test -- shared/src/compiler/AREStateCompiler.test.ts

      - name: Verify Build Integrity
        run: npm run build --if-present