name: w-hook

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/client-2d/src/CyberZenIsoApp.tsx')
          s = p.read_text()
          imp = 'import { makeModularWeaponSprite } from "./modularWeaponAssembler";\n'
          if imp not in s:
              s = s.replace('import { moveVisualTowards } from "./visualMotion";\n', 'import { moveVisualTowards } from "./visualMotion";\n' + imp)
          old = '''function addWeaponSprite(c: Container, assets: LoadedAssets | null | undefined, name: string, weaponVisualId?: string | null) {
  const weapon = pickWeaponVisual(assets?.manifest ?? null, { visualId: weaponVisualId, seed: name });
  const tex = weaponTextureFor(assets ?? null, weapon?.entry ?? null);
  if (!tex) return;

  const weaponSprite = spriteFromTexture(tex, 42, 42, 0);
  weaponSprite.x = 16;
  weaponSprite.y = -24;
  weaponSprite.rotation = 0.35;
  weaponSprite.alpha = 0.96;
  c.addChild(weaponSprite);
}
'''
          new = '''function addWeaponSprite(c: Container, assets: LoadedAssets | null | undefined, name: string, weaponVisualId?: string | null) {
  const manifest = assets?.manifest ?? null;
  const modular = makeModularWeaponSprite(manifest, assets?.textures ?? new Map(), {
    visualId: weaponVisualId,
    seed: `${name}:${weaponVisualId ?? "auto"}`,
    weaponClass: weaponVisualId?.split("_")[1] ?? null,
    rarity: weaponVisualId?.includes("legendary") ? "legendary" : weaponVisualId?.includes("mystic") ? "mystic" : null,
  });
  if (modular) {
    c.addChild(modular);
    return;
  }

  const weapon = pickWeaponVisual(manifest, { visualId: weaponVisualId, seed: name });
  const tex = weaponTextureFor(assets ?? null, weapon?.entry ?? null);
  if (!tex) return;

  const weaponSprite = spriteFromTexture(tex, 42, 42, 0);
  weaponSprite.x = 16;
  weaponSprite.y = -24;
  weaponSprite.rotation = 0.35;
  weaponSprite.alpha = 0.96;
  c.addChild(weaponSprite);
}
'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new))
          PY
      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/w-hook
          delete-branch: true
          commit-message: "w hook"
          title: "w hook"
          body: "w hook"
          add-paths: |
            apps/client-2d/src/CyberZenIsoApp.tsx
