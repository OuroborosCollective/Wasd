# Optional legacy pipeline: Azure blob upload + SCP artifact deploy.
# Default production flow is `.github/workflows/main-pipeline.yml` (git sync + `deploy/vps-prod-build.sh` on the VPS).
name: Deploy Wasd Monorepo

# Manual / optional Azure artifact path. Automatic VPS deploy runs in
# `.github/workflows/main-pipeline.yml` (git sync + deploy/update.sh on /opt/areloria).
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-asset-sync:
    name: Build & Cloud Asset Sync
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Mono-Repo
        run: |
          NODE_OPTIONS=--max-old-space-size=4096 pnpm run build

      - name: Verify Dist Type Module
        run: |
          if [ -d "apps/api/dist" ]; then cat apps/api/dist/package.json || true; fi
          if [ -d "server/dist" ]; then cat server/dist/package.json || true; fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Container & Upload Assets
        run: |
          az storage container create \
            --name "cdn-assets" \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --public-access blob \
            --auth-mode key || true

          az storage blob upload-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --destination "cdn-assets" \
            --source client/dist \
            --overwrite true \
            --auth-mode key

      - name: Upload Server Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-production-build
          path: server/dist/
          retention-days: 1

  deploy:
    name: Server Deployment
    needs: build-and-asset-sync
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-production-build
          path: ./server-dist

      - name: Pre-Deployment Connectivity Check
        run: |
          echo "Verifying Port 80 accessibility on ${{ secrets.PRODUCTION_IP }}..."
          timeout 15s bash -c 'until nc -z -v -w5 ${{ secrets.PRODUCTION_IP }} 80; do echo "Port 80 not ready, retrying..."; sleep 2; done' || (echo "Target host port 80 unreachable. Aborting deployment." && exit 1)

      - name: Transfer Artifact to Production
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "./server-dist/*"
          target: "${{ secrets.DEPLOY_PATH }}/server/dist"
          strip_components: 1

      - name: SSH Orchestration & Workflow Env Restart
        uses: appleboy/ssh-action@master
        env:
          NODE_ENV: production
          API_KEY: ${{ secrets.API_KEY }}
          API_KEYS: ${{ secrets.API_KEYS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: NODE_ENV,API_KEY,API_KEYS,ALLOWED_ORIGINS,CORS_ORIGINS,DATABASE_URL
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "--- UPDATING CORE SOURCE ---"
            git fetch origin main
            git reset --hard origin/main

            echo "--- CONFIGURING RUNTIME ENVIRONMENT ---"
            mkdir -p server/dist
            echo '{"type": "module"}' > server/dist/package.json

            export PNPM_HOME="/home/${{ secrets.SSH_USER }}/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"

            pnpm install --prod --no-frozen-lockfile

            echo "--- RESTARTING PM2 INSTANCE WITH WORKFLOW ENV ---"
            pm2 delete areloria || true
            pm2 start server/dist/index.js --name areloria --update-env

            echo "--- DEPLOYMENT SUCCESSFUL ---"

      - name: Verify Deployment Health
        run: |
          echo "Starting Robust Health Check for Areloria WASD..."
          MAX_RETRIES=8
          RETRY_COUNT=0
          WAIT_TIME=10

          until $(curl --output /dev/null --silent --head --fail http://${{ secrets.PRODUCTION_IP }}); do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -gt $MAX_RETRIES ]; then
              echo "Health check failed after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES: Service not reachable. Retrying in $WAIT_TIME seconds (Exponential Backoff)..."
            sleep $WAIT_TIME
            WAIT_TIME=$((WAIT_TIME * 2))
          done

          echo "Areloria WASD Service is Healthy and responding on http://${{ secrets.PRODUCTION_IP }}"
