name: Deploy Wasd Monorepo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-asset-sync:
    name: Build & Cloud Asset Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Mono-Repo
        run: |
          node scripts/bypass-ts-errors.mjs || true
          NODE_OPTIONS=--max-old-space-size=4096 pnpm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Container & Upload Assets
        run: |
          # Verhindert 'BlobNotFound' durch explizite Validierung/Erstellung des Ziel-Containers
          az storage container create \
            --name "cdn-assets" \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --public-access blob \
            --auth-mode key || true
          
          # Upload der Client-Dist-Dateien in den validierten Pfad
          az storage blob upload-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --destination "cdn-assets" \
            --source packages/client/dist \
            --overwrite true \
            --auth-mode key

      - name: Upload Server Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-production-build
          path: packages/server/dist/
          retention-days: 1

  deploy:
    name: Server Deployment
    needs: build-and-asset-sync
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-production-build
          path: ./server-dist

      - name: Transfer Artifact to Production
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "./server-dist/*"
          target: "${{ secrets.DEPLOY_PATH }}/packages/server/dist"
          strip_components: 1

      - name: SSH Orchestration & PM2 Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "--- UPDATING CORE SOURCE ---"
            git fetch origin main
            git reset --hard origin/main
            
            echo "--- CONFIGURING RUNTIME ENVIRONMENT ---"
            # Sicherstellen, dass CommonJS für die Produktion gesetzt ist (vorkompilierte Files)
            echo '{"type": "commonjs"}' > packages/server/dist/package.json
            
            # Installiere Produktions-Abhängigkeiten im Monorepo-Kontext
            pnpm install --prod --no-frozen-lockfile
            
            echo "--- RESTARTING PM2 INSTANCE ---"
            pm2 delete areloria || true
            pm2 start packages/server/dist/index.js --name areloria --update-env
            
            echo "--- DEPLOYMENT SUCCESSFUL ---"