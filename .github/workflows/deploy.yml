name: Deploy Wasd Monorepo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-and-asset-sync:
    name: Build & Cloud Asset Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Mono-Repo
        run: |
          node scripts/bypass-ts-errors.mjs || true
          NODE_OPTIONS=--max-old-space-size=4096 pnpm run build

      - name: Verify Dist Type Module
        run: |
          if [ -d "apps/api/dist" ]; then cat apps/api/dist/package.json || true; fi
          if [ -d "server/dist" ]; then cat server/dist/package.json || true; fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Container & Upload Assets
        run: |
          az storage container create \
            --name "cdn-assets" \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --public-access blob \
            --auth-mode key || true
          
          az storage blob upload-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --destination "cdn-assets" \
            --source client/dist \
            --overwrite true \
            --auth-mode key

      - name: Upload Server Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-production-build
          path: server/dist/
          retention-days: 1

  deploy:
    name: Server Deployment
    needs: build-and-asset-sync
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: server-production-build
          path: ./server-dist

      - name: Transfer Artifact to Production
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "./server-dist/*"
          target: "${{ secrets.DEPLOY_PATH }}/server/dist"
          strip_components: 1

      - name: SSH Orchestration & PM2 Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "--- UPDATING CORE SOURCE ---"
            git fetch origin main
            git reset --hard origin/main
            
            echo "--- CONFIGURING RUNTIME ENVIRONMENT ---"
            mkdir -p server/dist
            echo '{"type": "module"}' > server/dist/package.json
            
            # Synchronize pnpm version on remote if possible or use existing
            export PNPM_HOME="/home/${{ secrets.SSH_USER }}/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"
            
            pnpm install --prod --no-frozen-lockfile
            
            echo "--- RESTARTING PM2 INSTANCE ---"
            pm2 delete areloria || true
            pm2 start server/dist/index.js --name areloria --update-env
            
            echo "--- DEPLOYMENT SUCCESSFUL ---"

      - name: Verify Deployment Health
        run: |
          echo "Starting Health Check for Areloria WASD..."
          # Increased timeout and added retries to prevent connection failure (28) on specified IP
          curl --retry 5 --retry-connrefused --retry-delay 15 --max-time 120 -v http://46.202.154.25 || (echo "Health Check failed after retries" && exit 1)