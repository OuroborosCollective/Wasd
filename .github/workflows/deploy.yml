name: Deploy Wasd Monorepo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: GITHUB_REF_NAME
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "--- SYNCING CODE ---"
            git fetch --all --prune
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              TARGET_BRANCH="main"
            elif git rev-parse --verify origin/Main >/dev/null 2>&1; then
              TARGET_BRANCH="Main"
            elif git rev-parse --verify origin/master >/dev/null 2>&1; then
              TARGET_BRANCH="master"
            else
              TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            fi
            echo "Using branch: $TARGET_BRANCH"
            git reset --hard origin/$TARGET_BRANCH
            echo "--- SETUP ENVIRONMENT ---"
            corepack enable
            corepack prepare pnpm@latest --activate
            echo "--- CLEANING ARTIFACTS ---"
            find packages -name "dist" -type d -exec rm -rf {} + || true
            echo "--- BYPASSING TS ERRORS ---"
            if [ -f scripts/bypass-ts-errors.mjs ]; then
              node scripts/bypass-ts-errors.mjs
            fi
            echo "--- INSTALLING DEPENDENCIES ---"
            pnpm install --no-frozen-lockfile
            echo "--- BUILDING MONOREPO ---"
            NODE_OPTIONS=--max-old-space-size=4096 pnpm -r build
            echo "--- RESTARTING PM2 ---"
            if [ -d "packages/server/dist" ]; then
              echo '{"type": "commonjs"}' > packages/server/dist/package.json
              pm2 delete areloria || true
              pm2 start packages/server/dist/index.js --name areloria
            elif [ -d "server/dist" ]; then
              echo '{"type": "commonjs"}' > server/dist/package.json
              pm2 delete areloria || true
              pm2 start server/dist/index.js --name areloria
            fi
            echo "--- DEPLOYMENT SUCCESSFUL ---"