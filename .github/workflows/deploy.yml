name: Deploy Wasd Monorepo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "--- SYNCING CODE ---"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            echo "--- CLEANING REDUNDANT PACKAGES ---"
            # Remove empty/broken packages that interfere with pnpm install
            rm -rf packages/client packages/server
            
            echo "--- BYPASSING TS ERRORS ---"
            node scripts/bypass-ts-errors.mjs
            
            echo "--- INSTALLING DEPENDENCIES ---"
            # Ensure pnpm is updated and fresh
            npm install -g pnpm
            # Clean node_modules to resolve manager conflicts
            find . -name "node_modules" -type d -prune -exec rm -rf '{}' +
            pnpm install --no-frozen-lockfile
            
            echo "--- BUILDING ---"
            NODE_OPTIONS=--max-old-space-size=4096 pnpm --recursive run build
            
            echo "--- RESTARTING PM2 ---"
            # CommonJS compatibility for production
            echo '{"type": "commonjs"}' > server/dist/package.json
            pm2 delete areloria || true
            pm2 start server/dist/index.js --name areloria
            
            echo "--- DEPLOYMENT SUCCESSFUL ---"
