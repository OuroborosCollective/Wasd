name: Deploy Wasd Monorepo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            echo "Syncing with GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "Cleaning redundant files..."
            rm -rf packages/client packages/server
            find shared -name '*.js' -delete
            
            echo "Bypassing TypeScript errors..."
            node scripts/bypass-ts-errors.mjs
            
            echo "Installing dependencies..."
            pnpm install --no-frozen-lockfile
            
            echo "Building all workspaces..."
            NODE_OPTIONS=--max-old-space-size=4096 pnpm --recursive run build
            
            echo "Setting up CommonJS compatibility..."
            echo '{"type": "commonjs"}' > server/dist/package.json
            
            echo "Restarting application..."
            pm2 delete areloria || true
            pm2 start server/dist/index.js --name areloria
