name: Debug WASM Issue
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug WASM file and Nginx config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          timeout: 3m
          command_timeout: 5m
          script_stop: true
          script: |
            echo "=== WASM FILES ON VPS ==="
            find /opt/areloria/client/dist/ -name '*.wasm' 2>/dev/null || echo "NO_WASM_FOUND"
            echo ""
            echo "=== ASSETS DIR ==="
            ls -la /opt/areloria/client/dist/assets/ 2>/dev/null | grep -i wasm || echo "NO_WASM_IN_ASSETS"
            echo ""
            echo "=== NGINX WASM CONFIG ==="
            grep -A8 'wasm' /etc/nginx/sites-enabled/arelogic.space 2>/dev/null || echo "NO_WASM_BLOCK"
            echo ""
            echo "=== NGINX FULL CONFIG ==="
            cat /etc/nginx/sites-enabled/arelogic.space 2>/dev/null || echo "NO_NGINX_CONF"
            echo ""
            echo "=== TEST LOCAL WASM ==="
            curl -sI http://127.0.0.1/assets/HavokPhysics-hlBZeaGL.wasm 2>/dev/null | head -5 || echo "CURL_FAILED"
            echo ""
            echo "=== JS BUNDLE WASM REF ==="
            grep -o 'HavokPhysics[^"]*\.wasm' /opt/areloria/client/dist/assets/index-*.js 2>/dev/null | head -3 || echo "NO_REF_FOUND"
            echo ""
            echo "=== DONE ==="
