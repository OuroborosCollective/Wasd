# Legacy VPS deploy: SSH to host, sync `main`, run `deploy/update.sh` (pnpm build + PM2).
#
# Manual-only by design.
# The automatic production path is now `VPS Docker Deploy (monorepo)`.
# This legacy workflow builds browser frontends directly on the VPS and can OOM
# during Vite builds on small hosts with exit 137.
#
# Accepts either naming convention:
#   VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_DEPLOY_PATH
#   SSH_HOST / SSH_USER / SSH_PRIVATE_KEY / DEPLOY_PATH
# Optional password if no key: SSH_PASSWORD
# Optional: DEPLOY_VERIFY_BASE_URL — curl /health after deploy

name: VPS production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Verify deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_USER: ${{ secrets.SSH_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          HOST="${VPS_HOST:-${SSH_HOST}}"
          USER="${VPS_USER:-${SSH_USER}}"
          KEY="${VPS_SSH_KEY:-${SSH_PRIVATE_KEY}}"
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ]; then
            echo "::error::Set VPS_HOST+VPS_USER or SSH_HOST+SSH_USER Actions secrets."
            exit 1
          fi
          if [ -z "${KEY:-}" ] && [ -z "${SSH_PASSWORD:-}" ]; then
            echo "::error::Provide VPS_SSH_KEY or SSH_PRIVATE_KEY, or SSH_PASSWORD."
            exit 1
          fi

      - name: SSH — pull main and run deploy/update.sh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 2m
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            APP_PRIMARY='${{ secrets.VPS_DEPLOY_PATH }}'
            APP_ALT='${{ secrets.DEPLOY_PATH }}'
            APP="${APP_PRIMARY:-${APP_ALT:-/opt/areloria}}"
            cd "$APP"
            echo "--- Repo: $APP ---"
            test -d .git || { echo "Not a git checkout; clone Wasd into $APP first."; exit 1; }
            echo "--- Sync to origin/main ---"
            git fetch origin main
            git reset --hard origin/main
            echo "--- Build + PM2 (deploy/update.sh) ---"
            bash deploy/update.sh

      - name: Optional public health check
        env:
          BASE: ${{ secrets.DEPLOY_VERIFY_BASE_URL }}
        run: |
          if [ -z "${BASE:-}" ]; then
            echo "DEPLOY_VERIFY_BASE_URL unset; skipping external check."
            exit 0
          fi
          curl -fsS "${BASE}/health" | head -c 800
          echo
          echo "Health check OK for ${BASE}/health"
