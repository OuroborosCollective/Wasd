name: Update Areloria Supabase Env

on:
  workflow_dispatch:
    inputs:
      deploy_path:
        description: VPS deploy path
        required: false
        default: /opt/areloria
      env_file:
        description: Runtime env file inside deploy path
        required: false
        default: .env.docker
      recreate_containers:
        description: Recreate Areloria containers after env update
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: update-areloria-supabase-env
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-env:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    timeout-minutes: 20

    steps:
      - name: Verify VPS secrets are set
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_USER: ${{ secrets.SSH_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ok=true
          HOST="${VPS_HOST:-${SSH_HOST:-}}"
          USER="${VPS_USER:-${SSH_USER:-}}"
          KEY="${VPS_SSH_KEY:-${SSH_PRIVATE_KEY:-}}"
          if [ -z "${HOST:-}" ]; then echo "::error::Set VPS_HOST or SSH_HOST."; ok=false; fi
          if [ -z "${USER:-}" ]; then echo "::error::Set VPS_USER or SSH_USER."; ok=false; fi
          if [ -z "${KEY:-}" ] && [ -z "${SSH_PASSWORD:-}" ]; then echo "::error::Set SSH key or SSH_PASSWORD."; ok=false; fi
          if [ "$ok" != true ]; then exit 1; fi

      - name: Patch Supabase env on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 2m
          command_timeout: 18m
          script: |
            set -euo pipefail

            DEPLOY_PATH='${{ inputs.deploy_path }}'
            ENV_FILE_NAME='${{ inputs.env_file }}'
            RECREATE='${{ inputs.recreate_containers }}'
            ENV_PATH="$DEPLOY_PATH/$ENV_FILE_NAME"
            NETWORK_NAME='${{ secrets.VPS_ARELORIAN_DOCKER_NETWORK || 'areloria_arelorian-network' }}'

            echo "=== Update Areloria Supabase env ==="
            echo "Deploy path: $DEPLOY_PATH"
            echo "Env file: $ENV_PATH"
            echo "Docker network: $NETWORK_NAME"

            command -v docker >/dev/null 2>&1 || { echo "ERROR: docker is required on VPS."; exit 1; }
            docker info >/dev/null 2>&1 || { echo "ERROR: Docker daemon not reachable."; exit 1; }

            mkdir -p "$DEPLOY_PATH"
            touch "$ENV_PATH"
            chmod 600 "$ENV_PATH" || true
            cp "$ENV_PATH" "$ENV_PATH.bak.$(date +%Y%m%d-%H%M%S)"

            upsert_env() {
              key="$1"
              value="$2"
              tmp="$(mktemp)"
              if grep -qE "^${key}=" "$ENV_PATH"; then
                awk -v k="$key" -v v="$value" 'BEGIN{done=0} $0 ~ "^" k "=" {print k "=" v; done=1; next} {print} END{if(!done) print k "=" v}' "$ENV_PATH" > "$tmp"
              else
                cat "$ENV_PATH" > "$tmp"
                printf '%s=%s\n' "$key" "$value" >> "$tmp"
              fi
              cat "$tmp" > "$ENV_PATH"
              rm -f "$tmp"
            }

            upsert_env SUPABASE_URL 'http://supabase-kong:8000'
            upsert_env PERSISTENCE_DRIVER 'postgres'
            upsert_env USE_SUPABASE_WS_LOGIN '1'
            upsert_env REQUIRE_SUPABASE_AUTH '1'

            python3 - <<'PY' "$ENV_PATH"
            import re
            import sys

            path = sys.argv[1]
            text = open(path, 'r', encoding='utf-8').read()
            match = re.search(r'^DATABASE_URL=(.*)$', text, flags=re.M)
            if not match or not match.group(1).strip():
                print('WARN: DATABASE_URL is missing; not creating it because the DB password is not known here.')
                print('WARN: Add DATABASE_URL=postgresql://postgres:<password>@supabase-db:5432/postgres to the env file if needed.')
                sys.exit(0)

            old = match.group(1).strip()
            new = re.sub(r'@[^/@:]+(?::\d+)?/', '@supabase-db:5432/', old, count=1)
            if new == old and '@supabase-db:5432/' not in old:
                print('WARN: DATABASE_URL format was not recognized; leaving it unchanged.')
            else:
                text = re.sub(r'^DATABASE_URL=.*$', 'DATABASE_URL=' + new, text, flags=re.M)
                open(path, 'w', encoding='utf-8').write(text)
                print('DATABASE_URL host normalized to supabase-db:5432')
            PY

            echo "=== Sanitized env preview ==="
            grep -E '^(SUPABASE_URL|PERSISTENCE_DRIVER|USE_SUPABASE_WS_LOGIN|REQUIRE_SUPABASE_AUTH|DATABASE_URL)=' "$ENV_PATH" | sed -E 's#(postgresql://[^:]+:)[^@]+@#\1***@#; s#(SERVICE_ROLE_KEY=).*#\1***#; s#(ANON_KEY=).*#\1***#' || true

            if ! docker network inspect "$NETWORK_NAME" >/dev/null 2>&1; then
              echo "Creating Docker network: $NETWORK_NAME"
              docker network create "$NETWORK_NAME" >/dev/null
            fi

            for container in supabase-db supabase-kong arelorian-engine monitor-bridge; do
              if docker ps -a --format '{{.Names}}' | grep -Fxq "$container"; then
                if ! docker inspect "$container" --format '{{json .NetworkSettings.Networks}}' | grep -q "\"$NETWORK_NAME\""; then
                  echo "Connecting $container to $NETWORK_NAME"
                  docker network connect "$NETWORK_NAME" "$container" >/dev/null 2>&1 || true
                fi
              fi
            done

            echo "=== Connectivity preflight from arelorian-engine ==="
            if docker ps --format '{{.Names}}' | grep -Fxq arelorian-engine; then
              docker exec arelorian-engine node -e "fetch('http://supabase-kong:8000').then(r=>console.log('supabase-kong status', r.status)).catch(e=>{console.error(e.message); process.exit(1)})" || true
              docker exec arelorian-engine node -e "const net=require('net'); const s=net.createConnection(5432,'supabase-db',()=>{console.log('supabase-db tcp ok'); s.end();}); s.on('error',e=>{console.error(e.message); process.exit(1)}); setTimeout(()=>process.exit(1),5000);" || true
            else
              echo "WARN: arelorian-engine is not running yet; skipping in-container connectivity test."
            fi

            if [ "$RECREATE" = "true" ]; then
              cd "$DEPLOY_PATH"
              if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi
              echo "Recreating Areloria containers so env changes take effect ..."
              ARELORIAN_DOCKER_NETWORK="$NETWORK_NAME" ARELORIAN_ENV_FILE="$ENV_FILE_NAME" $DC --env-file "$ENV_FILE_NAME" -f docker-compose.yml stop arelorian-engine monitor-bridge || true
              ARELORIAN_DOCKER_NETWORK="$NETWORK_NAME" ARELORIAN_ENV_FILE="$ENV_FILE_NAME" $DC --env-file "$ENV_FILE_NAME" -f docker-compose.yml rm -f arelorian-engine monitor-bridge || true
              ARELORIAN_DOCKER_NETWORK="$NETWORK_NAME" ARELORIAN_ENV_FILE="$ENV_FILE_NAME" $DC --env-file "$ENV_FILE_NAME" -f docker-compose.yml up -d --remove-orphans arelorian-engine monitor-bridge
            else
              echo "Skipping container recreate by input."
            fi

            echo "Done. Env patched at $ENV_PATH"
