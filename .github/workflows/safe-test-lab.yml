name: Safe Test Lab

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-test-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-test:
    name: Build and test without deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run monorepo guard
        run: pnpm guard:monorepo:frozen

      - name: Run ARE unit tests
        run: pnpm exec vitest run server/src/core/are/__tests__/__tests__

      - name: Build shared
        run: pnpm --filter @wasd/shared build

      - name: Build server
        run: pnpm -r --filter ./server build

      - name: Build 2D client
        run: pnpm build:2d

      - name: Build web portal
        run: pnpm build:web

      - name: Run safe smoke summary
        if: always()
        run: node scripts/safe-test-smoke.mjs

      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-test-summary
          path: artifacts/safe-test-summary.json
          if-no-files-found: warn
