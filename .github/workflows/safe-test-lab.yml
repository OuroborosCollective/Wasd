name: Safe Test Lab

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-test-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-test:
    name: Build and test without deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Run monorepo guard
        run: pnpm guard:monorepo:frozen

      - name: Run ARE unit tests
        run: pnpm exec vitest run server/src/core/are

      - name: Run stateless determinism and endless progression regressions
        run: |
          pnpm exec vitest run \
            server/src/core/determinism \
            server/src/are/__tests__/WorldHashSnapshot.test.ts \
            server/src/modules/player/PlayerStatsDirector.test.ts \
            server/src/tests/skill-progression-store.test.ts \
            server/src/tests/skill-persistence.test.ts \
            server/src/tests/skills.test.ts \
            server/src/tests/xp-delta-router.test.ts

      - name: Build shared
        run: pnpm --filter @wasd/shared build

      - name: Build server
        run: pnpm -r --filter ./server build

      - name: Build 2D client
        run: pnpm build:2d

      - name: Build web portal
        run: pnpm build:web

      - name: Run safe smoke summary
        if: always()
        run: node scripts/safe-test-smoke.mjs

      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-test-summary
          path: artifacts/safe-test-summary.json
          if-no-files-found: warn
