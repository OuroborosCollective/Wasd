name: Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-case-sensitivity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for case-sensitive filename collisions
        run: |
          # Finds files that would collide on a case-insensitive file system (like macOS/Windows)
          errors=$(git ls-files | sort -f | uniq -Di)
          if [ -n "$errors" ]; then
            echo "Error: Case-insensitivity collision detected in filenames:"
            echo "$errors"
            exit 1
          fi

  quality:
    needs: check-case-sensitivity
    uses: ./.github/workflows/reusable-quality.yml
    secrets: inherit

  test:
    needs: quality
    uses: ./.github/workflows/reusable-test.yml
    secrets: inherit

  build:
    needs: [quality, test]
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deploy.yml
    secrets: inherit