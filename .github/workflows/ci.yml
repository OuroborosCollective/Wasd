name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Cleanup old package manager artifacts
        run: rm -f .pnp.cjs .pnp.loader.mjs .yarnrc.yml && rm -rf .yarn

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Git check and auto-commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package.json
          if [ -n "$(git status --porcelain pnpm-lock.yaml package.json)" ]; then
            git commit -m "chore: migrate to pnpm and patch dependencies"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          else
            echo "No changes detected in pnpm-lock.yaml or package.json"
          fi