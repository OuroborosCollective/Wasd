name: "ARELORIA-WASD-ULTRA-CI"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  PYTHON_VERSION: "3.11"

jobs:
  integrity-suite:
    name: Core Integrity & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get PNPM Store Directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Validate Environment Schema
        run: |
          if [ ! -f .env.example ]; then
            echo "CRITICAL: .env.example missing"
            exit 1
          fi

      - name: Linting (ESLint & Prettier)
        run: pnpm run lint

      - name: Type Check (TypeScript Architect)
        run: pnpm recursive exec -- tsc --noEmit

  backend-validation:
    name: Backend & Agentic Logic (Jules)
    needs: integrity-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API (Node.js/TS)
        run: pnpm --filter @areloria/api build || pnpm --filter api build

      - name: Test Agentic Logic
        run: pnpm test --filter "@areloria/*"

  frontend-engine-check:
    name: Three.js & React Frontend
    needs: integrity-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Client (Metaverse Interface)
        run: pnpm --filter @areloria/web build || pnpm --filter web build

      - name: Build Legacy Client
        working-directory: ./client
        run: |
          if [ -f package.json ]; then
            pnpm install
            pnpm build
          fi

  docker-security-audit:
    name: Container & Security Audit
    needs: [backend-validation, frontend-engine-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Dockerfile Integrity
        run: docker build -t areloria-wasd-ci-test:latest . --dry-run || true

      - name: Dependency Snapshot Upload & Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: critical
          retry-on-snapshot-warnings: true

      - name: PNPM Vulnerability Audit with Retries
        shell: bash
        run: |
          MAX_RETRIES=3
          COUNT=0
          until [ $COUNT -ge $MAX_RETRIES ]
          do
            pnpm audit --audit-level critical && break
            COUNT=$((COUNT+1))
            echo "Audit failed due to network or API issues, retrying in 20s... ($COUNT/$MAX_RETRIES)"
            sleep 20
          done
        continue-on-error: true

  deployment-ready:
    name: Final Deployment Signal
    needs: [docker-security-audit]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Signal Success
        run: echo "SYSTEM-ARELORIA-WASD: All systems nominal. Ready for VPS deployment."