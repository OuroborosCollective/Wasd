name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Keine 'version' Angabe hier, damit pnpm automatisch die in der 
        # package.json im Feld 'packageManager' definierte Version nutzt.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Check
        run: pnpm audit

      - name: Build @ouroboros/shared
        run: pnpm --filter @ouroboros/shared build

      - name: Build all packages
        run: pnpm -r build

      - name: Run tests
        run: pnpm -r test