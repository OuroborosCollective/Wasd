name: CI v3

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        app: [api, web]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/test
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-flight Database Check
        run: |
          echo "Waiting for PostgreSQL at localhost:5432..."
          NEXT_WAIT_TIME=0
          until pg_isready -h localhost -p 5432 -U postgres || [ $NEXT_WAIT_TIME -eq 10 ]; do
            echo "Postgres is unavailable - sleeping..."
            sleep 2
            NEXT_WAIT_TIME=$((NEXT_WAIT_TIME+1))
          done
          if [ $NEXT_WAIT_TIME -eq 10 ]; then
            echo "Timeout reached: Postgres did not become ready."
            exit 1
          fi
          echo "PostgreSQL is ready."

      - name: Database Schema Migration
        if: matrix.app == 'api'
        run: |
          if [ -f "apps/api/prisma/schema.prisma" ]; then
            pnpm --filter api exec prisma migrate deploy
          fi
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build
        run: pnpm --filter ${{ matrix.app }} run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Enforce ESM in Dist
        shell: bash
        run: |
          DIST_DIR="apps/${{ matrix.app }}/dist"
          if [ -d "$DIST_DIR" ]; then
            echo "Enforcing ESM for $DIST_DIR"
            if [ -f "$DIST_DIR/package.json" ]; then
              node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('$DIST_DIR/package.json', 'utf8')); pkg.type = 'module'; fs.writeFileSync('$DIST_DIR/package.json', JSON.stringify(pkg, null, 2));"
            else
              echo '{"type": "module"}' > "$DIST_DIR/package.json"
            fi
          else
            echo "No dist directory found for ${{ matrix.app }}, skipping ESM enforcement."
          fi

      - name: Test
        run: pnpm --filter ${{ matrix.app }} run test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.app }}-${{ matrix.node-version }}
          path: |
            apps/${{ matrix.app }}/coverage
            apps/${{ matrix.app }}/dist
          if-no-files-found: ignore