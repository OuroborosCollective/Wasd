name: CI v3

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        app: [api, web]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is automatically synchronized with 'packageManager' field in package.json
        # to prevent "Multiple versions of pnpm specified" errors.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              break
            fi
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Build
        run: pnpm run build
        working-directory: apps/${{ matrix.app }}

      - name: Enforce ESM in Dist
        shell: bash
        run: |
          DIST_DIR="apps/${{ matrix.app }}/dist"
          if [ -d "$DIST_DIR" ]; then
            echo "Enforcing ESM for $DIST_DIR"
            if [ -f "$DIST_DIR/package.json" ]; then
              node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('$DIST_DIR/package.json', 'utf8')); pkg.type = 'module'; fs.writeFileSync('$DIST_DIR/package.json', JSON.stringify(pkg, null, 2));"
            else
              echo '{"type": "module"}' > "$DIST_DIR/package.json"
            fi
            echo "Verification of $DIST_DIR/package.json:"
            cat "$DIST_DIR/package.json"
          else
            echo "No dist directory found for ${{ matrix.app }}, skipping ESM enforcement."
          fi

      - name: Test
        run: pnpm test
        working-directory: apps/${{ matrix.app }}
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test

      - name: Upload artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.app }}-${{ matrix.node-version }}
          path: |
            apps/${{ matrix.app }}/coverage
            apps/${{ matrix.app }}/logs
            apps/${{ matrix.app }}/test-results
            apps/${{ matrix.app }}/dist
          if-no-files-found: ignore