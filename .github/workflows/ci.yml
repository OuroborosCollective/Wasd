name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node (deterministic runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm (locked version)
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Verify package manager consistency
        run: node -v && pnpm -v

      - name: Install dependencies (STRICT MODE)
        run: pnpm install --frozen-lockfile --prefer-offline --strict-peer-dependencies

      - name: Validate lockfile integrity
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Build workspace
        run: pnpm -r build

      - name: Test workspace
        run: pnpm -r test

      - name: Typecheck workspace
        run: pnpm -r typecheck

      - name: Ensure deterministic lockfile (no drift)
        run: git diff --exit-code pnpm-lock.yaml

      - name: Upload build artifacts (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/dist
            **/build
