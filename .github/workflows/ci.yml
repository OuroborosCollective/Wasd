name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [20.x]
        app: [api, web]

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Dependency Review and Submission
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

      - name: Dependency Submission
        uses: target/github-dependency-submission-action@v0
        if: github.event_name == 'push' && matrix.app == 'api'
        continue-on-error: true

      - name: Build
        run: pnpm run build --if-present
        working-directory: apps/${{ matrix.app }}
        shell: bash

      - name: Test
        run: pnpm test --if-present
        working-directory: apps/${{ matrix.app }}
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test

      - name: Upload Test Artifacts and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-results-${{ matrix.app }}-${{ matrix.node-version }}
          path: |
            apps/${{ matrix.app }}/coverage
            apps/${{ matrix.app }}/logs
            apps/${{ matrix.app }}/test-results
            dist/apps/${{ matrix.app }}
          retention-days: 7