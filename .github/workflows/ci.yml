name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Wenn keine Version angegeben ist, wird automatisch das 'packageManager' Feld der package.json genutzt.
          # Falls eine spezifische Version erzwungen werden soll, kann hier 'version: <version>' gesetzt werden.
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Remove npm artifacts
        run: rm -f package-lock.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @ouroboros/shared
        run: pnpm --filter @ouroboros/shared build

      - name: Build all packages
        run: pnpm -r build

      - name: Run tests
        run: pnpm -r test