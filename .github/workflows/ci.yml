name: CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'projects/**'
      - 'server/**'
      - 'client/**'
      - 'shared/**'
      - 'engine/**'
      - 'portal/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'projects/**'
      - 'server/**'
      - 'client/**'
      - 'shared/**'
      - 'engine/**'
      - 'portal/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Typecheck
        run: pnpm -r run typecheck || echo "Existing type errors found"
        shell: bash

      - name: Build
        run: pnpm build
        shell: bash

      - name: Test
        run: pnpm test
        shell: bash
