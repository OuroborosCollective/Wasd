name: Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Quality Check
        run: |
          if pnpm run | grep -q "lint"; then pnpm lint; fi
          if pnpm run | grep -q "typecheck"; then pnpm typecheck; fi

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Executing deployment steps..."
          # Add actual deployment commands here (e.g., pnpm deploy, vercel, docker push etc.)