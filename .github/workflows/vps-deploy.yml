name: Deploy to Production VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'conversation_data/**'

  workflow_dispatch:

concurrency:
  group: deploy-production-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      IMAGE_NAME: areloria
      IMAGE_TAG: latest
      VPS_PATH: /opt/areloria

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: |
          docker images
          docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} echo "Image OK"

      - name: Save Docker image
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > image.tar.gz
          ls -lh image.tar.gz

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure VPS directory exists
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p ${{ env.VPS_PATH }}"

      - name: Copy image to VPS
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            image.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.VPS_PATH }}/image.tar.gz

      - name: Deploy on VPS
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

            set -Eeuo pipefail

            cd /opt/areloria

            echo "Loading Docker image..."
            gzip -dc image.tar.gz | docker load

            echo "Removing transferred archive..."
            rm -f image.tar.gz

            echo "Stopping old containers..."
            docker compose down --remove-orphans

            echo "Starting new containers..."
            docker compose up -d --build

            echo "Cleaning unused Docker resources..."
            docker image prune -af || true
            docker container prune -f || true

            echo "Waiting for services..."
            sleep 15

            echo "Container status:"
            docker ps

            echo "Health verification..."
            docker compose ps

          EOF

      - name: Post-deploy cleanup
        run: |
          rm -f image.tar.gz

      - name: Deployment success
        run: |
          echo "Production deployment completed successfully."
