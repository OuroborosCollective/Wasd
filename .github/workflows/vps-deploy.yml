name: Deploy to Production VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'conversation_data/**'

  workflow_dispatch:

concurrency:
  group: deploy-production-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      IMAGE_NAME: areloria
      IMAGE_TAG: latest
      VPS_PATH: /opt/areloria

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} echo "Image OK"

      - name: Save Docker image
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > image.tar.gz
          ls -lh image.tar.gz

      - name: Deploy using SSH with Password
        uses: appleboy/ssh-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            mkdir -p ${{ env.VPS_PATH }}
            cd ${{ env.VPS_PATH }}
            echo "Loading Docker image..."
            gzip -dc image.tar.gz | docker load
            rm -f image.tar.gz
            docker compose down --remove-orphans || true
            docker compose up -d --build
            docker image prune -af || true
            docker container prune -f || true
            sleep 15
            docker ps

      - name: Post-deploy cleanup
        run: rm -f image.tar.gz

      - name: Deployment success
        run: echo "Production deployment completed successfully."
