name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      IMAGE_NAME: areloria
      IMAGE_TAG: latest
      VPS_PATH: /opt/areloria

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: |
          docker run --rm \
          ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
          echo "Docker image verified successfully"

      - name: Save Docker image
        run: |
          docker save \
          ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
          | gzip > image.tar.gz

          ls -lah image.tar.gz

      - name: Upload Docker image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "image.tar.gz,docker-compose.yml"
          target: ${{ env.VPS_PATH }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e

            mkdir -p ${{ env.VPS_PATH }}
            cd ${{ env.VPS_PATH }}

            echo "Loading Docker image..."
            gzip -dc image.tar.gz | docker load

            echo "Removing archive..."
            rm -f image.tar.gz

            echo "Stopping old containers..."
            docker compose down --remove-orphans || true

            echo "Starting new containers..."
            docker compose up -d

            echo "Cleaning unused Docker resources..."
            docker image prune -af || true
            docker container prune -f || true

            echo "Waiting for services..."
            sleep 20

            echo "Container status:"
            docker ps

      - name: Health Check
        run: |
          sleep 15
          curl -f http://${{ secrets.VPS_HOST }}:80/health || exit 1

      - name: Cleanup Runner Files
        run: |
          rm -f image.tar.gz

      - name: Deployment success
        run: |
          echo "🚀 Production deployment completed successfully."
