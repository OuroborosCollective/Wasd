# Deploy to VPS - Docker-based auto-deployment
name: Deploy to Production VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'conversation_data/**'
      - '!.github/workflows/vps-deploy.yml'
  
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: false
          tags: areloria:latest
          load: true

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Stop existing container
            docker stop areloria 2>/dev/null || true
            docker rm areloria 2>/dev/null || true

            # Load new image from artifact
            docker load -i /tmp/areloria.tar 2>/dev/null || echo "No tar, building fresh"

            # Run container
            docker run -d \
              --name areloria \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              --health-cmd "node -e \"fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\"" \
              --health-interval=30s \
              --health-timeout=3s \
              --health-retries=3 \
              areloria:latest

            sleep 15

            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health check passed!"
            else
              echo "✗ Health check failed (HTTP: $HTTP_CODE)"
              docker logs areloria --tail 20
            fi

            docker ps
            echo "=== Deployment Complete ==="