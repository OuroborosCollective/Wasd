name: Deploy to Production VPS

on:
 push:
 branches: [main]
 paths:
 - '**'
 - '!**.md'
 - '!docs/**'
 - '!conversation_data/**'
 workflow_dispatch:

concurrency:
 group: deploy-production-vps
 cancel-in-progress: true

permissions:
 contents: read

jobs:
 deploy:
 runs-on: ubuntu-latest
 timeout-minutes: 30

 env:
 IMAGE_NAME: areloria
 IMAGE_TAG: latest
 VPS_PATH: /opt/areloria

 steps:
 - name: Checkout
 uses: actions/checkout@v4
 with:
 fetch-depth: 0

 - name: Set up Docker Buildx
 uses: docker/setup-buildx-action@v3

 - name: Build Docker image
 uses: docker/build-push-action@v5
 with:
 context: .
 file: ./Dockerfile.prod
 push: false
 load: true
 tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
 cache-from: type=gha
 cache-to: type=gha,mode=max

 - name: Save Docker image
 run: |
 docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > image.tar.gz

 - name: Prepare SSH key
 run: |
 mkdir -p ~/.ssh
 echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
 chmod 600 ~/.ssh/id_rsa
 ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

 - name: Copy image to VPS
 run: |
 scp -i ~/.ssh/id_rsa image.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.VPS_PATH }}/image.tar.gz

 - name: Deploy on VPS
 run: |
 ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
 set -e
 cd /opt/areloria
 gzip -dc image.tar.gz | docker load
 rm -f image.tar.gz
 docker compose up -d --remove-orphans
 EOF
