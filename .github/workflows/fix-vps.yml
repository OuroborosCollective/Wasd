name: Fix VPS Server
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix and restart server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          timeout: 3m
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            echo "=== Starting VPS fix ==="
            cd /opt/areloria
            
            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            
            echo "=== Loading .env ==="
            if [ -f .env ]; then
              set -a
              source .env
              set +a
              echo "VITE_SUPABASE_URL from .env: ${VITE_SUPABASE_URL:-(empty)}"
            fi
            
            # Override VITE_SUPABASE_URL to use game origin (not GoTrue direct)
            export VITE_SUPABASE_URL="https://arelogic.space"
            echo "Using VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            
            echo "=== Installing dependencies ==="
            pnpm install --no-frozen-lockfile 2>&1 | tail -5
            
            echo "=== Building ==="
            NODE_OPTIONS="--max-old-space-size=8192" pnpm run build 2>&1 | tail -10
            
            echo "=== Restarting PM2 ==="
            pm2 restart areloria 2>&1 || pm2 start server/dist/index.js --name areloria 2>&1
            
            echo "=== Waiting for server ==="
            sleep 5
            curl -sf --max-time 10 http://127.0.0.1:3000/health | head -c 200 || echo "SERVER_NOT_RESPONDING"
            
            echo "=== PM2 status ==="
            pm2 status
            
            echo "=== VITE_SUPABASE_URL in bundle ==="
            grep -o 'VITE_SUPABASE_URL:`[^`]*`' /opt/areloria/client/dist/assets/index-*.js 2>/dev/null | head -3 || echo "Could not check bundle"
            
            echo "=== Fixing Nginx WASM config ==="
            python3 << 'PYEOF'
            import re
            conf = "/etc/nginx/sites-enabled/arelogic.space"
            with open(conf, "r") as f:
                config = f.read()
            # Remove any existing wasm location block
            config = re.sub(r'\s*#[^\n]*[Ww]asm[^\n]*\n\s*location ~\* \.wasm\$ \{[^}]*\}\n', '\n', config)
            # Add WASM block right before the /assets/ block
            wasm_block = """    # WASM MIME type (critical for Havok physics)
    location ~* \\.wasm$ {
        root /opt/areloria/client/dist;
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

"""
            if "    location /assets/ {" in config:
                config = config.replace("    location /assets/ {", wasm_block + "    location /assets/ {")
            else:
                config = config.replace("    location / {", wasm_block + "    location / {")
            with open(conf, "w") as f:
                f.write(config)
            print("Nginx config updated")
            PYEOF
            nginx -t && systemctl reload nginx
            echo "Nginx reloaded"
            
            echo "=== Testing WASM ==="
            sleep 2
            curl -sI https://arelogic.space/assets/HavokPhysics-hlBZeaGL.wasm 2>/dev/null | head -5 || echo "CURL_FAILED"
            
            echo "=== Done ==="
