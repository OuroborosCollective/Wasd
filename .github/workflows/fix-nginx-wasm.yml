name: Fix Nginx WASM MIME
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Apply WASM MIME fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            CONF=/etc/nginx/sites-enabled/arelogic.space
            cp $CONF $CONF.bak
            echo "" | base64 -d > $CONF
            echo "Config written"
            nginx -t
            systemctl reload nginx || nginx -s reload
            sleep 2
            grep -A5 wasm $CONF
            echo "DONE"
