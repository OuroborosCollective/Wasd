name: Fix Nginx WASM MIME Type
on:
  workflow_dispatch:

jobs:
  fix-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose current Nginx config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          timeout: 3m
          command_timeout: 10m
          script_stop: true
          script: |
            echo "=== Step 1: Find Nginx config ==="
            find /etc/nginx -name "*.conf" -type f 2>/dev/null
            echo "=== Step 2: Show current config ==="
            cat /etc/nginx/sites-enabled/arelogic.space 2>/dev/null || echo "NOT FOUND"
            echo "=== Step 3: Check if WASM config exists ==="
            grep -n 'wasm' /etc/nginx/sites-enabled/arelogic.space 2>/dev/null || echo "NO_WASM_CONFIG"
            echo "=== Step 4: Show nginx -t ==="
            nginx -t 2>&1 || echo "NGINX_TEST_FAILED"
            echo "=== Step 5: Check what nginx serves ==="
            curl -sI https://arelogic.space/ 2>/dev/null | head -10 || echo "CURL_FAILED"
            echo "=== DONE ==="

      - name: Apply WASM MIME fix
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          timeout: 3m
          command_timeout: 10m
          script_stop: true
          script: |
            CONF="/etc/nginx/sites-enabled/arelogic.space"
            echo "=== Backing up ==="
            cp "$CONF" "$CONF.bak-$(date +%s)"
            
            echo "=== Current config ==="
            cat "$CONF"
            
            echo "=== Checking for existing wasm config ==="
            if grep -q 'wasm' "$CONF"; then
              echo "WASM config already exists!"
            else
              echo "Adding WASM config..."
              # Use sed to insert before the first 'location /' block
              sed -i '/location \/ {/i\    # WASM MIME type (critical for Havok physics)\n    location ~* \\.wasm$ {\n        default_type application/wasm;\n        add_header Cross-Origin-Opener-Policy same-origin;\n        add_header Cross-Origin-Embedder-Policy require-corp;\n        add_header Cache-Control "public, max-age=31536000, immutable";\n    }\n' "$CONF"
              echo "WASM config added via sed"
            fi
            
            echo "=== New config ==="
            cat "$CONF"
            
            echo "=== Testing nginx ==="
            nginx -t 2>&1
            
            echo "=== Reloading ==="
            systemctl reload nginx 2>&1 || nginx -s reload 2>&1
            
            echo "=== Verifying ==="
            sleep 2
            curl -sI https://arelogic.space/ 2>/dev/null | head -10
            
            echo "=== DONE ==="
