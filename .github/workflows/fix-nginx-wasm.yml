name: Fix Nginx WASM MIME
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Nginx WASM config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          timeout: 3m
          command_timeout: 5m
          script_stop: true
          script: |
            set -e
            echo "=== Current WASM config ==="
            grep -A8 'wasm' /etc/nginx/sites-enabled/arelogic.space 2>/dev/null || echo "NO_WASM_BLOCK"
            
            echo ""
            echo "=== Fixing Nginx config ==="
            python3 << 'PYEOF'
            import re
            
            conf = "/etc/nginx/sites-enabled/arelogic.space"
            with open(conf, "r") as f:
                config = f.read()
            
            # Remove any existing wasm location block
            config = re.sub(r'\s*#[^\n]*[Ww]asm[^\n]*\n\s*location ~\* \.wasm\$ \{[^}]*\}\n', '\n', config)
            
            # Add WASM block right before the /assets/ block
            wasm_block = """    # WASM MIME type (critical for Havok physics)
    location ~* \\.wasm$ {
        root /opt/areloria/client/dist;
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

"""
            if "    location /assets/ {" in config:
                config = config.replace("    location /assets/ {", wasm_block + "    location /assets/ {")
            else:
                # Fallback: add before location /
                config = config.replace("    location / {", wasm_block + "    location / {")
            
            with open(conf, "w") as f:
                f.write(config)
            
            print("Config updated successfully")
            PYEOF
            
            echo ""
            echo "=== Verifying config ==="
            grep -A10 'wasm' /etc/nginx/sites-enabled/arelogic.space | head -12
            
            echo ""
            echo "=== Testing nginx config ==="
            nginx -t
            
            echo ""
            echo "=== Reloading nginx ==="
            systemctl reload nginx
            
            echo ""
            echo "=== Testing WASM locally ==="
            sleep 2
            # Test via HTTPS (use -k to ignore self-signed cert issues)
            curl -skI https://127.0.0.1/assets/HavokPhysics-hlBZeaGL.wasm 2>/dev/null | head -10
            
            echo ""
            echo "=== WASM file check ==="
            ls -la /opt/areloria/client/dist/assets/HavokPhysics*.wasm 2>/dev/null || echo "NO_WASM_FILE"
            
            echo ""
            echo "=== DONE ==="
