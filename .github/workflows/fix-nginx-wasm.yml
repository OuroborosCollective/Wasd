name: Fix Nginx WASM MIME Type
on:
  workflow_dispatch:

jobs:
  fix-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Nginx WASM MIME type
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          timeout: 3m
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            echo "=== Starting Nginx WASM MIME fix ==="

            # Find Nginx config
            echo "=== Finding Nginx config ==="
            NGINX_CONF=""
            if [ -f /etc/nginx/sites-enabled/arelogic.space ]; then
              NGINX_CONF="/etc/nginx/sites-enabled/arelogic.space"
            elif [ -f /etc/nginx/conf.d/arelogic.space.conf ]; then
              NGINX_CONF="/etc/nginx/conf.d/arelogic.space.conf"
            elif [ -f /etc/nginx/nginx.conf ]; then
              NGINX_CONF="/etc/nginx/nginx.conf"
            else
              echo "ERROR: No Nginx config found!"
              find /etc/nginx -name "*.conf" -type f 2>/dev/null
              exit 1
            fi
            echo "Using config: $NGINX_CONF"

            # Backup
            BACKUP="$NGINX_CONF.backup-$(date +%Y%m%d-%H%M%S)"
            cp "$NGINX_CONF" "$BACKUP"
            echo "Backed up to: $BACKUP"

            # Check if WASM location block already exists
            if grep -q '\.wasm' "$NGINX_CONF"; then
              echo "WASM config already exists in $NGINX_CONF"
              grep -A5 '\.wasm' "$NGINX_CONF"
            else
              echo "Adding WASM MIME type location block..."

              # Find the first 'location /' block and insert WASM block before it
              if grep -q 'location / {' "$NGINX_CONF"; then
                # Create temp file with WASM block inserted before 'location / {'
                awk '
                  /location \/ \{/ && !done {
                    print "    # WASM MIME type (critical for Havok physics)"
                    print "    location ~* \\.wasm$ {"
                    print "        default_type application/wasm;"
                    print "        add_header Cross-Origin-Opener-Policy same-origin;"
                    print "        add_header Cross-Origin-Embedder-Policy require-corp;"
                    print "        add_header Cache-Control \"public, max-age=31536000, immutable\";"
                    print "    }"
                    print ""
                    done = 1
                  }
                  { print }
                ' "$NGINX_CONF" > "$NGINX_CONF.tmp"
                mv "$NGINX_CONF.tmp" "$NGINX_CONF"
                echo "WASM location block added"
              else
                echo "WARNING: Could not find 'location / {' in config"
                echo "Please add manually:"
                echo '    location ~* \.wasm$ {'
                echo '        default_type application/wasm;'
                echo '    }'
              fi
            fi

            # Test Nginx config
            echo "=== Testing Nginx config ==="
            nginx -t 2>&1

            # Reload Nginx
            echo "=== Reloading Nginx ==="
            systemctl reload nginx 2>&1 || nginx -s reload 2>&1
            echo "Nginx reloaded"

            # Verify WASM MIME type
            echo "=== Verifying WASM MIME type ==="
            sleep 2

            # Find a .wasm file to test
            WASM_FILE=$(find /opt/areloria/client/dist -name "*.wasm" 2>/dev/null | head -1)
            if [ -z "$WASM_FILE" ]; then
              WASM_FILE=$(find /opt/Wasd/client/dist -name "*.wasm" 2>/dev/null | head -1)
            fi

            if [ -n "$WASM_FILE" ]; then
              WASM_NAME=$(basename "$WASM_FILE")
              echo "Testing WASM file: $WASM_NAME"
              curl -sI "http://127.0.0.1/assets/$WASM_NAME" 2>/dev/null | grep -i content-type || echo "No content-type header found (may need full URL with domain)"
              curl -sI "https://arelogic.space/assets/$WASM_NAME" 2>/dev/null | grep -i content-type || echo "External check failed"
            else
              echo "No .wasm file found in dist, checking any .wasm URL..."
              # Try common Havok wasm name patterns
              curl -sI "https://arelogic.space/" 2>/dev/null | head -5
            fi

            # Show final Nginx config snippet
            echo "=== Final WASM config ==="
            grep -A8 '\.wasm' "$NGINX_CONF" || echo "WASM config not found in final check!"

            echo "=== Done ==="
