name: Autonomous CI Layer

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  ai-autofix-ci:
    if: ${{ github.actor == 'dependabot[bot]' || contains(github.head_ref, 'fix/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      # ----------------------------
      # GATE
      # ----------------------------
      - name: Merge Gate
        id: gate
        run: |
          pnpm run lint && pnpm test && echo "safe=true" >> $GITHUB_OUTPUT || echo "safe=false" >> $GITHUB_OUTPUT

      # ----------------------------
      # AUTO MERGE
      # ----------------------------
      - name: Auto merge PR
        if: steps.gate.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --auto
