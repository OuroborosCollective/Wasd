name: Autonomous CI Layer

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  ai-autofix-ci:
    if: ${{ github.actor == 'dependabot[bot]' || contains(github.head_ref, 'fix/') }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      # ----------------------------
      # SAFETY CHECK (skip AI for truly sensitive files)
      # ----------------------------
      - name: Block sensitive paths
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          blocked="$(printf '%s\n' "$changed" | grep -E '(^|/)server/src/middleware/authMiddleware\.ts$|(^|/)server/src/config/supabase\.ts$|(^|/)server/src/(security|crypto|secrets?)(/|$)|(^|/)server/src/core/(Auth|Crypto|Security|Secret|Secrets|Token|Key).*\.(ts|js)$|(^|/)\.github/workflows/(release|deploy|security).*\.ya?ml$' || true)"
          if [ -n "$blocked" ]; then
            echo "Blocked sensitive path changes:"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "safe"

      - name: Reinstall deps
        run: pnpm install --no-frozen-lockfile

      - name: Optional autofix
        run: |
          set -euo pipefail
          pnpm -r --if-present lint:fix
          pnpm -r --if-present format:write
          pnpm -r --if-present format

      - name: Build shared workspace package
        run: pnpm --filter @wasd/shared build

      - name: Determinism guard
        run: node scripts/determinism-changed-files-guard.mjs

      - name: Lint
        run: |
          set -euo pipefail
          pnpm -r --if-present lint || echo "::warning::package lint failed after optional autofix; continuing to deterministic gates"
          pnpm run guard:all
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/server exec tsc --noEmit

      - name: Test
        run: pnpm -r --if-present test

      # ----------------------------
      # GATE
      # ----------------------------
      - name: Merge Gate
        id: gate
        run: |
          set -euo pipefail
          pnpm --filter @wasd/shared build
          node scripts/determinism-changed-files-guard.mjs
          pnpm -r --if-present lint || echo "::warning::package lint failed after optional autofix; deterministic gates continue"
          pnpm run guard:all
          NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/server exec tsc --noEmit
          pnpm -r --if-present test
          echo "safe=true" >> $GITHUB_OUTPUT

      # ----------------------------
      # COMMIT FIXES
      # ----------------------------
      - name: Commit AI fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: autonomous AI fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      # ----------------------------
      # AUTO MERGE
      # ----------------------------
      - name: Auto merge PR
        if: steps.gate.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --auto
