name: Autonomous CI Layer

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  ai-autofix-ci:
    if: ${{ github.actor == 'dependabot[bot]' || contains(github.head_ref, 'fix/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      # ----------------------------
      # SAFETY CHECK (skip AI for now)
      # ----------------------------
      - name: Block sensitive paths
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E "core|auth|security|crypto" && exit 1 || echo "safe"

      - name: Reinstall deps
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      # ----------------------------
      # GATE
      # ----------------------------
      - name: Merge Gate
        id: gate
        run: |
          pnpm run lint && pnpm test && echo "safe=true" >> $GITHUB_OUTPUT || echo "safe=false" >> $GITHUB_OUTPUT

      # ----------------------------
      # COMMIT FIXES
      # ----------------------------
      - name: Commit AI fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: autonomous AI fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      # ----------------------------
      # AUTO MERGE
      # ----------------------------
      - name: Auto merge PR
        if: steps.gate.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --auto
