name: Autonomous CI Layer

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  ai-autofix-ci:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > "$RUNNER_TEMP/diff.txt"

      - name: Detect server relevant changes
        id: changes
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(server/|packages/shared/|packages/core-logic/|package\.json$|pnpm-lock\.yaml$|tsconfig\.base\.json$)' >/dev/null; then
            echo "server_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "server_relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Block sensitive paths
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          blocked="$(printf '%s\n' "$changed" | grep -E '(^|/)server/src/middleware/authMiddleware\.ts$|(^|/)server/src/config/supabase\.ts$|(^|/)server/src/(security|crypto|secrets?)(/|$)|(^|/)server/src/core/(Auth|Crypto|Security|Secret|Secrets|Token|Key).*\.(ts|js)$|(^|/)\.github/workflows/(release|deploy|security).*\.ya?ml$' || true)"
          if [ -n "$blocked" ]; then
            echo "Blocked sensitive path changes:"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "safe"

      - name: Reinstall deps
        run: pnpm install --no-frozen-lockfile

      - name: Optional autofix
        if: ${{ github.actor == 'dependabot[bot]' || contains(github.head_ref, 'fix/') }}
        run: |
          set -euo pipefail
          pnpm -r --if-present lint:fix
          pnpm -r --if-present format:write
          pnpm -r --if-present format

      - name: Build shared workspace package
        run: pnpm --filter @wasd/shared build

      - name: Determinism guard
        run: node scripts/determinism-changed-files-guard.mjs

      - name: Lint
        run: |
          set -o pipefail
          {
            set -euo pipefail
            pnpm -r --if-present lint || echo "::warning::package lint failed after optional autofix; continuing to deterministic gates"
            pnpm run guard:all
            if [ "${{ steps.changes.outputs.server_relevant }}" = "true" ]; then
              NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/server exec tsc --noEmit
            else
              echo "No server/shared/core changes detected; skipping server tsc gate for this PR."
            fi
          } 2>&1 | tee "$RUNNER_TEMP/runtime-truth-lint.log"

      - name: Upload runtime truth lint diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-truth-lint-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-truth-lint.log
          if-no-files-found: error
          retention-days: 1

      - name: Test
        run: pnpm -r --if-present test

      - name: Merge Gate
        id: gate
        run: |
          set -euo pipefail
          pnpm --filter @wasd/shared build
          node scripts/determinism-changed-files-guard.mjs
          pnpm -r --if-present lint || echo "::warning::package lint failed after optional autofix; deterministic gates continue"
          pnpm run guard:all
          if [ "${{ steps.changes.outputs.server_relevant }}" = "true" ]; then
            NODE_OPTIONS="--max-old-space-size=3072" pnpm --filter @wasd/server exec tsc --noEmit
          else
            echo "No server/shared/core changes detected; skipping server tsc gate for this PR."
          fi
          pnpm -r --if-present test
          echo "safe=true" >> $GITHUB_OUTPUT

      - name: Commit AI fixes
        if: ${{ github.actor == 'dependabot[bot]' || contains(github.head_ref, 'fix/') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -- ':!diff.txt'

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: autonomous AI fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
