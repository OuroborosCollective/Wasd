name: Import Stitch 2D Atlases

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number containing Stitch atlas ZIP attachments'
        required: false
        default: '1071'
      persist:
        description: 'Commit imported assets to a PR branch after validation'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths:
      - '.github/stitch-import-trigger.txt'
      - '.github/workflows/import-stitch-atlases.yml'
      - 'scripts/import-stitch-generated-atlases.mjs'
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  import-stitch-atlases:
    name: Import generated Stitch atlases
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 1071 && contains(github.event.comment.body, 'stitch'))
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Enable Sharp pixel skill for Stitch assets
        run: |
          set -euo pipefail
          pnpm add -D sharp --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts=false --reporter=append-only
          node -e "import('sharp').then(()=>console.log('sharp ok')).catch(e=>{console.error('sharp load failed:',e.message);process.exit(1)})"

      - name: Resolve import issue number
        id: import_issue
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.inputs.issue_number || '1071' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Stitch atlas ZIPs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.import_issue.outputs.number }}
        run: |
          echo '=== import stitch generated atlases ==='
          node scripts/import-stitch-generated-atlases.mjs

      - name: Validate client-2d asset manifest
        run: pnpm --filter @wasd/client-2d validate:assets

      - name: Build client-2d
        run: NODE_OPTIONS=--max-old-space-size=4096 pnpm --filter @wasd/client-2d build

      - name: Verify dist structure
        run: |
          test -d apps/client-2d/dist
          test -f apps/client-2d/dist/index.html
          test -d apps/client-2d/dist/assets
          test -f apps/client-2d/dist/2d-assets/manifest.json
          test -f apps/client-2d/dist/2d-assets/stitch/stitch-atlas-manifest.json

      - name: Upload dist artifact
        if: success() && hashFiles('apps/client-2d/dist/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: client-2d-stitch-dist
          path: apps/client-2d/dist
          retention-days: 3

      - name: Create import pull request
        if: success() && (github.event_name == 'push' || github.event_name == 'issue_comment' || github.event.inputs.persist == '' || github.event.inputs.persist == 'true')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: asset/stitch-import-${{ steps.import_issue.outputs.number }}
          delete-branch: true
          title: 'assets(client-2d): import Stitch atlases from issue #${{ steps.import_issue.outputs.number }}'
          body: |
            Generated by the Import Stitch 2D Atlases workflow.

            Source issue: #${{ steps.import_issue.outputs.number }}

            This PR includes normalized Stitch atlas files, manifest updates, and provenance metadata after successful validation and client-2d build.
          commit-message: 'assets(client-2d): import Stitch atlases from issue #${{ steps.import_issue.outputs.number }}'
          add-paths: |
            apps/client-2d/public/2d-assets/manifest.json
            apps/client-2d/public/2d-assets/stitch/**
            apps/client-2d/public/2d-assets/credits/stitch-generated-atlas-provenance.md
