name: VPS Docker Deploy (monorepo)

run-name: VPS Docker Deploy • ${{ github.event_name }} • ${{ github.ref_name }} • ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Deploy reason"
        required: false
        default: "Manual deploy"
      arelorian_port:
        description: "Engine host port on VPS"
        required: false
        default: "3001"
      docker_network:
        description: "External Docker network"
        required: false
        default: "areloria_arelorian-network"
      ssh_port:
        description: "VPS SSH port"
        required: false
        default: "22"

concurrency:
  group: vps-docker-deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      DEPLOY_REASON: ${{ inputs.reason || 'Push deploy' }}
      # The provisioner-owned secret is canonical. DEPLOY_PATH remains a temporary
      # compatibility alias for installations that have not yet been renamed.
      DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || secrets.DEPLOY_PATH || '/opt/areloria' }}
      DEPLOY_BRANCH: main
      ARELORIAN_PORT: ${{ inputs.arelorian_port || '3001' }}
      ARELORIAN_DOCKER_NETWORK: ${{ inputs.docker_network || 'areloria_arelorian-network' }}
      SSH_PORT: ${{ inputs.ssh_port || secrets.SSH_PORT || '22' }}
      CLIENT_2D_ARCHIVE: wasd-client-2d-dist-${{ github.sha }}.tgz
      CLIENT_2D_MARKER: REAL_PIXI_CLIENT
      CLIENT_2D_BUILD_SHA: ${{ github.sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Validate canonical deployment path
        run: |
          set -euo pipefail
          case "${DEPLOY_PATH}" in
            /*) ;;
            *) echo "::error::VPS_DEPLOY_PATH/DEPLOY_PATH must be an absolute path."; exit 1 ;;
          esac
          if [ "${DEPLOY_PATH}" = "/" ]; then
            echo "::error::Refusing to deploy into the filesystem root."
            exit 1
          fi
          echo "Canonical deployment path accepted."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Strict source sanity gate
        run: |
          set -euo pipefail
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f Dockerfile.vps
          test -f server/src/core/watchdog-live-sensors.ts
          test -f server/src/core/installWorldTickWatchdogBridge.ts
          grep -q 'watchdog-live-sensors.js' Dockerfile.vps
          grep -q 'world.sensor.frame' Dockerfile.vps
          grep -q 'liveWatchdogSensors' Dockerfile.vps
          grep -q 'liveWatchdogSensors' server/src/core/installWorldTickWatchdogBridge.ts
          grep -q 'world.sensor.frame' server/src/core/watchdog-live-sensors.ts
          grep -q 'installDeterministicWatchdogRuntime' server/src/index.ts
          echo "Strict source gate OK."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Set up pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
          pnpm config set store-dir .pnpm-store
          pnpm config set verify-deps-before-run false

      - name: Install client-2d dependencies
        run: |
          set -euo pipefail
          pnpm --filter @wasd/client-2d... install --lockfile-only --no-frozen-lockfile --prefer-offline --ignore-scripts --network-concurrency=1 --child-concurrency=1 --reporter=append-only
          pnpm --filter @wasd/client-2d... install --frozen-lockfile --prefer-offline --ignore-scripts --network-concurrency=1 --child-concurrency=1 --reporter=append-only

      - name: Set up Python and Pillow
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow

      - name: Import Cozy Spring assets when inbox exists
        run: |
          set -euo pipefail
          INBOX="apps/client-2d/public/assets/cozy-spring"
          MANIFEST="apps/client-2d/public/assets/cozy-spring/manifest.json"
          if [ -d ".asset-inbox/cozy-spring" ]; then
            echo "Importing Cozy Spring assets from .asset-inbox/cozy-spring"
            python3 scripts/extract-cozy-spring-objects.py --inbox ".asset-inbox/cozy-spring" --output "$INBOX" --tmp .tmp/cozy-spring-extract --verbose
            echo "Filtering keyboard glyph props from runtime spawning"
            python3 scripts/filter-cozy-keyboard-glyph-props.py --manifest "$MANIFEST" --output-root "$INBOX"
          else
            echo "No Cozy inbox found; using committed fallback assets."
          fi
          test -f "$MANIFEST"
          node -e "const m=require('./${MANIFEST}'); if(m.importPolicy!=='tilesets-as-tiles-props-as-extracted-objects'||!m.props||Object.keys(m.props).length===0){throw new Error('Invalid Cozy manifest')}; console.log('Cozy manifest OK', Object.keys(m.props).length)"

      - name: Import Stitch game assets when inbox exists
        run: |
          set -euo pipefail
          STITCH_INBOX=".asset-inbox/stitch"
          STITCH_OUT="apps/client-2d/public/2d-assets/game-assets"
          if [ -d "$STITCH_INBOX" ] && [ -n "$(ls -A "$STITCH_INBOX" 2>/dev/null)" ]; then
            echo "Importing Stitch game assets from $STITCH_INBOX"
            mkdir -p "$STITCH_OUT"
            cp -r "$STITCH_INBOX"/* "$STITCH_OUT/" 2>/dev/null || true
            node scripts/stitch-game-assets-importer.mjs --local-inbox "$STITCH_INBOX" --output "$STITCH_OUT"
          else
            echo "No Stitch inbox found; skipping Stitch asset import."
          fi
          echo "Stitch assets ready at $STITCH_OUT"

      - name: Build client-2d on GitHub runner
        run: |
          set -euo pipefail
          # Force a fresh build - no cache, no --if-present.
          # The VPS side does git reset --hard which can restore stale dist/ from git history,
          # so we must always build from scratch here and ensure the artifact is fresh.
          rm -rf apps/client-2d/dist
          pnpm --filter @wasd/client-2d build
          test -f apps/client-2d/dist/index.html
          grep -q "${CLIENT_2D_MARKER}" apps/client-2d/dist/index.html
          test -f apps/client-2d/dist/manifest.webmanifest
          test -f apps/client-2d/dist/service-worker.js
          node <<'NODE'
          const fs = require('node:fs');
          const sha = process.env.CLIENT_2D_BUILD_SHA;
          if (!sha) throw new Error('CLIENT_2D_BUILD_SHA missing');
          fs.writeFileSync('apps/client-2d/dist/build-stamp.json', JSON.stringify({ ok: true, app: 'client-2d', commit: sha, marker: process.env.CLIENT_2D_MARKER || 'REAL_PIXI_CLIENT', generatedBy: 'vps-docker-deploy.yml' }, null, 2));
          NODE
          grep -q "${CLIENT_2D_BUILD_SHA}" apps/client-2d/dist/build-stamp.json
          tar -C apps/client-2d -czf "${CLIENT_2D_ARCHIVE}" dist
          ls -lh "${CLIENT_2D_ARCHIVE}"

      - name: Install sshpass
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Verify VPS SSH connection with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "SSH attempt ${attempt}/5 to port ${SSH_PORT}"
            if sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
              -p "${SSH_PORT}" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=65 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=6 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "echo 'SSH OK'; hostname; uname -a; command -v docker; docker --version; df -h /"; then
              exit 0
            fi
            sleep 16
          done
          echo "ERROR: VPS SSH stayed unreachable after retries."
          exit 255

      - name: Upload prebuilt client-2d artifact to VPS
        run: |
          set -euo pipefail
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "mkdir -p '${DEPLOY_PATH}'"
          for attempt in 1 2 3; do
            echo "SCP attempt ${attempt}/3"
            if sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -P "${SSH_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${CLIENT_2D_ARCHIVE}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${DEPLOY_PATH}/${CLIENT_2D_ARCHIVE}"; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Run strict Docker deploy on VPS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          API_KEYS: ${{ secrets.API_KEYS }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          RUNTIME_ENV_PATCH: ${{ runner.temp }}/wasd-runtime-env-${{ github.run_id }}.env
        run: |
          set -euo pipefail
          umask 077
          : > "$RUNTIME_ENV_PATCH"
          for key in DATABASE_URL API_KEY API_KEYS ALLOWED_ORIGINS CORS_ORIGINS; do
            value="${!key-}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> "$RUNTIME_ENV_PATCH"
            fi
          done
          chmod 600 "$RUNTIME_ENV_PATCH"
          RUNTIME_ENV_PATCH_NAME=".wasd-runtime-env-${GITHUB_RUN_ID}.env"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp \
            -P "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$RUNTIME_ENV_PATCH" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${DEPLOY_PATH}/${RUNTIME_ENV_PATCH_NAME}"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=36 \
            -o ServerAliveCountMax=16 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' ARELORIAN_PORT='${ARELORIAN_PORT}' ARELORIAN_DOCKER_NETWORK='${ARELORIAN_DOCKER_NETWORK}' CLIENT_2D_ARCHIVE='${CLIENT_2D_ARCHIVE}' CLIENT_2D_MARKER='${CLIENT_2D_MARKER}' CLIENT_2D_BUILD_SHA='${CLIENT_2D_BUILD_SHA}' GITHUB_SHA_EXPECTED='${GITHUB_SHA}' RUNTIME_ENV_PATCH='${RUNTIME_ENV_PATCH_NAME}' bash -s" <<'REMOTE_EOF'
          set -Eeuo pipefail
          APP_DIR="${DEPLOY_PATH:-/opt/areloria}"
          BRANCH="${DEPLOY_BRANCH:-main}"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          if [ -n "${RUNTIME_ENV_PATCH:-}" ]; then
            case "$RUNTIME_ENV_PATCH" in
              .wasd-runtime-env-*.env) ;;
              *) echo "ERROR: refusing an unsafe runtime env patch path"; exit 1 ;;
            esac
            trap 'rm -f -- "$RUNTIME_ENV_PATCH"' EXIT
          fi
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          if [ ! -d .git ]; then
            # Installer-managed paths may already contain runtime files such as .env or
            # data/. Initialise Git in place instead of failing with `git clone ... .`.
            git init
            git remote add origin "$REPO_URL"
          else
            git remote set-url origin "$REPO_URL" || true
          fi
          git fetch --no-tags origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          git clean -fd -e .env -e .env.local -e .env.docker -e data/ -e logs/ -e "$CLIENT_2D_ARCHIVE" -e "$RUNTIME_ENV_PATCH" -e apps/client-2d/dist/ -e .asset-inbox/ || true
          if [ -n "${RUNTIME_ENV_PATCH:-}" ]; then
            test -f "$RUNTIME_ENV_PATCH"
            umask 077
            touch .env.docker
            chmod 600 .env.docker
            while IFS= read -r entry || [ -n "$entry" ]; do
              case "$entry" in
                [A-Za-z_][A-Za-z0-9_]*=*)
                  key="${entry%%=*}"
                  tmp=".env.docker.tmp.$$"
                  grep -v "^${key}=" .env.docker > "$tmp" || true
                  printf '%s\n' "$entry" >> "$tmp"
                  chmod 600 "$tmp"
                  mv "$tmp" .env.docker
                  ;;
                '') ;;
                *) echo "ERROR: refusing malformed runtime env entry"; exit 1 ;;
              esac
            done < "$RUNTIME_ENV_PATCH"
            rm -f "$RUNTIME_ENV_PATCH"
            echo "Runtime environment patched from protected workflow inputs."
          fi
          echo "Remote HEAD=$(git rev-parse HEAD)"
          echo "Expected HEAD=$GITHUB_SHA_EXPECTED"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA_EXPECTED"
          test -f Dockerfile.vps
          test -f server/src/core/watchdog-live-sensors.ts
          test -f server/src/core/installWorldTickWatchdogBridge.ts
          grep -q 'watchdog-live-sensors.js' Dockerfile.vps
          grep -q 'world.sensor.frame' Dockerfile.vps
          grep -q 'liveWatchdogSensors' Dockerfile.vps
          grep -q 'liveWatchdogSensors' server/src/core/installWorldTickWatchdogBridge.ts
          grep -q 'world.sensor.frame' server/src/core/watchdog-live-sensors.ts
          grep -q 'installDeterministicWatchdogRuntime' server/src/index.ts
          echo "Remote strict source gate OK."
          if [ -n "${CLIENT_2D_ARCHIVE:-}" ] && [ -f "$APP_DIR/$CLIENT_2D_ARCHIVE" ]; then
            rm -rf apps/client-2d/dist
            mkdir -p apps/client-2d
            tar -xzf "$APP_DIR/$CLIENT_2D_ARCHIVE" -C apps/client-2d
            test -f apps/client-2d/dist/index.html
            grep -q "$CLIENT_2D_MARKER" apps/client-2d/dist/index.html
            test -f apps/client-2d/dist/build-stamp.json
            grep -q "$CLIENT_2D_BUILD_SHA" apps/client-2d/dist/build-stamp.json
          else
            echo "WARN: no prebuilt client-2d archive found; Dockerfile must build it."
          fi
          chmod +x scripts/deploy-vps-docker.sh scripts/vps-docker-inline-deploy.sh 2>/dev/null || true
          ARELORIAN_PORT="${ARELORIAN_PORT:-3001}" \
          ARELORIAN_DOCKER_NETWORK="${ARELORIAN_DOCKER_NETWORK:-areloria_arelorian-network}" \
          ARELORIAN_ENV_FILE=".env.docker" \
          CLIENT_2D_ARCHIVE="$CLIENT_2D_ARCHIVE" \
          CLIENT_2D_MARKER="$CLIENT_2D_MARKER" \
          CLIENT_2D_BUILD_SHA="$CLIENT_2D_BUILD_SHA" \
          DEPLOY_BRANCH="$BRANCH" \
          bash scripts/deploy-vps-docker.sh
          REMOTE_EOF

      - name: Public health check
        run: |
          set -euo pipefail
          for path in /health / /portal/ /2d/build-stamp.json; do
            echo "Checking https://arelorian.de${path}"
            STATUS="$(curl -k -s -o /dev/null -w "%{http_code}" "https://arelorian.de${path}" || true)"
            echo "Status: ${STATUS}"
            if ! echo "$STATUS" | grep -Eq "^(200|204|301|302|304|401|403|503)$"; then
              echo "Health check failed for ${path}"
              exit 1
            fi
          done
          STAMP="$(curl -k -sS -L --max-time 20 "https://arelorian.de/2d/build-stamp.json" || true)"
          STAMP="$STAMP" CLIENT_2D_BUILD_SHA="$CLIENT_2D_BUILD_SHA" node <<'NODE'
          const raw = process.env.STAMP || '';
          const expected = process.env.CLIENT_2D_BUILD_SHA;
          let data;
          try { data = JSON.parse(raw); } catch { console.error('ERROR: build-stamp.json is not valid JSON'); console.error(raw.slice(0, 500)); process.exit(1); }
          if (data.commit !== expected) { console.error(`ERROR: stale 2D bundle. expected=${expected} got=${data.commit}`); process.exit(1); }
          console.log(`2D build stamp OK: ${data.commit}`);
          NODE

      - name: Verify live 2D bundle markers
        run: |
          set -euo pipefail
          BASE_URL=https://arelorian.de EXPECTED_SHA="${GITHUB_SHA}" bash scripts/verify-client-2d-live-bundle.sh

      - name: Production post-login 2D browser smoke
        run: |
          set -euo pipefail
          BASE_URL=https://arelorian.de node scripts/production-post-login-smoke.mjs
