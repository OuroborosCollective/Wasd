name: VPS Docker Deploy (monorepo)
run-name: VPS Docker Deploy • ${{ github.event_name }} • ${{ github.ref_name }} • ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deploy reason'
        required: false
        default: 'Manual deploy'
      arelorian_port:
        description: 'Engine host port on VPS'
        required: false
        default: '3001'
      docker_network:
        description: 'External Docker network'
        required: false
        default: 'areloria_arelorian-network'
      ssh_port:
        description: 'VPS SSH port'
        required: false
        default: '22'

concurrency:
  group: vps-docker-deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOY_REASON: ${{ inputs.reason || 'Push deploy' }}
      DEPLOY_PATH: /opt/areloria
      DEPLOY_BRANCH: main
      ARELORIAN_PORT: ${{ inputs.arelorian_port || '3001' }}
      ARELORIAN_DOCKER_NETWORK: ${{ inputs.docker_network || 'areloria_arelorian-network' }}
      SSH_PORT: ${{ inputs.ssh_port || secrets.SSH_PORT || '22' }}
      CLIENT_2D_ARCHIVE: wasd-client-2d-dist-${{ github.sha }}.tgz
      CLIENT_2D_MARKER: REAL_PIXI_CLIENT
      CLIENT_2D_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
          pnpm config set store-dir .pnpm-store
          pnpm config set verify-deps-before-run false

      - name: Install client-2d dependencies
        run: |
          pnpm --filter @wasd/client-2d... install --lockfile-only --no-frozen-lockfile --prefer-offline --ignore-scripts --network-concurrency=1 --child-concurrency=1 --reporter=append-only
          pnpm --filter @wasd/client-2d... install --frozen-lockfile --prefer-offline --ignore-scripts --network-concurrency=1 --child-concurrency=1 --reporter=append-only

      - name: Build client-2d on GitHub runner
        run: |
          pnpm --filter @wasd/client-2d --if-present build
          test -f apps/client-2d/dist/index.html
          grep -q "${CLIENT_2D_MARKER}" apps/client-2d/dist/index.html
          node - <<'NODE'
          const fs = require('node:fs');
          const sha = process.env.CLIENT_2D_BUILD_SHA;
          if (!sha) throw new Error('CLIENT_2D_BUILD_SHA missing');
          fs.writeFileSync('apps/client-2d/dist/build-stamp.json', JSON.stringify({
            ok: true,
            app: 'client-2d',
            commit: sha,
            marker: process.env.CLIENT_2D_MARKER || 'REAL_PIXI_CLIENT',
            generatedBy: 'vps-docker-deploy.yml'
          }, null, 2));
          NODE
          grep -q "${CLIENT_2D_BUILD_SHA}" apps/client-2d/dist/build-stamp.json
          tar -C apps/client-2d -czf "${CLIENT_2D_ARCHIVE}" dist
          ls -lh "${CLIENT_2D_ARCHIVE}"

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Verify VPS SSH connection
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH OK'; hostname; uname -a"

      - name: Upload prebuilt client-2d artifact to VPS
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${DEPLOY_PATH}'"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp \
            -P "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            "${CLIENT_2D_ARCHIVE}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${DEPLOY_PATH}/${CLIENT_2D_ARCHIVE}"

      - name: Run Docker deploy on VPS
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' ARELORIAN_PORT='${ARELORIAN_PORT}' ARELORIAN_DOCKER_NETWORK='${ARELORIAN_DOCKER_NETWORK}' CLIENT_2D_ARCHIVE='${CLIENT_2D_ARCHIVE}' CLIENT_2D_MARKER='${CLIENT_2D_MARKER}' CLIENT_2D_BUILD_SHA='${CLIENT_2D_BUILD_SHA}' bash -s" << 'EOF'
          set -Eeuo pipefail
          APP_DIR="${DEPLOY_PATH:-/opt/areloria}"
          BRANCH="${DEPLOY_BRANCH:-main}"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          CLIENT_2D_ARCHIVE="${CLIENT_2D_ARCHIVE:-}"
          CLIENT_2D_MARKER="${CLIENT_2D_MARKER:-REAL_PIXI_CLIENT}"
          CLIENT_2D_BUILD_SHA="${CLIENT_2D_BUILD_SHA:-}"

          echo "=== VPS Docker deploy entry ==="
          echo "App dir: $APP_DIR"
          echo "Branch: $BRANCH"
          echo "Client-2D archive: ${CLIENT_2D_ARCHIVE:-none}"
          echo "Client-2D build sha: ${CLIENT_2D_BUILD_SHA:-none}"

          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          if [ ! -d ".git" ]; then
            git clone --branch "$BRANCH" "$REPO_URL" .
          else
            git remote set-url origin "$REPO_URL" || true
            git fetch --no-tags origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            if [ -n "$CLIENT_2D_ARCHIVE" ]; then
              git clean -fd -e .env -e .env.local -e .env.docker -e data/ -e logs/ -e "$CLIENT_2D_ARCHIVE" -e apps/client-2d/dist/ || true
            else
              git clean -fd -e .env -e .env.local -e .env.docker -e data/ -e logs/ -e apps/client-2d/dist/ || true
            fi
          fi

          if [ -n "$CLIENT_2D_ARCHIVE" ] && [ -f "$APP_DIR/$CLIENT_2D_ARCHIVE" ]; then
            echo "Installing prebuilt client-2d artifact: $CLIENT_2D_ARCHIVE"
            rm -rf apps/client-2d/dist
            mkdir -p apps/client-2d
            tar -xzf "$APP_DIR/$CLIENT_2D_ARCHIVE" -C apps/client-2d
            test -f apps/client-2d/dist/index.html
            grep -q "$CLIENT_2D_MARKER" apps/client-2d/dist/index.html
            test -f apps/client-2d/dist/build-stamp.json
            if [ -n "$CLIENT_2D_BUILD_SHA" ]; then
              grep -q "$CLIENT_2D_BUILD_SHA" apps/client-2d/dist/build-stamp.json
            fi
          else
            echo "WARN: No prebuilt client-2d artifact found; Dockerfile must build and verify client-2d."
          fi

          chmod +x scripts/deploy-vps-docker.sh scripts/vps-docker-inline-deploy.sh 2>/dev/null || true

          ARELORIAN_PORT="${ARELORIAN_PORT:-3001}" \
          ARELORIAN_DOCKER_NETWORK="${ARELORIAN_DOCKER_NETWORK:-areloria_arelorian-network}" \
          ARELORIAN_ENV_FILE=".env.docker" \
          CLIENT_2D_ARCHIVE="$CLIENT_2D_ARCHIVE" \
          CLIENT_2D_MARKER="$CLIENT_2D_MARKER" \
          CLIENT_2D_BUILD_SHA="$CLIENT_2D_BUILD_SHA" \
          DEPLOY_BRANCH="$BRANCH" \
          bash scripts/deploy-vps-docker.sh
          EOF

      - name: Public health check
        run: |
          for path in /health / /portal/; do
            echo "Checking https://arelorian.de${path}"
            STATUS="$(curl -k -s -o /dev/null -w "%{http_code}" "https://arelorian.de${path}" || true)"
            echo "Status: ${STATUS}"
            if ! echo "$STATUS" | grep -Eq '^(200|204|301|302|304|401|403|503)$'; then
              echo "Health check failed for ${path}"
              exit 1
            fi
          done

          echo "Checking https://arelorian.de/2d/ for real client marker"
          BODY="$(curl -k -sS -L --max-time 20 "https://arelorian.de/2d/" || true)"
          if ! echo "$BODY" | grep -q "${CLIENT_2D_MARKER}"; then
            echo "ERROR: /2d/ did not serve the real Pixi client marker (${CLIENT_2D_MARKER}). Refusing silent placeholder route."
            echo "$BODY" | head -c 800
            exit 1
          fi
          echo "2D client marker OK: ${CLIENT_2D_MARKER}"

          echo "Checking https://arelorian.de/2d/build-stamp.json for exact commit"
          STAMP="$(curl -k -sS -L --max-time 20 "https://arelorian.de/2d/build-stamp.json" || true)"
          STAMP="$STAMP" CLIENT_2D_BUILD_SHA="$CLIENT_2D_BUILD_SHA" node -e '
            const raw = process.env.STAMP || "";
            let data;
            try { data = JSON.parse(raw); } catch (error) {
              console.error("ERROR: /2d/build-stamp.json did not return JSON");
              console.error(raw.slice(0, 800));
              process.exit(1);
            }
            if (data.commit !== process.env.CLIENT_2D_BUILD_SHA) {
              console.error(`ERROR: stale 2D bundle. expected=${process.env.CLIENT_2D_BUILD_SHA} got=${data.commit}`);
              process.exit(1);
            }
            console.log(`2D build stamp OK: ${data.commit}`);
          '

          echo "Checking https://arelorian.de/api/v1/client2d/bootstrap for server-authoritative starter state"
          BOOTSTRAP="$(curl -k -sS -L --max-time 20 "https://arelorian.de/api/v1/client2d/bootstrap" || true)"
          BOOTSTRAP="$BOOTSTRAP" node -e '
            const raw = process.env.BOOTSTRAP || "";
            let data;
            try { data = JSON.parse(raw); } catch (error) {
              console.error("ERROR: client2d bootstrap did not return JSON");
              console.error(raw.slice(0, 800));
              process.exit(1);
            }
            const ok = data.ok === true && data.contract === "client2d-bootstrap-v1" && data.starterNpcCount === 15 && data.hasMerchant === true && data.hasBlacksmith === true;
            if (!ok) {
              console.error("ERROR: client2d bootstrap contract failed");
              console.error(JSON.stringify(data, null, 2).slice(0, 1200));
              process.exit(1);
            }
            console.log(`Client2D bootstrap OK: ${data.starterNpcCount} starter NPCs, merchant=${data.hasMerchant}, blacksmith=${data.hasBlacksmith}`);
          '
