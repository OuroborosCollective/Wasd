name: ARE Monorepo Guardian

on:
  push:
    branches: ["main", "dev", "staging"]

  pull_request:
    branches: ["main", "dev", "staging"]

  workflow_dispatch:

  schedule:
    # Every day at 03:30 UTC
    - cron: '30 3 * * *'

concurrency:
  group: are-monorepo-guardian-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  guardian:
    name: Full Stack Monorepo Guardian
    runs-on: ubuntu-latest

    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        node-version: [20]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Detect Package Manager
        id: detect-pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi

      # -----------------------------
      # INSTALL
      # -----------------------------

      - name: Install PNPM
        if: steps.detect-pm.outputs.manager == 'pnpm'
        run: npm install -g pnpm

      - name: Install Dependencies (PNPM)
        if: steps.detect-pm.outputs.manager == 'pnpm'
        run: pnpm install --frozen-lockfile=false

      - name: Install Dependencies (Yarn)
        if: steps.detect-pm.outputs.manager == 'yarn'
        run: yarn install --ignore-engines

      - name: Install Dependencies (NPM)
        if: steps.detect-pm.outputs.manager == 'npm'
        run: npm install

      # -----------------------------
      # MONOREPO HEALTH
      # -----------------------------

      - name: Validate package.json files
        run: |
          find . -name package.json -not -path "*/node_modules/*" | while read file; do
            echo "Checking $file"
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))"
          done

      - name: Find duplicate dependencies
        run: |
          npx npm-check-updates || true
          npm dedupe || true

      - name: Audit vulnerabilities
        run: |
          npm audit fix --force || true

      - name: Upgrade outdated dependencies
        run: |
          npx npm-check-updates -u || true
          npm install || true

      # -----------------------------
      # ESLINT TERMINATOR
      # -----------------------------

      - name: Install ESLint Arsenal
        run: |
          npm install -D \
            eslint \
            @typescript-eslint/parser \
            @typescript-eslint/eslint-plugin \
            eslint-plugin-import \
            eslint-plugin-unused-imports \
            eslint-plugin-react \
            eslint-plugin-react-hooks \
            eslint-plugin-node \
            eslint-plugin-promise \
            eslint-plugin-security \
            eslint-plugin-sonarjs \
            eslint-plugin-unicorn \
            eslint-config-prettier \
            prettier \
            typescript \
            @microsoft/eslint-formatter-sarif

      - name: Generate fallback ESLint config
        run: |
          if [ ! -f .eslintrc.js ]; then
            cat > .eslintrc.js << 'EOF'
            module.exports = {
              root: true,
              env: {
                browser: true,
                node: true,
                es2022: true
              },
              parser: "@typescript-eslint/parser",
              plugins: [
                "@typescript-eslint",
                "unused-imports",
                "import",
                "security",
                "sonarjs",
                "unicorn"
              ],
              extends: [
                "eslint:recommended",
                "plugin:@typescript-eslint/recommended",
                "plugin:security/recommended",
                "plugin:sonarjs/recommended",
                "plugin:import/recommended",
                "prettier"
              ],
              ignorePatterns: [
                "dist/",
                "build/",
                "coverage/",
                "node_modules/"
              ],
              rules: {
                "unused-imports/no-unused-imports": "error",
                "no-console": "warn",
                "no-debugger": "error",
                "eqeqeq": "error",
                "curly": "error",
                "sonarjs/no-duplicate-string": "warn",
                "unicorn/prefer-node-protocol": "warn"
              }
            }
            EOF
          fi

      - name: Auto Fix Entire Monorepo
        run: |
          npx eslint . \
            --ext .js,.jsx,.ts,.tsx,.mjs,.cjs \
            --fix || true

      - name: Format Entire Monorepo
        run: |
          npx prettier . --write || true

      # -----------------------------
      # TYPESCRIPT / BUILD CHECKS
      # -----------------------------

      - name: TypeScript Validation
        run: |
          npx tsc --noEmit || true

      - name: Build Check
        run: |
          npm run build || true

      # -----------------------------
      # DEAD CODE EXTERMINATION
      # -----------------------------

      - name: Detect unused dependencies
        run: |
          npx depcheck || true

      - name: Detect circular dependencies
        run: |
          npx madge --circular . || true

      # -----------------------------
      # SECURITY SCAN
      # -----------------------------

      - name: Run CodeQL-compatible ESLint SARIF
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          npx eslint . \
            --ext .js,.jsx,.ts,.tsx \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

      # -----------------------------
      # AUTO COMMIT FIXES
      # -----------------------------

      - name: Commit Auto Repairs
        run: |
          git config user.name "ARE Guardian"
          git config user.email "guardian@github.actions"

          git add .

          git diff --cached --quiet || git commit -m "🤖 ARE Guardian auto-repair"

      - name: Push Auto Repairs
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

      # -----------------------------
      # FINAL STATUS
      # -----------------------------

      - name: Guardian Status
        run: |
          echo "=================================="
          echo "ARE MONOREPO GUARDIAN COMPLETE"
          echo "=================================="
          echo "Lint repaired"
          echo "Formatting repaired"
          echo "Dependencies updated"
          echo "Security audit executed"
          echo "Type checks executed"
          echo "Circular dependency scan complete"
          echo "Dead dependency scan complete"
          echo "=================================="
