name: ARE-Logic Auto Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install paramiko

      - name: Execute Deployment
        env:
          VPS_PASSWORD: ${{ secrets.ARELOGIC_VPS_PW }}
          GH_TOKEN: ${{ secrets.WASD_GITHUB_TOKEN }}
        run: python vps_deploy.py
