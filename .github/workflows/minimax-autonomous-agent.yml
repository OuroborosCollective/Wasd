name: MiniMax Autonomous Agent

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to perform'
        required: false
        default: 'full_analysis'
        type: choice
        options:
          - system_health
          - npc_health
          - ui_optimization
          - full_analysis
          - fix_issue

  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

env:
  NODE_VERSION: '22'

jobs:
  system-health-check:
    name: System Health Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run System Health Analysis via MiniMax
        run: |
          node << 'EOF'
          const { MiniMaxClient } = require('./server/src/ai/MiniMaxClient.js');
          
          const enabled = process.env.MINIMAX_ENABLED === 'true';
          if (!enabled) {
            console.log('MiniMax disabled - skipping health check');
            process.exit(0);
          }
          
          const minimax = new MiniMaxClient({
            apiKey: process.env.MINIMAX_API_KEY,
            enabled: true,
          });
          
          async function run() {
            const response = await minimax.requestSystemAnalysis();
            console.log('MiniMax Analysis:', JSON.stringify(response, null, 2));
          }
          
          run().catch(console.error);
          EOF
        continue-on-error: true
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_ENABLED: ${{ secrets.MINIMAX_ENABLED }}

  npc-civilization-health:
    name: NPC Civilization Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
