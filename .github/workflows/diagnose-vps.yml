name: Diagnose VPS
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          timeout: 3m
          command_timeout: 10m
          script: |
            set -x
            echo "=== Who am I ==="
            whoami
            echo "=== Uptime ==="
            uptime
            echo "=== PM2 status ==="
            pm2 status 2>&1 || echo "pm2 not found"
            echo "=== App dir ==="
            ls -la /opt/areloria/ 2>&1 || echo "dir not found"
            echo "=== Git status ==="
            cd /opt/areloria && git log --oneline -3 2>&1 || echo "git failed"
            echo "=== .env check ==="
            head -5 /opt/areloria/.env 2>&1 || echo "no .env"
            echo "=== Docker containers ==="
            docker ps --format '{{.Names}} {{.Status}}' 2>&1 || echo "docker not found"
            echo "=== Port 3000 ==="
            ss -tlnp | grep 3000 2>&1 || echo "port 3000 not listening"
            echo "=== PM2 logs (last 10) ==="
            pm2 logs areloria --lines 10 --nostream 2>&1 || echo "no pm2 logs"
