name: Import Kenney UI Pack

on:
  workflow_dispatch:
    inputs:
      create_pull_request:
        description: "Create a pull request with imported Kenney UI assets"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-kenney-ui-pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-kenney-ui-pack:
    name: Import Kenney UI Pack assets
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Verify incoming Kenney ZIP
        run: |
          test -f apps/client-2d/public/2d-assets/incoming/kenney-ui-pack/kenney_ui-pack.zip
          sha256sum apps/client-2d/public/2d-assets/incoming/kenney-ui-pack/kenney_ui-pack.zip

      - name: Dry-run Kenney import
        run: pnpm assets:pixi:import:kenney-ui:dry-run

      - name: Import Kenney UI assets
        run: pnpm assets:pixi:import:kenney-ui

      - name: Validate Pixi assets
        run: pnpm assets:pixi:validate

      - name: Summarize imported files
        run: |
          echo "## Kenney UI import" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated files:" >> "$GITHUB_STEP_SUMMARY"
          git status --short apps/client-2d/public/2d-assets/ui/kenney-ui-pack apps/client-2d/public/2d-assets/credits apps/client-2d/public/2d-assets/manifests >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request
        if: ${{ inputs.create_pull_request }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(client-2d): import Kenney UI Pack assets"
          branch: generated/kenney-ui-pack-assets
          delete-branch: true
          title: "feat(client-2d): import Kenney UI Pack assets"
          body: |
            ## Summary

            Imports the uploaded Kenney UI Pack ZIP into the client-2d Pixi asset tree.

            ## Generated by

            `.github/workflows/import-kenney-ui-pack.yml`

            ## Safety

            - Uses `scripts/import-kenney-ui-pack.mjs`.
            - Verifies the ZIP through the allowlisted SHA256 gate.
            - Skips `.ttf` and `.url` files by default.
            - Keeps assets visual-only.
            - Does not touch WorldTick, AREKernel, server registries or networking.

            ## Expected generated paths

            - `apps/client-2d/public/2d-assets/ui/kenney-ui-pack/`
            - `apps/client-2d/public/2d-assets/credits/kenney-ui-pack.json`
            - `apps/client-2d/public/2d-assets/manifests/generated/kenney-ui-pack.json`
          labels: |
            assets
            client-2d
            pixi
