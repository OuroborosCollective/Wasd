name: WASM Nginx Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wasm-nginx-fix.yml'
      - 'deploy/nginx-arelogic.space.conf'

jobs:
  fix-nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Nginx config and fix WASM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          timeout: 3m
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            
            echo "=== Step 1: Ensure WASM file exists ==="
            cd /opt/areloria/client
            WASM_COUNT=$(find dist/assets/ -name 'HavokPhysics*.wasm' 2>/dev/null | wc -l)
            echo "WASM files found: $WASM_COUNT"
            if [ "$WASM_COUNT" -eq 0 ]; then
              echo "WASM missing, rebuilding client..."
              NODE_OPTIONS="--max-old-space-size=8192" npx vite build 2>&1 | tail -5
            fi
            find dist/assets/ -name 'HavokPhysics*.wasm' -ls
            
            echo ""
            echo "=== Step 2: Backup current Nginx config ==="
            cp /etc/nginx/sites-enabled/arelogic.space /etc/nginx/sites-enabled/arelogic.space.bak.$(date +%s)
            
            echo ""
            echo "=== Step 3: Download new Nginx config ==="
            curl -sL "https://raw.githubusercontent.com/OuroborosCollective/Wasd/main/deploy/nginx-arelogic.space.conf" \
              -o /etc/nginx/sites-enabled/arelogic.space
            
            echo ""
            echo "=== Step 4: Verify and reload Nginx ==="
            nginx -t
            systemctl reload nginx
            
            echo ""
            echo "=== Step 5: Verify WASM serving ==="
            sleep 2
            curl -sI https://arelogic.space/assets/HavokPhysics-hlBZeaGL.wasm 2>/dev/null | head -8
            
            echo ""
            echo "=== DONE ==="
