name: Areloria Studio Control Plane

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/src/devtools/studio/**'
      - 'server/src/api/mcpRoute.ts'
      - 'server/migrations/*studio*'
      - 'game-data/visual/presentation_bindings.json'
      - 'game-data/visual/render_profiles.json'
      - 'apps/client-2d/src/LiveAuthoritativeWorld2D.tsx'
      - 'apps/client-2d/src/DeterministicWorldIsoAppHudBridge.tsx'
      - 'apps/client-2d/src/vite-env.d.ts'
      - 'client/src/engine/presentation/**'
      - 'client/src/engine/babylon/BabylonBoot.ts'
      - 'client/src/main.ts'
      - 'docs/ARELORIA_STUDIO_CONTROL_PLANE.md'
      - '.github/workflows/areloria-studio-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-contract:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          show-progress: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build shared declarations used by game clients/server
        run: pnpm --filter @wasd/shared build

      - name: Validate Studio authored JSON
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync("game-data/visual/presentation_bindings.json", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("game-data/visual/render_profiles.json", "utf8"))'
          node --check server/migrations/1787110800000_add-studio-runtime-assets.js

      - name: Typecheck server and Studio MCP tools
        run: pnpm --filter @wasd/server typecheck

      - name: Prove Studio truth/security contracts
        run: pnpm --filter @wasd/server exec vitest run src/devtools/studio/__tests__/contracts.test.ts

      - name: Differential typecheck touched 2D Studio files
        shell: bash
        run: |
          set +e
          pnpm --filter @wasd/client-2d exec tsc --noEmit > /tmp/client2d-tsc.log 2>&1
          baseline_status=$?
          set -e
          cat /tmp/client2d-tsc.log
          if grep -E 'src/(LiveAuthoritativeWorld2D|DeterministicWorldIsoAppHudBridge)\.tsx' /tmp/client2d-tsc.log; then
            echo 'Studio-touched 2D files have TypeScript errors.' >&2
            exit 1
          fi
          echo "Full client-2d tsc exit=${baseline_status}; pre-existing project-wide debt is reported but does not mask touched-file failures."

      - name: Build 2D live projection
        run: pnpm --filter @wasd/client-2d build

      - name: Differential typecheck touched Babylon 3D Studio files
        shell: bash
        run: |
          set +e
          pnpm --filter @wasd/client typecheck > /tmp/client3d-tsc.log 2>&1
          baseline_status=$?
          set -e
          cat /tmp/client3d-tsc.log
          if grep -E 'src/(main\.ts|engine/babylon/BabylonBoot\.ts|engine/presentation/StudioPresentation(Config|EngineBridge)\.ts)' /tmp/client3d-tsc.log; then
            echo 'Studio-touched 3D files have TypeScript errors.' >&2
            exit 1
          fi
          echo "Full Babylon client tsc exit=${baseline_status}; pre-existing project-wide debt is reported but does not mask touched-file failures."

      - name: Build Babylon 3D client
        run: pnpm --filter @wasd/client build

      - name: Re-run monorepo guard
        run: pnpm guard:monorepo

      - name: Re-run Areloria architecture guard
        run: pnpm guard:architecture

      - name: Re-run deterministic WorldTick guard
        run: pnpm guard:worldtick
