name: Jules Atomic Deploy

# Manual only — use `vps-docker-deploy.yml` for push-to-main Docker deploys.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to VPS
        run: bash scripts/deploy-vps.sh
        env:
          PRODUCTION_IP: ${{ secrets.INPUT_HOST }}
          DEPLOY_USER: ${{ secrets.INPUT_USERNAME }}
          DEPLOY_PATH: /opt/areloria
          SSH_PASSWORD: ${{ secrets.INPUT_PASSWORD }}
