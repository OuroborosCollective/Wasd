name: Areloria Genkit Control Plane

on:
  pull_request:
    branches: [main]
    paths:
      - 'genkit.sh'
      - '.mcp.json'
      - 'GENKIT.md'
      - 'server/src/devtools/genkit/**'
      - 'server/package.json'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/genkit-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genkit-contract:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build shared dependency used by server type declarations
        run: pnpm --filter @wasd/shared build

      - name: Typecheck server including Genkit flows
        run: pnpm --filter @wasd/server typecheck

      - name: Prove Genkit side-channel contract
        run: pnpm --filter @wasd/server exec vitest run src/devtools/genkit/__tests__/contracts.test.ts

      - name: Validate Genkit launcher and MCP config
        run: |
          bash -n genkit.sh
          bash genkit.sh help >/dev/null
          node -e 'JSON.parse(require("node:fs").readFileSync(".mcp.json", "utf8"))'

      - name: Resolve Genkit MCP CLI entry point
        run: bash genkit.sh mcp --help

      - name: Genkit doctor (provider credential optional in CI)
        run: bash genkit.sh doctor

      - name: Re-run Areloria architecture guard
        run: pnpm guard:architecture

      - name: Re-run deterministic world-tick guard
        run: pnpm guard:worldtick
