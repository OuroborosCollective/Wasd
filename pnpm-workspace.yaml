packages:
  - "packages/*"
  - "packages/sdk-examples/*"
  - "apps/*"
  - "projects/*"
  - "client"
  - "engine"
  - "portal"
  - "server"
  - "backend"

# pnpm v11: use boolean values (true/false) for allowBuilds, not strings
# Setting allowBuilds to true allows all packages to be built during install
allowBuilds: true
