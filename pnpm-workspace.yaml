packages:
  - "packages/*"
  - "packages/sdk-examples/*"
  - "apps/*"
  - "projects/*"
  - "client"
  - "engine"
  - "portal"
  - "server"
  - "backend"

# pnpm v11: use boolean values (true/false) for allowBuilds, not strings
# Setting allowBuilds to true allows all packages to be built during install
allowBuilds:
  '@firebase/util': true
  '@google/genai': true
  '@nestjs/core': true
  '@prisma/engines': true
  cpu-features: true
  esbuild: true
  prisma: true
  protobufjs: true
  ssh2: true
