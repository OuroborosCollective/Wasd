<!doctype html>
<html lang="en" data-areloria-shell="ultimate">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="areloria-client" content="REAL_PIXI_CLIENT" />
  <meta name="areloria-engine" content="PIXI_2D_DETERMINISTIC_10HZ" />
  <meta name="areloria-logic" content="ARE_OUROBOROS_PLEXITY" />
  <meta name="application-name" content="Areloria" />
  <meta name="description" content="Areloria · deterministic browser MMORPG client" />

  <meta name="theme-color" content="#0f0f1a" />
  <meta name="msapplication-TileColor" content="#0f0f1a" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Areloria" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta name="format-detection" content="telephone=no" />
  <meta name="color-scheme" content="dark" />

  <link rel="manifest" href="/manifest.webmanifest" />

  <title>Areloria · REAL_PIXI_CLIENT</title>

  <style>
    :root {
      --bg: #070711;
      --bg2: #101021;
      --cyan: #00e5ff;
      --green: #39ff14;
      --fire: #ff7a00;
      --text: #f5f7ff;
      --muted: rgba(245, 247, 255, 0.68);
      --danger: #ff416c;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    html {
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #root {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 30%, rgba(0, 229, 255, 0.14), transparent 34rem),
        radial-gradient(circle at 80% 70%, rgba(255, 122, 0, 0.12), transparent 28rem),
        linear-gradient(180deg, var(--bg2), var(--bg));
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      image-rendering: auto;
    }

    #boot-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding:
        calc(24px + var(--safe-top))
        calc(24px + var(--safe-right))
        calc(24px + var(--safe-bottom))
        calc(24px + var(--safe-left));
      z-index: 1;
      pointer-events: none;
    }

    .boot-card {
      width: min(420px, 92vw);
      padding: 22px;
      border: 1px solid rgba(0, 229, 255, 0.26);
      border-radius: 22px;
      background: rgba(7, 7, 17, 0.72);
      box-shadow:
        0 0 42px rgba(0, 229, 255, 0.12),
        inset 0 0 24px rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(12px);
    }

    .boot-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .boot-subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .boot-bar {
      position: relative;
      height: 8px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .boot-bar::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--green), var(--fire));
      animation: boot-pulse 1.4s ease-in-out infinite;
    }

    .boot-meta {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: rgba(245, 247, 255, 0.5);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    noscript {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
      text-align: center;
      z-index: 9999;
    }

    @keyframes boot-pulse {
      0% {
        transform: translateX(-120%);
      }
      50% {
        transform: translateX(85%);
      }
      100% {
        transform: translateX(260%);
      }
    }
  </style>
</head>

<body
  data-areloria-client="REAL_PIXI_CLIENT"
  data-areloria-mode="production"
  data-areloria-boot="cold"
>
  <noscript>
    Areloria braucht JavaScript, damit der REAL_PIXI_CLIENT starten kann.
  </noscript>

  <div id="root">
    <!-- Boot fallback - visible if React fails to mount -->
    <!-- React removes this element on successful mount -->
    <div
      id="boot-screen"
      data-testid="areloria-boot-fallback"
      aria-hidden="true"
      style="
        position:fixed;
        inset:0;
        display:grid;
        place-items:center;
        padding:24px;
        background:#070711;
        z-index:999;
      "
    >
      <div
        style="
          max-width:420px;
          width:100%;
          border:1px solid rgba(0,229,255,.3);
          border-radius:22px;
          padding:22px;
          background:rgba(7,7,17,.9);
          box-shadow:0 0 42px rgba(0,229,255,.12);
          text-align:center;
          font-family:system-ui,sans-serif;
          color:#f5f7ff;
        "
      >
        <h1 style="margin:0 0 8px;font-size:22px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;">
          Areloria
        </h1>
        <p style="margin:0 0 16px;color:rgba(245,247,255,.6);font-size:13px;line-height:1.5;">
          Lade REAL_PIXI_CLIENT · 10Hz · Ouroboros
        </p>
        <div style="
          height:8px;
          border-radius:999px;
          background:rgba(255,255,255,.08);
          overflow:hidden;
          margin-bottom:14px;
        ">
          <div style="
            height:100%;
            width:42%;
            border-radius:inherit;
            background:linear-gradient(90deg,#00e5ff,#39ff14,#ff7a00);
            animation:boot-pulse 1.4s ease-in-out infinite;
          "></div>
        </div>
        <p style="margin:0;color:rgba(245,247,255,.4);font-size:11px;letter-spacing:.08em;">
          PIXI · ARE · 10HZ
        </p>
        <noscript>
          <p style="margin-top:12px;color:#ff416c;">
            ⚠️ JavaScript erforderlich für Areloria.
          </p>
        </noscript>
        <p
          id="boot-fallback-warning"
          style="display:none;margin-top:12px;color:#ff7a00;font-size:12px;"
        >
          ⚠️ Boot fehlgeschlagen. Bitte neu laden.
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>

  <!-- Boot timeout fallback - shows warning if React doesn't mount within 10s -->
  <script>
    (function() {
      var BOOT_TIMEOUT_MS = 10000;
      var checkInterval = null;

      function showBootWarning() {
        var warning = document.getElementById('boot-fallback-warning');
        if (warning) {
          warning.style.display = 'block';
        }
        console.warn('[Areloria] Boot timeout - React may have failed to mount');
      }

      function checkBootStatus() {
        var bootAttr = document.body.dataset.areloriaBoot;
        var bootOk = document.body.dataset.client2dBoot;

        // If mounted successfully, stop checking
        if (bootAttr === 'mounted' || bootOk === 'ok') {
          clearInterval(checkInterval);
          return;
        }

        // If boot failed, clear interval
        if (bootAttr === 'failed' || bootOk === 'failed') {
          clearInterval(checkInterval);
          return;
        }
      }

      // Start checking after initial load
      setTimeout(function() {
        checkBootStatus();
        // If still not mounted after timeout, show warning
        checkInterval = setInterval(function() {
          var bootAttr = document.body.dataset.areloriaBoot;
          if (bootAttr !== 'mounted' && bootAttr !== 'failed') {
            showBootWarning();
            clearInterval(checkInterval);
          }
        }, 2000);
      }, BOOT_TIMEOUT_MS);
    })();
  </script>

  <!-- REAL_PIXI_CLIENT -->
</body>
</html>
