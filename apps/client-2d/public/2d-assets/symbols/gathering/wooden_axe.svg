<!-- 
  Areloria Gathering Tools - Pixel Art SVG Sprites
  Style: 16x16 pixel art, pixelated rendering
  Tools: Wooden Axe, Copper Pickaxe, Simple Fishing Rod
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Wooden Axe</title>
  <!-- Background -->
  <rect width="48" height="48" fill="transparent"/>
  
  <!-- Axe Handle (wooden brown) -->
  <rect x="22" y="20" width="4" height="20" fill="#8B4513"/>
  <rect x="23" y="20" width="2" height="20" fill="#A0522D"/>
  
  <!-- Axe Head (wooden brown) -->
  <rect x="12" y="12" width="14" height="6" fill="#8B4513"/>
  <rect x="13" y="13" width="12" height="4" fill="#A0522D"/>
  
  <!-- Axe Blade (copper colored) -->
  <rect x="10" y="8" width="8" height="4" fill="#B87333"/>
  <rect x="8" y="6" width="6" height="4" fill="#CD7F32"/>
  <rect x="6" y="8" width="4" height="8" fill="#B87333"/>
  <rect x="7" y="9" width="2" height="6" fill="#D4956A"/>
  
  <!-- Blade edge highlight -->
  <rect x="6" y="8" width="2" height="1" fill="#E8A860"/>
  <rect x="8" y="6" width="4" height="1" fill="#E8A860"/>
</svg>