<!-- 
  Areloria Gathering Tools - Copper Pickaxe
  Style: 16x16 pixel art, pixelated rendering
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Copper Pickaxe</title>
  <!-- Background -->
  <rect width="48" height="48" fill="transparent"/>
  
  <!-- Handle (wooden) -->
  <rect x="22" y="22" width="4" height="18" fill="#8B4513"/>
  <rect x="23" y="22" width="2" height="18" fill="#A0522D"/>
  
  <!-- Pickaxe Head Frame (copper) -->
  <rect x="10" y="12" width="28" height="4" fill="#B87333"/>
  <rect x="11" y="13" width="26" height="2" fill="#CD7F32"/>
  
  <!-- Left Pick Point -->
  <rect x="6" y="8" width="6" height="4" fill="#B87333"/>
  <rect x="4" y="6" width="4" height="4" fill="#CD7F32"/>
  <rect x="2" y="8" width="4" height="4" fill="#B87333"/>
  <rect x="3" y="9" width="2" height="2" fill="#D4956A"/>
  
  <!-- Right Pick Point -->
  <rect x="36" y="8" width="6" height="4" fill="#B87333"/>
  <rect x="40" y="6" width="4" height="4" fill="#CD7F32"/>
  <rect x="42" y="8" width="4" height="4" fill="#B87333"/>
  <rect x="43" y="9" width="2" height="2" fill="#D4956A"/>
  
  <!-- Center connection highlight -->
  <rect x="22" y="16" width="4" height="6" fill="#8B4513"/>
  <rect x="23" y="16" width="2" height="6" fill="#A0522D"/>
  
  <!-- Metal shine -->
  <rect x="12" y="12" width="2" height="1" fill="#E8A860"/>
  <rect x="34" y="12" width="2" height="1" fill="#E8A860"/>
</svg>