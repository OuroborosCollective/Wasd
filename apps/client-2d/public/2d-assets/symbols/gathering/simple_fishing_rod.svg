<!-- 
  Areloria Gathering Tools - Simple Fishing Rod
  Style: 16x16 pixel art, pixelated rendering
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Simple Fishing Rod</title>
  <!-- Background -->
  <rect width="48" height="48" fill="transparent"/>
  
  <!-- Rod Handle (wooden) -->
  <rect x="38" y="34" width="6" height="10" fill="#8B4513" rx="1"/>
  <rect x="39" y="35" width="4" height="8" fill="#A0522D"/>
  
  <!-- Rod Body (tapered) -->
  <rect x="34" y="8" width="4" height="26" fill="#8B4513"/>
  <rect x="35" y="8" width="2" height="26" fill="#A0522D"/>
  <rect x="30" y="6" width="4" height="4" fill="#8B4513"/>
  <rect x="31" y="6" width="2" height="4" fill="#A0522D"/>
  
  <!-- Rod Tip -->
  <rect x="28" y="4" width="4" height="4" fill="#B87333"/>
  <rect x="29" y="4" width="2" height="4" fill="#CD7F32"/>
  
  <!-- Fishing Line -->
  <rect x="28" y="8" width="1" height="28" fill="#E8E8E8"/>
  
  <!-- Hook -->
  <rect x="24" y="32" width="4" height="2" fill="#C0C0C0"/>
  <rect x="22" y="34" width="4" height="2" fill="#A8A8A8"/>
  <rect x="22" y="36" width="4" height="2" fill="#C0C0C0"/>
  <rect x="24" y="38" width="2" height="2" fill="#A8A8A8"/>
  <rect x="24" y="36" width="2" height="2" fill="#E8A860"/>
  
  <!-- Bobber (small float) -->
  <rect x="26" y="20" width="4" height="6" fill="#FF6B6B"/>
  <rect x="26" y="26" width="4" height="2" fill="#FFFFFF"/>
  <rect x="27" y="20" width="2" height="2" fill="#FF8888"/>
</svg>