version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: areloria_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: areloria_api
    restart: always
    environment:
      - DATABASE_URL=sqlite:////data/areloria.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - sqlite_data:/data
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: areloria_worker
    restart: always
    environment:
      - DATABASE_URL=sqlite:////data/areloria.db
      - REDIS_URL=redis://redis:6379/0
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - sqlite_data:/data
      - playwright_cache:/ms-playwright
    depends_on:
      - redis

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: areloria_dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  redis_data:
  sqlite_data:
  playwright_cache: