services:
  arelorian-engine:
    build:
      context: .
      dockerfile: Dockerfile.vps
    image: arelorian-engine:latest
    container_name: arelorian-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARELORIAN_PORT:-3001}:3001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      PORT: "3001"
      GAME_PORT: "3001"
      HOST: "0.0.0.0"

      # Redis: internal Docker DNS. Override in .env or GitHub/VPS env if needed.
      REDIS_URL: "${REDIS_URL:-}"
      REDIS_HOST: "${REDIS_HOST:-redis-comn-redis-1}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_USER: "${REDIS_USER:-}"
      REDIS_USERNAME: "${REDIS_USERNAME:-}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_TLS: "${REDIS_TLS:-false}"

      # Soketi / websocket bridge: internal Docker DNS defaults.
      SOKETI_HOST: "${SOKETI_HOST:-soketi-9eoa-soketi-1}"
      SOKETI_PORT: "${SOKETI_PORT:-6001}"
      SOKETI_URL: "${SOKETI_URL:-http://soketi-9eoa-soketi-1:6001}"
      PUSHER_HOST: "${PUSHER_HOST:-soketi-9eoa-soketi-1}"
      PUSHER_PORT: "${PUSHER_PORT:-6001}"
      PUSHER_SCHEME: "${PUSHER_SCHEME:-http}"
      NEXT_PUBLIC_WEBSOCKET_URL: "${NEXT_PUBLIC_WEBSOCKET_URL:-wss://arelorian.de/ws}"

      # Supabase: internal Docker DNS defaults for the VPS Supabase stack.
      SUPABASE_HOST: "${SUPABASE_HOST:-supabase-kong}"
      SUPABASE_PORT: "${SUPABASE_PORT:-8000}"
      SUPABASE_URL: "${SUPABASE_URL:-http://supabase-kong:8000}"
      SUPABASE_PROXY_URL: "${SUPABASE_PROXY_URL:-http://supabase-kong:8000}"
      SUPABASE_PUBLIC_URL: "${SUPABASE_PUBLIC_URL:-https://arelorian.de}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
      ANON_KEY: "${ANON_KEY:-}"
      POSTGRES_HOST: "${POSTGRES_HOST:-supabase-db}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - arelorian-network

  monitor-bridge:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    image: monitor-bridge:latest
    container_name: monitor-bridge
    restart: unless-stopped
    environment:
      ENGINE_URL: "http://arelorian-engine:3001"
      CHECK_INTERVAL: "60"
    depends_on:
      arelorian-engine:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - arelorian-network

networks:
  arelorian-network:
    external: true
    name: "${ARELORIAN_DOCKER_NETWORK:-areloria_arelorian-network}"
