services:
  arelorian-engine:
    build:
      context: .
      dockerfile: Dockerfile.vps
      args:
        CLIENT_2D_BUILD_SHA: "${CLIENT_2D_BUILD_SHA:-}"
        CLIENT_2D_MARKER: "${CLIENT_2D_MARKER:-REAL_PIXI_CLIENT}"
    pull_policy: build
    container_name: arelorian-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARELORIAN_PORT:-3001}:3001"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${ARELORIAN_DOCKER_NETWORK:-areloria_arelorian-network}"
      - "traefik.http.services.arelorian-engine.loadbalancer.server.port=3001"
      - "traefik.http.routers.arelorian-engine.rule=Host(`arelorian.de`) || Host(`www.arelorian.de`)"
      - "traefik.http.routers.arelorian-engine.entrypoints=websecure"
      - "traefik.http.routers.arelorian-engine.tls=true"
      - "traefik.http.routers.arelorian-engine.tls.certresolver=letsencrypt"
      - "traefik.http.routers.arelorian-engine.priority=10000"
      - "traefik.http.routers.arelorian-engine.service=arelorian-engine"
      - "traefik.http.routers.arelorian-engine-http.rule=Host(`arelorian.de`) || Host(`www.arelorian.de`)"
      - "traefik.http.routers.arelorian-engine-http.entrypoints=web"
      - "traefik.http.routers.arelorian-engine-http.middlewares=arelorian-engine-https-redirect"
      - "traefik.http.routers.arelorian-engine-http.priority=10000"
      - "traefik.http.middlewares.arelorian-engine-https-redirect.redirectscheme.scheme=https"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./game-data:/app/game-data:ro
      - ./private-assets:/opt/areloria/private-assets:ro
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "${NODE_OPTIONS:---max-old-space-size=8192}"
      PORT: "3001"
      GAME_PORT: "3001"
      HOST: "0.0.0.0"
      CLIENT_2D_MARKER: "${CLIENT_2D_MARKER:-REAL_PIXI_CLIENT}"
      CLIENT_2D_BUILD_SHA: "${CLIENT_2D_BUILD_SHA:-}"
      WASD_WORLD_SEED: "${WASD_WORLD_SEED:?WASD_WORLD_SEED is required for stateless deterministic world generation}"

      API_KEY: "${API_KEY:-}"
      API_KEYS: "${API_KEYS:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://arelorian.de,https://www.arelorian.de}"
      CORS_ORIGINS: "${CORS_ORIGINS:-https://arelorian.de,https://www.arelorian.de}"

      DATABASE_URL: "${DATABASE_URL:-}"
      DIRECT_URL: "${DIRECT_URL:-}"
      POSTGRES_HOST: "${POSTGRES_HOST:-supabase-db}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      SUPABASE_HOST: "${SUPABASE_HOST:-supabase-kong}"
      SUPABASE_PORT: "${SUPABASE_PORT:-8000}"
      SUPABASE_URL: "${SUPABASE_URL:-http://supabase-kong:8000}"
      SUPABASE_PROXY_URL: "${SUPABASE_PROXY_URL:-http://supabase-kong:8000}"
      SUPABASE_PUBLIC_URL: "${SUPABASE_PUBLIC_URL:-https://arelorian.de}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
      ANON_KEY: "${ANON_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      SERVICE_ROLE_KEY: "${SERVICE_ROLE_KEY:-}"
      JWT_SECRET: "${JWT_SECRET:-}"

      REDIS_URL: "${REDIS_URL:-}"
      REDIS_HOST: "${REDIS_HOST:-redis-comn-redis-1}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_USER: "${REDIS_USER:-}"
      REDIS_USERNAME: "${REDIS_USERNAME:-}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_TLS: "${REDIS_TLS:-false}"

      SOKETI_HOST: "${SOKETI_HOST:-soketi-9eoa-soketi-1}"
      SOKETI_PORT: "${SOKETI_PORT:-6001}"
      SOKETI_URL: "${SOKETI_URL:-http://soketi-9eoa-soketi-1:6001}"
      SOKETI_APP_ID: "${SOKETI_APP_ID:-}"
      SOKETI_APP_KEY: "${SOKETI_APP_KEY:-}"
      SOKETI_APP_SECRET: "${SOKETI_APP_SECRET:-}"
      PUSHER_HOST: "${PUSHER_HOST:-soketi-9eoa-soketi-1}"
      PUSHER_PORT: "${PUSHER_PORT:-6001}"
      PUSHER_SCHEME: "${PUSHER_SCHEME:-http}"
      PUSHER_APP_ID: "${PUSHER_APP_ID:-${SOKETI_APP_ID:-}}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY:-${SOKETI_APP_KEY:-}}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-${SOKETI_APP_SECRET:-}}"
      NEXT_PUBLIC_WEBSOCKET_URL: "${NEXT_PUBLIC_WEBSOCKET_URL:-wss://arelorian.de/ws}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => (r.ok || r.status === 503) ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - arelorian-network

  monitor-bridge:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    pull_policy: build
    container_name: monitor-bridge
    restart: unless-stopped
    environment:
      ENGINE_URL: "http://arelorian-engine:3001"
      CHECK_INTERVAL: "60"
      STARTUP_GRACE_SECONDS: "360"
      READINESS_PATHS: "/health,/client-config.json,/portal/"
    depends_on:
      arelorian-engine:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - arelorian-network

networks:
  arelorian-network:
    external: true
    name: "${ARELORIAN_DOCKER_NETWORK:-areloria_arelorian-network}"
