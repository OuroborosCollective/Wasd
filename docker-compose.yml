services:
  arelorian-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: arelorian-engine:latest
    container_name: arelorian-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARELORIAN_PORT:-3001}:3001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      PORT: "3001"
      GAME_PORT: "3001"
      HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - arelorian-network

  monitor-bridge:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    image: monitor-bridge:latest
    container_name: monitor-bridge
    restart: unless-stopped
    environment:
      ENGINE_URL: "http://arelorian-engine:3001"
      CHECK_INTERVAL: "60"
    depends_on:
      arelorian-engine:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - arelorian-network

networks:
  arelorian-network:
    driver: bridge
