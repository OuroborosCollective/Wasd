version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: database_service
    restart: unless-stopped
    environment:
      POSTGRES_DB: prod_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password_123
    networks:
      - backend_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d prod_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  application:
    image: nginx:alpine
    container_name: web_application
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend_network
      - backend_network
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    driver: local