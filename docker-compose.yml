version: '3.8'

services:
  arelorian-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: arelorian-engine:latest
    container_name: arelorian-engine
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - arelorian-network

  monitor-bridge:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    image: monitor-bridge:latest
    container_name: monitor-bridge
    restart: always
    environment:
      - ENGINE_URL=http://arelorian-engine:3000
      - CHECK_INTERVAL=60
    networks:
      - arelorian-network

networks:
  arelorian-network:
    driver: bridge