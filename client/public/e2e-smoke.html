<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>E2E smoke</title>
  </head>
  <body>
    <p id="e2e-status">connecting…</p>
    <pre id="e2e-welcome" style="white-space:pre-wrap;word-break:break-all;font-size:11px;opacity:0.85"></pre>
    <script>
      (function () {
        var status = document.getElementById("e2e-status");
        var proto = location.protocol === "https:" ? "wss" : "ws";
        var wsUrl = proto + "://" + location.host + "/ws";
        var ws = new WebSocket(wsUrl);
        ws.onopen = function () {
          ws.send(
            JSON.stringify({
              type: "login",
              guestId: "guest_e2e_smoke01",
              guestName: "E2E",
              sceneId: "didis_hub",
              spawnKey: "sp_player_default",
            })
          );
        };
        ws.onmessage = function (ev) {
          try {
            var d = JSON.parse(ev.data);
            if (d.type === "welcome") {
              document.body.dataset.e2eReady = "1";
              if (status) status.textContent = "welcome";
              var pre = document.getElementById("e2e-welcome");
              if (pre) pre.textContent = JSON.stringify(d);
            }
          } catch (e) {
            /* ignore */
          }
        };
        ws.onerror = function () {
          if (status) status.textContent = "ws error";
        };
      })();
    </script>
  </body>
</html>
